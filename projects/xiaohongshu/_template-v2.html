<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>造化坊 · 第N期 · 标题</title>
<style>
  /* ================================================================
     造化坊小红书 · V2 设计模板
     卡片 1080×1440px · 暗色系 · Noto Sans SC

     ⚠️ 文字对齐规则（Pixso code_to_design 兼容）:
       - 所有文字元素必须显式声明 text-align，不依赖继承
       - 居中用 text-align: center
       - 左对齐用 text-align: left
       - 在 CSS 注释中标注每块的对齐方式
  ================================================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; }

  /* ---- 共享基础样式 ---- */
  .card {
    width: 1080px; height: 1440px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 100px 80px;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    position: relative; overflow: hidden; flex-shrink: 0;
    /* 不设 text-align，每个文字元素各自声明 */
  }
  .card-num { position: absolute; top: 40px; right: 50px; font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 2px; font-weight: 600; }
  .creation-badge { position: absolute; bottom: 50px; font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 4px; font-weight: 600; text-align: center; }

  /* 背景色交替 */
  .card-1, .card-3, .card-5 { background: #141414; color: #f0f0f0; }
  .card-2, .card-4, .card-6 { background: #1a1a1a; color: #e0e0e0; }

  :root { --accent: #ff6b6b; }

  /* ---- Card 1: 封面 ---- */
  .card-1 .emoji { font-size: 56px; margin-bottom: 25px; }
  .card-1 h1 { font-size: 52px; font-weight: 900; line-height: 1.25; margin-bottom: 30px; letter-spacing: 2px; text-align: center; }
  .card-1 h1 .highlight { color: var(--accent); }
  .card-1 .subtitle { font-size: 24px; color: rgba(255,255,255,0.55); line-height: 1.8; text-align: center; }

  /* ---- Card 2: 拆解/对比 ---- */
  .card-2 .section-label { font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 6px; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card-2 h2 { font-size: 44px; font-weight: 800; margin-bottom: 50px; line-height: 1.35; letter-spacing: 1px; text-align: center; }
  .card-2 .decompose { width: 100%; display: flex; flex-direction: column; gap: 30px; }
  .card-2 .layer { border-radius: 16px; padding: 35px 40px; text-align: left; }
  .card-2 .layer .layer-head { font-size: 18px; font-weight: 700; letter-spacing: 2px; margin-bottom: 15px; text-align: left; }
  .card-2 .layer .layer-items { font-size: 22px; line-height: 2; text-align: left; }
  .card-2 .question { font-size: 26px; font-weight: 700; margin-top: 45px; color: #f0f0f0; line-height: 1.5; text-align: center; }

  /* ---- Card 3: 工具/方法展示 ---- */
  .card-3 .section-label { font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 6px; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card-3 h2 { font-size: 44px; font-weight: 800; margin-bottom: 50px; line-height: 1.35; letter-spacing: 1px; text-align: center; }
  .card-3 .tools { display: flex; gap: 25px; width: 100%; justify-content: center; }
  .card-3 .tool { flex: 1; max-width: 250px; border-radius: 16px; padding: 35px 25px; text-align: center; }
  .card-3 .tool .icon { font-size: 40px; margin-bottom: 15px; }
  .card-3 .tool .name { font-size: 22px; font-weight: 700; color: #f0f0f0; margin-bottom: 8px; text-align: center; }
  .card-3 .tool .role { font-size: 17px; color: rgba(255,255,255,0.40); line-height: 1.6; text-align: center; }
  .card-3 .note { font-size: 22px; color: rgba(255,255,255,0.40); margin-top: 50px; line-height: 1.6; text-align: center; }

  /* ---- Card 4: 步骤/流程 ---- */
  .card-4 .section-label { font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 6px; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card-4 h2 { font-size: 44px; font-weight: 800; margin-bottom: 55px; line-height: 1.3; letter-spacing: 1px; text-align: center; }
  .card-4 .steps { width: 100%; display: flex; flex-direction: column; gap: 24px; }
  .card-4 .step { display: flex; align-items: flex-start; gap: 28px; border-radius: 16px; padding: 28px 35px; text-align: left; }
  .card-4 .step-num { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; flex-shrink: 0; }
  .card-4 .step .step-content { flex: 1; text-align: left; }
  .card-4 .step .step-title { font-size: 24px; font-weight: 700; color: #f0f0f0; margin-bottom: 4px; text-align: left; }
  .card-4 .step .step-detail { font-size: 18px; color: rgba(255,255,255,0.40); line-height: 1.6; text-align: left; }
  .card-4 .summary { font-size: 22px; color: rgba(255,255,255,0.55); margin-top: 50px; line-height: 1.6; text-align: center; }

  /* ---- Card 5: 结果/产出 ---- */
  .card-5 .section-label { font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 6px; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card-5 h2 { font-size: 44px; font-weight: 800; margin-bottom: 45px; line-height: 1.3; letter-spacing: 1px; text-align: center; }
  .card-5 .output-specs { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .card-5 .spec-row { display: flex; align-items: center; gap: 20px; font-size: 24px; text-align: left; }
  .card-5 .spec-row .spec-label { color: rgba(255,255,255,0.30); min-width: 100px; font-size: 20px; text-align: left; }
  .card-5 .spec-row .spec-value { color: rgba(255,255,255,0.75); text-align: left; }
  .card-5 .closing { font-size: 28px; font-weight: 700; margin-top: 50px; line-height: 1.5; text-align: center; }

  /* ---- Card 6: CTA / 尾页 ---- */
  .card-6 .section-label { font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 6px; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card-6 h2 { font-size: 50px; font-weight: 900; line-height: 1.25; margin-bottom: 40px; letter-spacing: 2px; text-align: center; }
  .card-6 h2 .highlight { color: var(--accent); }
  .card-6 .body-text { font-size: 28px; line-height: 2.2; color: rgba(255,255,255,0.60); margin-bottom: 50px; text-align: center; }
  .card-6 .brand-line { font-size: 20px; color: rgba(255,255,255,0.30); letter-spacing: 4px; border-top: 1px solid rgba(255,255,255,0.10); padding-top: 40px; font-weight: 600; text-align: center; }
  .card-6 .cta-line { font-size: 24px; margin-top: 18px; font-weight: 700; color: var(--accent); text-align: center; }
</style>
</head>
<body>
<!--
  ================================================================
  完整预览页：6 张卡片合在一起，浏览器打开可看整体效果

  Pixso 导入时请使用 card-01.html ~ card-06.html（每个文件一张卡）
  导入顺序：card-01 → card-02 → ... → card-06
  每次导入前确认 Pixso 中无选中节点（点击画布空白处）
  导入后立即将 frame 重命名为: YYYY-MM-DD-主题名称-卡N
  ================================================================
-->
<!-- 6 cards here -->
</body>
</html>
