<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>救火英雄 · IAA 原型（9:16）· 美术升级版</title>
<style>
:root{ --c1:#ff8a3c; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#070a12;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#stage{position:relative;aspect-ratio:9/16;width:min(100vw,56.25vh);height:min(100vh,177.78vw);height:min(100dvh,177.78vw);margin:0 auto;background:#11162a;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,.18),rgba(0,0,0,0));color:#fff;font-size:clamp(11px,3.2vh,14px);font-weight:700;pointer-events:none}
.hud-item{display:flex;align-items:center;gap:4px;background:rgba(10,14,26,.55);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:4px 10px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
#pauseBtn{pointer-events:auto;background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:999px;width:30px;height:30px;font-size:15px;line-height:1;cursor:pointer}

/* overlays */
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;background:rgba(6,9,18,.78);backdrop-filter:blur(4px)}
.hidden{display:none!important}
.title{font-size:clamp(30px,9vh,46px);font-weight:900;color:#ffd24a;letter-spacing:3px;text-shadow:0 3px 0 #c2410c,0 8px 22px rgba(255,120,0,.45)}
.sub{color:#ffb199;font-size:clamp(12px,3.2vh,15px);line-height:1.7;max-width:86%}
.stat{color:#ffe9c9;font-size:clamp(13px,3.6vh,17px);font-weight:700;line-height:1.8}
.btn{min-width:min(72vw,300px);padding:13px 26px;border:none;border-radius:999px;font-size:clamp(15px,4.2vh,19px);font-weight:800;color:#fff;cursor:pointer;letter-spacing:1px;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .07s;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn-main{background:linear-gradient(180deg,#ff8a3c,#e84c0f)}
.btn-ad{background:linear-gradient(180deg,#54c8ff,#1e88e5)}
.btn-ghost{background:rgba(255,255,255,.14);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.badge{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;font-size:clamp(12px,3.2vh,14px);color:#ffe9c9;line-height:1.6}
.tag{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);font-size:10px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="450" height="800"></canvas>

  <div id="hud">
    <span class="hud-item">🔥<span id="hudLv">1</span>关</span>
    <span class="hud-item">⭐<span id="hudSc">0</span></span>
    <span class="hud-item">💰<span id="hudCn">0</span></span>
    <span class="hud-item">❤️<span id="hudLi">3</span></span>
    <span class="hud-item" id="hudGoal">🔥0 · 🧑0</span>
    <button id="pauseBtn">⏸</button>
  </div>

  <!-- 主菜单 -->
  <div id="ovMenu" class="overlay">
    <div class="title">救火英雄</div>
    <div class="sub">🌃 夜晚高楼起火 · 灭火或救人任一达成过关<br>按住屏幕任意位置（含底部地面）左右滑动控制消防员<br>撞击火焰灭火·撞救援窗抓人带回·接道具·小心火球和飞鸟</div>
    <button class="btn btn-main" id="btnStart">🔥 开始灭火</button>
    <button class="btn btn-ad" id="btnAdCoin">📺 看广告 +50 金币（模拟点位）</button>
    <button class="btn btn-ghost" id="btnExport">🎨 导出元件素材 (PNG+JSON)</button>
    <button class="btn btn-ghost" id="btnSkin">🧥 皮肤：经典</button>
    <div class="badge">最高分：<span id="menuBest">0</span></div>
    <div class="tag">IAA 点位：激励视频复活 / 通关双倍 / 菜单领币</div>
  </div>

  <!-- 模拟激励视频广告 -->
  <div id="ovAd" class="overlay hidden">
    <div class="title" style="font-size:clamp(20px,6vh,30px)">📺 模拟激励视频</div>
    <div id="adCount" class="sub">广告加载中…</div>
    <button class="btn btn-ad hidden" id="adSkip">跳过并领取奖励</button>
  </div>

  <!-- 通关 -->
  <div id="ovLevel" class="overlay hidden">
    <div class="title" style="font-size:clamp(24px,7vh,36px)">✅ 扑灭成功！</div>
    <div id="levelStats" class="stat"></div>
    <button class="btn btn-ad" id="btnDouble">📺 看广告双倍金币</button>
    <button class="btn btn-main" id="btnNext">下一关 →</button>
  </div>

  <!-- 游戏结束 -->
  <div id="ovOver" class="overlay hidden">
    <div class="title" style="color:#ff5a4d">💧 任务失败…</div>
    <div id="overStats" class="stat"></div>
    <div class="stat">最高分：<span id="overBest">0</span></div>
    <button class="btn btn-ad" id="btnRevive">📺 看广告复活</button>
    <button class="btn btn-main" id="btnRetry">重新开始</button>
    <button class="btn btn-ghost" id="btnMenu">主菜单</button>
  </div>

  <!-- 暂停 -->
  <div id="ovPause" class="overlay hidden">
    <div class="title" style="font-size:clamp(24px,7vh,36px)">⏸ 已暂停</div>
    <button class="btn btn-main" id="btnResume">继续</button>
    <button class="btn btn-ghost" id="btnPauseMenu">主菜单</button>
  </div>
</div>

<script>
(function(){
"use strict";
// ===== 画布 =====
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var W=450,H=800;
canvas.width=W;canvas.height=H;

// ===== DOM =====
function $(id){return document.getElementById(id);}
var hudLv=$('hudLv'),hudSc=$('hudSc'),hudCn=$('hudCn'),hudLi=$('hudLi'),hudGoal=$('hudGoal');
var ovMenu=$('ovMenu'),ovAd=$('ovAd'),ovLevel=$('ovLevel'),ovOver=$('ovOver'),ovPause=$('ovPause');
var adCount=$('adCount'),adSkip=$('adSkip');

// ===== 常量 =====
var PW=92,PH=18,PY=H-150;
var BRICK_COLS=7,BRICK_W=48,BRICK_H=48,BRICK_GAP=4;
var GRID_TOP=80; // 建筑层窗户网格与交互层砖块的共同起点（严格对齐）
var FACADE_X0=(W-(BRICK_COLS*BRICK_W+(BRICK_COLS-1)*BRICK_GAP))/2; // 自动随砖块尺寸计算
// 火焰等级对应的命中次数（powerLevel=0 时）；powerLevel 越高命中越少
var FIRE_HIT_REQ=[3,5,7]; // level 1/2/3 需要命中次数
// 道具定义（P1 扩展：火球/直升机/人头/增益）
var ITEM_DEF={
  bag:  {name:'钱袋',color:'#ffd24a',pos:true},
  wide: {name:'长条',color:'#7ef0a0',pos:true},
  hammer:{name:'锤子',color:'#ff9a4d',pos:false},
  extinguish:{name:'灭火器',color:'#8fd8ff',pos:true},
  up:   {name:'1UP',color:'#ff8a3c',pos:true},
  fireball:{name:'火球',color:'#ff3b30',pos:false},
  heli: {name:'直升机',color:'#7ec8ff',pos:true},
  life: {name:'人头',color:'#ff7eb0',pos:true},
  boost:{name:'增益',color:'#c9a6ff',pos:true},
  horn: {name:'喇叭',color:'#7ce0c0',pos:true},
  keychain:{name:'钥匙链',color:'#ffd700',pos:true}
};
var ITEM_KEYS=['bag','wide','hammer','extinguish','up','fireball','heli','life','boost','horn','keychain'];

// 皮肤定义（P2）：3 款，金币解锁
var SKINS=[
  {id:'classic',name:'经典',cost:0,suit:'#f7c948',helm:'#e6392f'},
  {id:'blue',  name:'抢险蓝',cost:300,suit:'#4fc3f7',helm:'#1e88e5'},
  {id:'red',   name:'烈焰红',cost:800,suit:'#ff7043',helm:'#d84315'}
];

// ===== 游戏状态 =====
var S={state:'menu',level:1,score:0,coins:0,lives:3,best:0,powerLevel:0,fireLeft:0,rescueLeft:0,skin:0};
var levelBonus=0,reviveUsed=false;
var paddle={x:(W-PW)/2,tx:(W-PW)/2,y:PY,w:PW,baseW:PW,onFire:false};
var ball=null;
var bricks=[],particles=[],texts=[],people=[],items=[],enemies=[],bonusCoins=[];
var levelPending=false,levelTimer=0;
var timerBoost=0; // 长条/锤子限时剩余帧（>0 生效）
var carryTimer=0; // 抓人后带到球的剩余(用于回落判定)
var heli=null; // 直升机对象（P1）
var bonusActive=false,bonusTimer=0; // BONUS TIME（P1）
var pierceTimer=0; // 增益·穿透无敌剩余帧（P1）
// P2：室内 Bonus 关
var indoorTimer=0, indoorDoors=[], indoorKeys=0, indoorFound=false;
var ownedSkins=[0]; // 已解锁皮肤 id 列表（0=经典默认）

// 手配关卡布局（每行 7 字符：F=火1级 f=火2级 g=火3级 R=救援窗 r=红窗 .=空）
var LEVEL_LAYOUTS=[
  ['FFF','F.F','R.R'],                        // L1 入门
  ['FFR','FfF','RFr','...'],                  // L2 引入2级火+红窗
  ['FfR','RgF','fF.','RrR'],                  // L3 引入3级火
  ['gFR','fgr','FRf','rRF'],                  // L4 混编
  ['RrR','FgF','fRf','gRg','RrR'],            // L5 火人平衡
  ['ffR','ggr','FFr','fRg','rRf','RrF']       // L6 高压
];

// ===== 音频（简单合成音效）=====
var actx=null;
function ensureAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==='suspended'){ actx.resume().catch(function(){}); }
}
function tone(f,dur,type,vol,delay,slideTo){
  if(!actx)return;
  var t0=actx.currentTime+(delay||0);
  try{
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(vol||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function sfx(n){
  switch(n){
    case 'bounce': tone(300,0.06,'square',0.07); break;
    case 'break': tone(240,0.10,'sawtooth',0.08,0,90); break;
    case 'rescue': tone(660,0.09,'sine',0.11); tone(990,0.12,'sine',0.11,0.07); break;
    case 'coin': tone(880,0.06,'square',0.07); tone(1320,0.09,'square',0.07,0.05); break;
    case 'lose': tone(220,0.25,'sawtooth',0.09,0,110); break;
    case 'win': tone(523,0.10,'triangle',0.11); tone(659,0.10,'triangle',0.11,0.09); tone(784,0.18,'triangle',0.11,0.18); break;
    case 'launch': tone(420,0.08,'sine',0.07,0,720); break;
    case 'click': tone(500,0.05,'square',0.05); break;
  }
}

// ===== 存档 =====
function loadBest(){ try{ S.best=parseInt(localStorage.getItem('fireHeroBest')||'0',10)||0; }catch(e){ S.best=0; } }
function saveBest(){ try{ localStorage.setItem('fireHeroBest',String(S.best)); }catch(e){} }
function loadSkins(){
  try{
    var o=JSON.parse(localStorage.getItem('fireHeroSkins')||'{"owned":[0],"cur":0}');
    ownedSkins=o.owned||[0]; S.skin=o.cur||0;
  }catch(e){ ownedSkins=[0]; S.skin=0; }
}
function saveSkins(){ try{ localStorage.setItem('fireHeroSkins',JSON.stringify({owned:ownedSkins,cur:S.skin})); }catch(e){} }
function refreshSkinBtn(){
  var sk=SKINS[S.skin]||SKINS[0];
  $('btnSkin').textContent='🧥 皮肤：'+sk.name;
}
// 皮肤循环切换（未解锁的用金币购买）
function cycleSkin(){
  var next=(S.skin+1)%SKINS.length;
  if(ownedSkins.indexOf(next)===-1){
    var cost=SKINS[next].cost;
    if(S.coins>=cost){ S.coins-=cost; ownedSkins.push(next); addText(W/2,H*0.3,'已解锁 '+SKINS[next].name+'! -'+cost+'💰','#ffd700'); sfx('win'); }
    else { addText(W/2,H*0.3,'金币不足 ('+cost+'💰)','#ff5a4d'); sfx('lose'); return; }
  }
  S.skin=next; saveSkins(); refreshSkinBtn(); renderHUD();
}

// ===== 关卡 =====
function buildLevel(lvl){
  bricks=[]; people=[]; particles=[]; texts=[]; items=[]; enemies=[]; bonusCoins=[];
  levelPending=false; S.fireLeft=0; S.rescueLeft=0;
  bonusActive=false; heli=null; paddle.onFire=false; pierceTimer=0; timerBoost=0;
  var x0=FACADE_X0, top=GRID_TOP;
  var list=[],i,r,c,ch,lev;
  var layout=lvl<=LEVEL_LAYOUTS.length?LEVEL_LAYOUTS[lvl-1]:null;
  if(layout){
    // 手配布局：每行 7 字符
    for(r=0;r<layout.length;r++){
      var row=layout[r];
      for(c=0;c<BRICK_COLS;c++){
        ch=c<row.length?row.charAt(c):'.';
        if(ch==='.'||ch==='N') continue; // 空窗/普通窗
        lev=1;
        if(ch==='f')lev=2; else if(ch==='g')lev=3;
        if(ch==='R'||ch==='r'){
          list.push({x:x0+c*(BRICK_W+BRICK_GAP),y:top+r*(BRICK_H+BRICK_GAP),w:BRICK_W,h:BRICK_H,level:1,req:1,hp:999,type:'rescue',red:(ch==='r'),seed:Math.random()*10});
        }else{
          list.push({x:x0+c*(BRICK_W+BRICK_GAP),y:top+r*(BRICK_H+BRICK_GAP),w:BRICK_W,h:BRICK_H,level:lev,req:FIRE_HIT_REQ[lev-1],hp:FIRE_HIT_REQ[lev-1],type:'fire',red:false,seed:Math.random()*10});
        }
      }
    }
  }else{
    // 程序化布局（lvl>6 起）：行数递增 + 火等级递增
    var rows=Math.min(5+Math.floor((lvl-7)/2),8);
    var maxLv=lvl>=12?3:(lvl>=9?2:1);
    for(r=0;r<rows;r++){
      for(c=0;c<BRICK_COLS;c++){
        if(Math.random()<0.12) continue; // 留空
        lev=1;
        if(maxLv>=2&&Math.random()<0.3+(r/rows)*0.2) lev=2;
        if(maxLv>=3&&Math.random()<0.12) lev=3;
        list.push({x:x0+c*(BRICK_W+BRICK_GAP),y:top+r*(BRICK_H+BRICK_GAP),w:BRICK_W,h:BRICK_H,level:lev,req:FIRE_HIT_REQ[lev-1],hp:FIRE_HIT_REQ[lev-1],type:'fire',red:false,seed:Math.random()*10});
      }
    }
    // 程序化布局加入救援窗
    var n=Math.min(2+Math.floor(lvl/3),5);
    var idx=list.map(function(_,k){return k;}).sort(function(){return Math.random()-0.5;}).slice(0,n);
    for(i=0;i<idx.length;i++){
      list[idx[i]].type='rescue'; list[idx[i]].red=(Math.random()<0.35);
      list[idx[i]].hp=999;
    }
  }
  bricks=list;
  // 统计目标：火=所有火砖；人=所有普通救援窗（红窗不计入硬目标）
  var fires=0,rescues=0;
  for(i=0;i<bricks.length;i++){
    if(bricks[i].type==='fire') fires++;
    else if(bricks[i].type==='rescue'&&!bricks[i].red) rescues++;
  }
  S.fireLeft=fires; S.rescueLeft=rescues;
  // 生成飞行敌人（鸟/UFO）：1 只起步，每 3 关 +1，上限 3
  var eCount=Math.min(1+Math.floor(lvl/3),3);
  for(i=0;i<eCount;i++){
    enemies.push({
      x:x0+30+Math.random()*(W-2*x0-60), y:GRID_TOP+40+Math.random()*120,
      vx:(Math.random()<0.5?-1:1)*(1+Math.random()*1.2), vy:(Math.random()<0.5?-1:1)*0.6,
      r:11, type:(Math.random()<0.6||lvl<4)?'bird':'ufo', seed:Math.random()*10
    });
  }
}
function resetBall(){
  var sp=Math.min(5+(S.level-1)*0.3,8.5);
  ball={x:paddle.x+PW/2,y:paddle.y-12,dx:0,dy:0,r:7,speed:sp,stuck:true,trail:[],carrying:false};
}
function launch(){
  if(!ball||!ball.stuck)return;
  var ang=(Math.random()*0.8-0.4);
  ball.dx=ball.speed*Math.sin(ang);
  ball.dy=-Math.abs(ball.speed*Math.cos(ang));
  ball.stuck=false; sfx('launch');
}

// ===== 关卡流程 =====
function startGame(){
  S.level=1;S.score=0;S.coins=0;S.lives=3;S.powerLevel=0;reviveUsed=false;
  buildLevel(1); resetBall(); timerBoost=0;
  S.state='playing';
  ovMenu.classList.add('hidden'); ovOver.classList.add('hidden'); ovPause.classList.add('hidden');
  renderHUD(); sfx('click');
}
function nextLevel(){
  S.level++; buildLevel(S.level); resetBall(); timerBoost=0;
  S.state='playing'; ovLevel.classList.add('hidden');
  renderHUD();
}
function levelComplete(){
  S.state='levelup';
  var bonus=10+S.level*10;
  levelBonus=bonus;
  S.score+=bonus; S.coins+=bonus;
  renderHUD(); sfx('win');
  $('levelStats').innerHTML='本关奖励<br>⭐ +'+bonus+' 分　💰 +'+bonus+' 金币';
  ovLevel.classList.remove('hidden');
}
function gameOver(){
  S.state='over';
  if(S.score>S.best){S.best=S.score;saveBest();}
  $('overBest').textContent=S.best;
  $('overStats').innerHTML='到达第 '+S.level+' 关<br>得分 '+S.score+'　金币 '+S.coins;
  $('btnRevive').style.display=reviveUsed?'none':'block';
  ovOver.classList.remove('hidden'); sfx('lose');
}
function loseLife(){
  sfx('lose'); S.lives--;
  if(S.lives<=0){ gameOver(); }
  else { resetBall(); }
  renderHUD();
}

// ===== 特效 =====
function sparks(x,y,n,color){
  var i,a,sp;
  for(i=0;i<n;i++){ a=Math.random()*Math.PI*2; sp=1+Math.random()*3; particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,size:1.5+Math.random()*2,color:color||'#ffd24a',type:'spark'}); }
}
function smoke(x,y){
  for(var i=0;i<6;i++){ particles.push({x:x+(Math.random()*18-9),y:y+(Math.random()*8-4),vx:(Math.random()*0.8-0.4),vy:-0.5-Math.random()*0.6,life:1,size:4+Math.random()*6,color:'#8d99a6',type:'smoke'}); }
}
function splash(x,y,color){
  for(var i=0;i<7;i++){ var a=-Math.PI/2+(Math.random()*1.3-0.65); particles.push({x:x,y:y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,life:0.7,size:1.8+Math.random()*2,color:color||'#9fe0ff',type:'spark'}); }
}
function addText(x,y,txt,color){ texts.push({x:x,y:y,txt:txt,life:1,color:color||'#fff'}); }
// 道具掉落：命中火砖后按概率掉一个（正负比约7:3），从火砖位置下落；掉率随关卡略升
function maybeDropItem(x,y){
  var chance=Math.min(0.28+S.level*0.015,0.45);
  if(Math.random()>chance) return;
  var r=Math.random(), key;
  if(r<0.16) key='bag';
  else if(r<0.30) key='wide';
  else if(r<0.46) key='hammer';
  else if(r<0.60) key='extinguish';
  else if(r<0.72) key='up';
  else if(r<0.82) key='fireball';   // P1 火球（负向，蹦床着火）
  else if(r<0.90) key='boost';      // P1 增益（穿透无敌）
  else if(r<0.96) key='life';       // P1 人头（+1命）
  else if(r<0.985) key='heli';      // P1 直升机（触发 BONUS TIME）
  else if(r<0.995) key='horn';      // P2 喇叭（全屏灭火）
  else key='keychain';              // P2 钥匙链（进入室内关）
  items.push({x:x,y:y-10,vy:1.2,vx:(Math.random()-0.5)*1.2,key:key,seed:Math.random()*10});
}
function hitBrick(b,i){
  if(b.type==='rescue'){
    // 救人：撞到救援窗 → 生成"被抓人"附着球上（球带人），窗口关闭，rescueLeft 递减（仅普通窗）
    bricks.splice(i,1);
    if(!b.red){ S.rescueLeft=Math.max(0,S.rescueLeft-1); addText(b.x+b.w/2,b.y-8,'抓住人!','#7ef0a0'); }
    else { addText(b.x+b.w/2,b.y-8,'救人!','#7ef0a0'); }
    ball.carrying=true;
    sparks(b.x+b.w/2,b.y+b.h/2,8,'#7ef0a0');
    splash(b.x+b.w/2,b.y+b.h/2,'#eaffff'); sfx('coin');
    renderHUD(); return;
  }
  // 灭火：减少命中次数（受 powerLevel 加成；命中一次 hp-1）
  b.hp--;
  sfx('break');
  splash(b.x+b.w/2,b.y+b.h/2,'#9fe0ff');
  sparks(b.x+b.w/2,b.y+b.h/2,4,'#fff3d6');
  if(b.hp<=0){
    bricks.splice(i,1);
    S.fireLeft=Math.max(0,S.fireLeft-1);
    var pts=15*b.level;
    S.score+=pts; addText(b.x+b.w/2,b.y,'+'+pts,'#9fe0ff');
    smoke(b.x+b.w/2,b.y+b.h/2);
    maybeDropItem(b.x+b.w/2,b.y);
  }
  renderHUD();
}
// 道具效果
function applyItem(it){
  var def=ITEM_DEF[it.key];
  sfx('coin');
  if(it.key==='bag'){
    var pts=it.seed%2?50:25;
    S.score+=pts; S.coins+=Math.round(pts/10);

  }else if(it.key==='wide'){ // 长条：加宽蹦床
    paddle.w=paddle.baseW+30; timerBoost=480; addText(it.x,it.y-10,'蹦床加宽!','#7ef0a0');
  }else if(it.key==='hammer'){ // 锤子：收窄蹦床（负向）
    paddle.w=Math.max(40,paddle.baseW-24); timerBoost=480; addText(it.x,it.y-10,'蹦床变窄!','#ff9a4d'); sfx('lose');
  }else if(it.key==='extinguish'){ // 灭火器：扑灭蹦床上的火
    paddle.onFire=false;
    addText(it.x,it.y-10,'灭火器!','#8fd8ff');
  }else if(it.key==='up'){ // 1UP：灭火等级+1（蓝→绿→红）
    if(S.powerLevel<2){
      S.powerLevel++;
      // 灭火更快：所有未灭火砖剩余需求降低 1（不计到低于1）
      for(var k=0;k<bricks.length;k++){ if(bricks[k].type==='fire'){ bricks[k].hp=Math.max(1,bricks[k].hp-1); } }
      addText(it.x,it.y-10,'灭火等级提升!','#ff8a3c');
    }
    else { S.score+=50; addText(it.x,it.y-10,'+50','#ff8a3c'); }
  }else if(it.key==='fireball'){ // 火球：蹦床着火；着火时再吃一个丢一条命
    if(paddle.onFire){
      S.lives=Math.max(0,S.lives-1); sfx('lose');
      addText(it.x,it.y-10,'蹦床起火! -1命','#ff3b30');
      if(S.lives<=0){ gameOver(); return; }
    }else{
      paddle.onFire=true;
      addText(it.x,it.y-10,'蹦床着火了!','#ff3b30'); sfx('lose');
    }
  }else if(it.key==='boost'){ // 增益：限时穿透无敌（穿过火焰砖）
    pierceTimer=480; // 8秒
    addText(it.x,it.y-10,'无敌穿透!','#c9a6ff');
  }else if(it.key==='life'){ // 人头：+1命（上限6）
    S.lives=Math.min(S.lives+1,6);
    addText(it.x,it.y-10,'+1命!','#ff7eb0');
  }else if(it.key==='heli'){ // 直升机：飞过屏幕，球弹进起落架→BONUS TIME
    heli={x:W+50,y:GRID_TOP+30,dir:-1,speed:2.2};
    addText(it.x,it.y-10,'直升机来了!','#7ec8ff');
  }else if(it.key==='horn'){ // 喇叭：龙王喷雨，全屏灭火直接过关
    S.score+=200; S.coins+=20;
    // 下雨粒子
    for(var rn=0;rn<40;rn++){
      particles.push({x:Math.random()*W,y:Math.random()*H*0.5,vx:0,vy:4+Math.random()*3,life:1,size:1.2+Math.random()*1.5,color:'rgba(160,210,255,0.7)',type:'rain'});
    }
    // 全屏灭火
    for(var fi2=bricks.length-1;fi2>=0;fi2--){
      if(bricks[fi2].type==='fire'){
        smoke(bricks[fi2].x+bricks[fi2].w/2,bricks[fi2].y+bricks[fi2].h/2);
        bricks.splice(fi2,1);
      }
    }
    S.fireLeft=0;
    addText(it.x,it.y-14,'龙王喷雨! 全屏灭火 +200','#7ce0c0');
    sfx('win'); renderHUD();
  }else if(it.key==='keychain'){ // 钥匙链：进入室内 Bonus 关（翻门找钥匙）
    startIndoor();
    addText(it.x,it.y-14,'进入大楼内部!','#ffd700');
  }
  renderHUD();
}
// ===== P2 室内 Bonus 关（翻门找钥匙） =====
function startIndoor(){
  S.state='indoor';
  indoorTimer=900; // 15秒
  indoorFound=false;
  indoorDoors=[];
  var contents=['whitekey','redkey','clock','bomb','life','person','empty','empty','empty'];
  contents.sort(function(){return Math.random()-0.5;});
  for(var i=0;i<9;i++){
    indoorDoors.push({x:60+(i%3)*110,y:180+Math.floor(i/3)*130,w:90,h:110,open:false,content:contents[i]});
  }
  sfx('click');
}
function updateIndoor(dt){
  indoorTimer-=dt;
  if(indoorTimer<=0){ // 时间到：返回当前关
    S.state='playing'; resetBall();
    addText(W/2,H*0.4,'时间到，回到大楼…','#ff9a4d');
    return;
  }
  // 检查是否已翻出钥匙并处理
  if(indoorFound){
    S.state='playing';
    if(indoorFound==='white'){ levelComplete(); }
    else { S.level+=1; levelComplete(); } // 红钥匙：跳一关
    return;
  }
}
function openIndoorDoor(d){
  if(d.open||indoorFound)return;
  d.open=true;
  var content=d.content;
  if(content==='whitekey'){ indoorFound='white'; addText(d.x+45,d.y-10,'白钥匙! 过关','#ffd700'); sfx('win'); }
  else if(content==='redkey'){ indoorFound='red'; addText(d.x+45,d.y-10,'红钥匙! 跳关','#ff3b30'); sfx('win'); }
  else if(content==='clock'){ indoorTimer=Math.min(indoorTimer+300,1200); addText(d.x+45,d.y-10,'时钟 +5秒','#8fd8ff'); sfx('coin'); }
  else if(content==='bomb'){ indoorTimer=Math.max(indoorTimer-240,60); addText(d.x+45,d.y-10,'炸弹 -4秒!','#ff3b30'); sfx('lose'); }
  else if(content==='life'){ S.lives=Math.min(S.lives+1,6); addText(d.x+45,d.y-10,'人头 +1命','#ff7eb0'); sfx('coin'); renderHUD(); }
  else if(content==='person'){ S.score+=80; S.coins+=5; addText(d.x+45,d.y-10,'被困人员 +80','#7ef0a0'); sfx('coin'); renderHUD(); }
  else { addText(d.x+45,d.y-10,'空的…','rgba(255,255,255,0.5)'); }
}
function drawIndoor(T){
  // 室内背景
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a2f3d'); g.addColorStop(1,'#14171f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 顶部标题与倒计时
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font='bold 20px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('大楼内部 · 找钥匙',W/2,60);
  ctx.font='bold 16px system-ui,sans-serif';
  ctx.fillStyle=indoorTimer<300?'#ff5a4d':'#ffd24a';
  ctx.fillText('⏱ '+(Math.ceil(indoorTimer/60))+'s',W/2,95);
  // 门
  for(var i=0;i<indoorDoors.length;i++){
    var d=indoorDoors[i];
    if(!d.open){
      // 未开：木门
      var dg=ctx.createLinearGradient(d.x,0,d.x+d.w,0);
      dg.addColorStop(0,'#8a5a33'); dg.addColorStop(0.5,'#a06b3e'); dg.addColorStop(1,'#7a4e2b');
      ctx.fillStyle=dg; rr(d.x,d.y,d.w,d.h,6); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2; rr(d.x,d.y,d.w,d.h,6); ctx.stroke();
      // 门板纹
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(d.x+8,d.y+8); ctx.lineTo(d.x+8,d.y+d.h-8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(d.x+d.w-8,d.y+8); ctx.lineTo(d.x+d.w-8,d.y+d.h-8); ctx.stroke();
      // 把手
      ctx.fillStyle='#ffd24a'; ctx.beginPath(); ctx.arc(d.x+d.w-16,d.y+d.h/2,4,0,7); ctx.fill();
    }else{
      // 已开：暗室 + 内容
      ctx.fillStyle='#0f1218'; rr(d.x,d.y,d.w,d.h,6); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2; rr(d.x,d.y,d.w,d.h,6); ctx.stroke();
      var cx=d.x+d.w/2, cy=d.y+d.h/2;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if(d.content==='whitekey'||d.content==='redkey'){
        ctx.fillStyle=d.content==='whitekey'?'#ffe9a8':'#ff5a4d';
        ctx.font='bold 34px system-ui,sans-serif'; ctx.fillText('🔑',cx,cy-6);
        ctx.font='bold 13px system-ui,sans-serif';
        ctx.fillText(d.content==='whitekey'?'白钥匙':'红钥匙',cx,cy+22);
      }else if(d.content==='clock'){ ctx.font='28px system-ui,sans-serif'; ctx.fillText('⏰',cx,cy); }
      else if(d.content==='bomb'){ ctx.font='28px system-ui,sans-serif'; ctx.fillText('💣',cx,cy); }
      else if(d.content==='life'){ ctx.font='28px system-ui,sans-serif'; ctx.fillText('🧑🚒',cx,cy); }
      else if(d.content==='person'){ ctx.font='28px system-ui,sans-serif'; ctx.fillText('🧍',cx,cy); }
      else { ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='22px system-ui,sans-serif'; ctx.fillText('·',cx,cy); }
      ctx.textBaseline='alphabetic';
    }
  }
  ctx.textAlign='start';
  // 提示
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='13px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('点击门翻找 · 白钥匙过关 · 红钥匙跳关',W/2,H-60);
  ctx.textAlign='start';
}
function fxStep(dt,T){
  var i,p,t;
  for(i=particles.length-1;i>=0;i--){
    p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type==='spark'){ p.vy+=0.08*dt; p.life-=dt*0.035; }
    else if(p.type==='ember'){ p.vy-=0.004*dt; p.x+=Math.sin(T*4+p.y*0.08)*0.06*dt; p.life-=dt*0.03; }
    else if(p.type==='smoke'){ p.size+=0.09*dt; p.vy-=0.004*dt; p.life-=dt*0.022; }
    else if(p.type==='rain'){ p.vy+=0.2*dt; p.life-=dt*0.02; }
    if(p.life<=0)particles.splice(i,1);
  }
  for(i=texts.length-1;i>=0;i--){
    t=texts[i]; t.y-=0.5*dt; t.life-=dt*0.018;
    if(t.life<=0)texts.splice(i,1);
  }
}

// ===== 更新 =====
function update(dt){
  var i,b,cx,cy,ox,oy,p;
  // P2 室内关：独立逻辑
  if(S.state==='indoor'){
    updateIndoor(dt);
    fxStep(dt,performance.now()/1000);
    return;
  }
  // BONUS TIME：独立阶段，球冻结，只处理天空金币（挡板仍可移动）
  if(bonusActive){
    paddle.x+=(paddle.tx-paddle.x)*Math.min(1,dt*0.45);
    bonusTimer-=dt;
    for(i=bonusCoins.length-1;i>=0;i--){
      var bc=bonusCoins[i];
      bc.y+=bc.vy*dt;
      if(bc.y>paddle.y&&bc.y<paddle.y+24&&bc.x>paddle.x-6&&bc.x<paddle.x+paddle.w+6){
        bonusCoins.splice(i,1); S.score+=10; S.coins+=1;
        addText(bc.x,bc.y-12,'+10','#ffd24a'); sparks(bc.x,bc.y,6,'#ffd24a'); sfx('coin'); renderHUD();
      }else if(bc.y>H+16){ bonusCoins.splice(i,1); }
    }
    if(bonusTimer<=0){ bonusActive=false; levelComplete(); }
    fxStep(dt,performance.now()/1000);
    return;
  }
  paddle.x+=(paddle.tx-paddle.x)*Math.min(1,dt*0.45);
  if(ball.stuck){ ball.x=paddle.x+PW/2; ball.y=paddle.y-12; }
  else{
    // 球在大楼立面范围内才记录拖尾；飞出大楼（天空/暗边）立即清空，避免残影印在背景层
    var inFacade=(ball.x>=FACADE_X0&&ball.x<=W-FACADE_X0&&ball.y>=GRID_TOP-8);
    if(inFacade){ ball.trail.push({x:ball.x,y:ball.y}); if(ball.trail.length>8)ball.trail.shift(); }
    else { ball.trail.length=0; }
    ball.x+=ball.dx*dt; ball.y+=ball.dy*dt;
    // 弹球边界：画布边缘（全屏弹跳）
    if(ball.x<ball.r){ball.x=ball.r;ball.dx=Math.abs(ball.dx);}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.dx=-Math.abs(ball.dx);}
    if(ball.y<ball.r+6){ball.y=ball.r+6;ball.dy=Math.abs(ball.dy);}
    // 球拍反弹
    if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+PH+8&&ball.x>=paddle.x-6&&ball.x<=paddle.x+PW+6){
      var rel=(ball.x-(paddle.x+PW/2))/(PW/2);
      var ang=rel*1.1;
      var sp=Math.max(ball.speed,Math.hypot(ball.dx,ball.dy)*1.004);
      ball.dx=Math.sin(ang)*sp;
      ball.dy=-Math.abs(Math.cos(ang)*sp);
      if(Math.abs(ball.dy)<2.4)ball.dy=-2.4;
      ball.y=paddle.y-ball.r;
      ball.speed=Math.min(ball.speed+0.015,10);
      sfx('bounce'); splash(ball.x,ball.y+ball.r,'#bde8ff');
      // 带回的人弹起瞬间获救（原版核心：抓人→带回蹦床→弹起获救）
      if(ball.carrying){
        ball.carrying=false;
        S.score+=100; S.coins+=5;
        addText(ball.x,ball.y-16,'获救! +100 💰+5','#7ef0a0');
        sparks(ball.x,ball.y,10,'#7ef0a0'); sfx('rescue'); renderHUD();
      }
    }
    // 砖块碰撞
    for(i=bricks.length-1;i>=0;i--){
      b=bricks[i]; cx=b.x+b.w/2; cy=b.y+b.h/2;
      // 穿透无敌（boost）：直接穿过火焰砖，不反弹不灭火
      if(pierceTimer>0&&b.type==='fire'){
        ox=(b.w/2+ball.r)-Math.abs(ball.x-cx);
        oy=(b.h/2+ball.r)-Math.abs(ball.y-cy);
        if(ox>0&&oy>0){
          S.score+=2; bricks.splice(i,1); S.fireLeft=Math.max(0,S.fireLeft-1);
          sparks(cx,cy,4,'#c9a6ff'); renderHUD();
        }
        continue;
      }
      ox=(b.w/2+ball.r)-Math.abs(ball.x-cx);
      oy=(b.h/2+ball.r)-Math.abs(ball.y-cy);
      if(ox>0&&oy>0){
        if(ox<oy){ ball.dx=ball.x<cx?-Math.abs(ball.dx):Math.abs(ball.dx); ball.x+=ball.x<cx?-ox:ox; }
        else { ball.dy=ball.y<cy?-Math.abs(ball.dy):Math.abs(ball.dy); ball.y+=ball.y<cy?-oy:oy; }
        hitBrick(b,i); break;
      }
    }
    // 敌人碰撞（借力反弹 + 加分）
    for(i=enemies.length-1;i>=0;i--){
      var en=enemies[i];
      var ddx=ball.x-en.x, ddy=ball.y-en.y;
      var dist=Math.sqrt(ddx*ddx+ddy*ddy);
      if(dist<ball.r+en.r){
        var nx=ddx/(dist||1), ny=ddy/(dist||1);
        var sp=Math.max(ball.speed,Math.hypot(ball.dx,ball.dy)*1.01);
        ball.dx=nx*sp; ball.dy=ny*sp;
        ball.speed=Math.min(ball.speed+0.01,10);
        en.vx*=-1; en.vy*=-1;
        S.score+=20; addText(en.x,en.y-14,'借力 +20','#ffd24a');
        sparks(en.x,en.y,6,'#ffd24a'); sfx('bounce');
      }
    }
    // 直升机：球弹进起落架 → 触发 BONUS TIME
    if(heli){
      var hx=heli.x, hy=heli.y;
      var hdx=ball.x-hx, hdy=ball.y-hy;
      if(Math.sqrt(hdx*hdx+hdy*hdy)<ball.r+26){
        heli=null;
        bonusActive=true; bonusTimer=600;
        // 生成天空金币
        bonusCoins=[];
        for(var bc=0;bc<10;bc++){
          bonusCoins.push({x:20+Math.random()*(W-40),y:-20-Math.random()*H*0.5,vy:2+Math.random()*1.5});
        }
        addText(hx,hy-20,'上直升机! BONUS TIME','#7ec8ff');
        sfx('win'); renderHUD();
      }
    }
    if(ball.y-ball.r>H+10){ loseLife(); return; }
    // 双通道胜利：火全灭 或 人全救 任一达成即过关
    if((S.fireLeft<=0||S.rescueLeft<=0)&&!levelPending){ levelPending=true; levelTimer=55; }
  }
  // 火焰砖持续飘出火星
  for(i=0;i<bricks.length;i++){
    b=bricks[i];
    if(b.type==='fire'&&Math.random()<0.02*b.level){
      particles.push({x:b.x+Math.random()*b.w,y:b.y+Math.random()*b.h*0.6,vx:(Math.random()-0.5)*0.5,vy:-0.4-Math.random()*0.9,life:1,size:1.2+Math.random()*1.6,color:Math.random()<0.5?'#ffb347':'#ff7a1c',type:'ember'});
    }
    // 红窗周期性跳人（可选择性接住，接住加分）
    if(b.type==='rescue'&&b.red&&Math.random()<0.004){
      people.push({x:b.x+b.w/2,y:b.y+b.h,vy:0,seed:Math.random()*10,jumper:true});
    }
  }
  // 掉落/跳楼人员下落
  for(i=people.length-1;i>=0;i--){
    p=people[i]; p.vy=Math.min(p.vy+0.06*dt,2.0); p.y+=p.vy*dt;
    if(p.y>paddle.y&&p.y<paddle.y+26&&p.x>paddle.x-6&&p.x<paddle.x+PW+6){
      people.splice(i,1);
      if(p.jumper){ S.score+=50; addText(p.x,p.y-14,'接住 +50','#ffe27a'); }
      else { S.score+=100; S.coins+=5; addText(p.x,p.y-14,'救回! +100 💰+5','#ffe27a'); }
      sparks(p.x,p.y,10,'#ffe27a'); sfx('rescue'); renderHUD();
    }else if(p.y>H+14){ if(!p.jumper){ S.rescueLeft=Math.max(0,S.rescueLeft+1); } people.splice(i,1); }
  }
  // 道具下落接取
  for(i=items.length-1;i>=0;i--){
    p=items[i]; p.vy=Math.min(p.vy+0.08*dt,3.4); p.y+=p.vy*dt; p.x+=p.vx*dt;
    if(p.x<10){p.x=10;p.vx=Math.abs(p.vx);}
    if(p.x>W-10){p.x=W-10;p.vx=-Math.abs(p.vx);}
    if(p.y>paddle.y-14&&p.y<paddle.y+30&&p.x>paddle.x-6&&p.x<paddle.x+paddle.w+6){
      applyItem(p); items.splice(i,1);
    }else if(p.y>H+14){ items.splice(i,1); }
  }
  // 道具限时效果（长条/锤子）
  if(timerBoost!==0){
    timerBoost-=dt;
    if(timerBoost<=0){
      paddle.w=paddle.baseW; timerBoost=0;
    }
  }
  // 穿透无敌计时
  if(pierceTimer>0){ pierceTimer-=dt; if(pierceTimer<0)pierceTimer=0; }
  // 蹦床着火：持续飘火星（若被灭火器扑灭则停止）
  if(paddle.onFire&&Math.random()<0.15){
    particles.push({x:paddle.x+Math.random()*paddle.w,y:paddle.y,vx:(Math.random()-0.5)*0.6,vy:-0.5-Math.random()*0.8,life:0.8,size:2+Math.random()*2,color:Math.random()<0.5?'#ffb347':'#ff7a1c',type:'ember'});
  }
  // 敌人移动（在立面范围内浮动）
  for(i=0;i<enemies.length;i++){
    var en=enemies[i];
    en.x+=en.vx*dt; en.y+=en.vy*dt;
    if(en.x<FACADE_X0+8||en.x>W-FACADE_X0-8){ en.vx*=-1; en.x=Math.max(FACADE_X0+8,Math.min(W-FACADE_X0-8,en.x)); }
    if(en.y<GRID_TOP+10||en.y>H-160){ en.vy*=-1; en.y=Math.max(GRID_TOP+10,Math.min(H-160,en.y)); }
  }
  // 直升机移动（从右往左飞过）
  if(heli){
    heli.x+=heli.speed*heli.dir*dt;
    heli.y+=Math.sin(performance.now()/1000*3)*0.4*dt;
    if(heli.x<-80){ heli=null; addText(W/2,H*0.3,'直升机飞走了…','#7ec8ff'); }
  }
  if(levelPending){ levelTimer-=dt; if(levelTimer<=0){ levelPending=false; levelComplete(); } }
  fxStep(dt,performance.now()/1000);
}

// ===== 绘制工具 =====
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function flameTongue(x,baseY,w,h,seed,T,color){
  var sway=Math.sin(T*8+seed)*w*0.18;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x-w*0.5,baseY);
  ctx.quadraticCurveTo(x-w*0.3,baseY-h*0.55,x+sway,baseY-h);
  ctx.quadraticCurveTo(x+w*0.3,baseY-h*0.55,x+w*0.5,baseY);
  ctx.closePath();
  ctx.fill();
}

// ===== 分层绘制：背景层 → 建筑层 → 交互层(砖块) → 地面层 =====
// 背景层：纯氛围（夜空 + 星星 + 月亮 + 远景公园剪影）
function drawSkyLayer(T){
  // 夜空（铺满整屏作为每帧清屏基底，杜绝任何区域因未重绘而残留像素）
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#070a18'); sky.addColorStop(0.6,'#131b36'); sky.addColorStop(1,'#1b2644');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // 星星（闪烁）
  ctx.fillStyle='rgba(255,255,255,0.55)';
  for(var i=0;i<30;i++){
    var sx=(i*67.3)%W, sy=(i*41.7)%(GRID_TOP-16);
    var tw=0.35+0.3*Math.sin(T*1.4+i*1.7);
    ctx.globalAlpha=Math.max(0.1,tw);
    ctx.fillRect(sx,sy,1.6,1.6);
  }
  ctx.globalAlpha=1;
  // 月亮（带光晕）
  ctx.fillStyle='rgba(235,240,255,0.85)';
  ctx.beginPath(); ctx.arc(W-42,26,13,0,7); ctx.fill();
  ctx.fillStyle='rgba(235,240,255,0.18)';
  ctx.beginPath(); ctx.arc(W-42,26,20,0,7); ctx.fill();
  // 远景公园剪影（树冠）
  ctx.fillStyle='#0d1424';
  for(var k=0;k<5;k++){
    var tx=10+k*92, ty=GRID_TOP-10;
    ctx.beginPath();
    ctx.arc(tx,ty-14,16+ (k%2)*6,0,7); ctx.fill();
    ctx.beginPath();
    ctx.arc(tx+18,ty-10,12+(k%3)*4,0,7); ctx.fill();
    ctx.fillRect(tx-3,ty-12,5,14);
  }
}
// 建筑层：大楼 + 正方形窗户网格（与交互层砖块同一网格，严格对齐）
function drawBuildingLayer(T){
  // 两侧相邻建筑暗边
  ctx.fillStyle='#0e1426';
  ctx.fillRect(0,0,10,H); ctx.fillRect(W-10,0,10,H);
  ctx.fillStyle='rgba(255,190,90,0.10)';
  ctx.fillRect(3,120+((T*14)%180),2,3); ctx.fillRect(W-6,220+((T*10)%140),2,3);
  // 主体大楼外立面（从窗户网格顶到地面层）
  var groundTop=H-140;
  var facade=ctx.createLinearGradient(0,GRID_TOP-8,0,groundTop);
  facade.addColorStop(0,'#333d5c'); facade.addColorStop(0.5,'#29314d'); facade.addColorStop(1,'#1e2540');
  ctx.fillStyle=facade; ctx.fillRect(FACADE_X0-8,GRID_TOP-8,W-(FACADE_X0-8)*2,groundTop-(GRID_TOP-8));
  // 正方形窗户网格（与砖块网格同公式：x=FACADE_X0+c*(W+GAP), y=GRID_TOP+r*(H+GAP)）
  var r,c,lit,ph;
  var winRows=Math.floor((groundTop-GRID_TOP)/(BRICK_H+BRICK_GAP))+1;
  for(r=0;r<winRows;r++){
    for(c=0;c<BRICK_COLS;c++){
      var wx=FACADE_X0+c*(BRICK_W+BRICK_GAP), wy=GRID_TOP+r*(BRICK_H+BRICK_GAP);
      // 窗洞
      ctx.fillStyle='#0f1526';
      rr(wx,wy,BRICK_W,BRICK_H,3); ctx.fill();
      // 部分窗户"打开"透光（暖光室内，微微波动）
      lit=((r*13+c*7+r*c)%17)<4;
      if(lit){
        ph=r*2.1+c*0.9;
        ctx.fillStyle='rgba(255,178,84,'+(0.13+0.09*Math.sin(T*1.5+ph)).toFixed(3)+')';
        rr(wx+4,wy+4,BRICK_W-8,BRICK_H-8,2); ctx.fill();
      }
      // 窗框（白色细框，强调正方形）
      ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=2;
      rr(wx,wy,BRICK_W,BRICK_H,3); ctx.stroke();
      // 窗棂（十字）
      ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(wx+BRICK_W/2,wy+4); ctx.lineTo(wx+BRICK_W/2,wy+BRICK_H-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(wx+4,wy+BRICK_H/2); ctx.lineTo(wx+BRICK_W-4,wy+BRICK_H/2); ctx.stroke();
      // 玻璃反光斜线
      ctx.strokeStyle='rgba(200,230,255,0.12)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(wx+8,wy+BRICK_H-8); ctx.lineTo(wx+16,wy+BRICK_H-16); ctx.stroke();
    }
  }
  // 顶部浓烟（从楼顶飘出）
  for(var i2=0;i2<8;i2++){
    var smx=40+i2*52+Math.sin(T*0.35+i2*1.3)*14;
    var smy=GRID_TOP-16-((T*9+i2*46)%90);
    var smr=18+(i2%3)*9;
    ctx.fillStyle='rgba(118,128,148,'+(0.05+0.05*(i2%2)).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(smx,smy,smr,0,7); ctx.fill();
  }
  // 顶部火场辉光
  var glow=ctx.createRadialGradient(W/2,GRID_TOP-16,10,W/2,GRID_TOP-16,240);
  glow.addColorStop(0,'rgba(255,110,25,'+(0.20+0.05*Math.sin(T*2.2)).toFixed(3)+')');
  glow.addColorStop(1,'rgba(255,110,25,0)');
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,GRID_TOP+180);
}
// 地面层：操作区前景
function drawGroundLayer(T){
  var groundTop=H-140;
  var gnd=ctx.createLinearGradient(0,groundTop,0,H);
  gnd.addColorStop(0,'#2a3142'); gnd.addColorStop(0.35,'#1d2434'); gnd.addColorStop(1,'#10151f');
  ctx.fillStyle=gnd; ctx.fillRect(0,groundTop,W,H-groundTop);
  // 地面路沿
  ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(0,groundTop,W,2);
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(0,groundTop+2,W,2);
  // 路面横线（暗示可拖动区域）
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(var gy=groundTop+16;gy<H;gy+=22){
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
  }
  // 滑动提示
  ctx.fillStyle='rgba(255,255,255,0.30)';
  ctx.font='bold 13px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('◀ 按住地面滑动控制消防员 ▶',W/2,groundTop+18);
  // 消防水带
  ctx.strokeStyle='#c8a24a'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(6,H-10); ctx.quadraticCurveTo(W*0.28,H-96,W*0.5,H-30);
  ctx.quadraticCurveTo(W*0.72,H-90,W-6,H-14); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=5; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(6,H-10); ctx.lineTo(W-6,H-14); ctx.stroke();
  // 消防车警灯（红蓝交替闪烁）
  var beacon=(Math.floor(T*1.6)%2===0);
  var bc=beacon?'#ff3b30':'#2f7bff';
  var b2=beacon?'#2f7bff':'#ff3b30';
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(10,H-26,40,14); ctx.fillRect(W-50,H-26,40,14);
  ctx.fillStyle=bc;
  ctx.beginPath(); ctx.arc(21,H-19,5,0,7); ctx.fill();
  ctx.fillStyle=b2;
  ctx.beginPath(); ctx.arc(W-21,H-19,5,0,7); ctx.fill();
  ctx.fillStyle='rgba('+(bc==='#ff3b30'?'255,59,48':'47,123,255')+',0.22)';
  ctx.beginPath(); ctx.arc(21,H-19,10,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(W-21,H-19,10,0,7); ctx.fill();
}
function drawBg(T){
  drawSkyLayer(T);
  drawBuildingLayer(T);
  drawGroundLayer(T);
}

// ===== 交互层：火焰窗砖（正方形窗户 + 窗棂 + 火，与建筑层窗户同网格） =====
function drawFireBrick(b,T){
  var cx=b.x+b.w/2, cy=b.y+b.h/2;
  // 火光
  var g=ctx.createRadialGradient(cx,cy,2,cx,cy,26);
  g.addColorStop(0,'rgba(255,120,30,'+(0.22+0.10*Math.sin(T*9+b.seed)).toFixed(3)+')');
  g.addColorStop(1,'rgba(255,120,30,0)');
  ctx.fillStyle=g; ctx.fillRect(b.x-10,b.y-12,b.w+20,b.h+26);
  // 窗户：窗洞 + 白色窗框（与建筑层窗户一致）
  ctx.fillStyle='#0f1526'; rr(b.x,b.y,b.w,b.h,3); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.30)'; ctx.lineWidth=2;
  rr(b.x,b.y,b.w,b.h,3); ctx.stroke();
  // 窗棂（十字）
  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,b.y+4); ctx.lineTo(cx,b.y+b.h-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x+4,cy); ctx.lineTo(b.x+b.w-4,cy); ctx.stroke();
  // 火焰（分层，火焰等级越高火越大，从窗内燃起；剩余命中越少火越弱）
  var flick=0.82+0.22*Math.sin(T*9+b.seed*3)+0.10*Math.sin(T*23+b.seed*7);
  var hpFrac=b.hp/b.req;
  var fh=(14+9*b.level)*Math.max(0.35,hpFrac)*Math.max(0.6,flick);
  var baseY=b.y+b.h-6;
  flameTongue(cx-10,baseY,14,fh*1.00,b.seed,T,'rgba(214,50,30,0.95)');
  flameTongue(cx+9,baseY,14,fh*0.86,b.seed+2,T,'rgba(214,50,30,0.95)');
  flameTongue(cx,baseY,16,fh*0.74,b.seed+1,T,'rgba(255,122,28,0.98)');
  flameTongue(cx-6,baseY,11,fh*0.48,b.seed+3,T,'rgba(255,194,30,0.98)');
  flameTongue(cx+6,baseY,11,fh*0.44,b.seed+4,T,'rgba(255,194,30,0.98)');
  flameTongue(cx,baseY,8,fh*0.26,b.seed+5,T,'rgba(255,244,194,0.98)');
}

// ===== 交互层：求救窗砖（正方形窗户 + 窗内被困人员，与建筑层窗户同网格） =====
function drawRescueBrick(b,T){
  var cx=b.x+b.w/2, cy=b.y+b.h/2;
  // 柔和黄光（红窗用红色脉冲）
  if(b.red){
    var rg=ctx.createRadialGradient(cx,cy,2,cx,cy,26);
    rg.addColorStop(0,'rgba(255,80,60,'+(0.20+0.10*Math.sin(T*4+b.seed)).toFixed(3)+')');
    rg.addColorStop(1,'rgba(255,80,60,0)');
    ctx.fillStyle=rg; ctx.fillRect(b.x-12,b.y-14,b.w+24,b.h+30);
  }else{
    var g=ctx.createRadialGradient(cx,cy,2,cx,cy,26);
    g.addColorStop(0,'rgba(255,226,122,'+(0.16+0.08*Math.sin(T*3.2+b.seed)).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,226,122,0)');
    ctx.fillStyle=g; ctx.fillRect(b.x-12,b.y-14,b.w+24,b.h+30);
  }
  // 窗户：窗洞 + 窗框（红窗红框，普通窗白框）
  ctx.fillStyle='#0f1526'; rr(b.x,b.y,b.w,b.h,3); ctx.fill();
  ctx.strokeStyle=b.red?'rgba(255,90,70,0.5)':'rgba(255,255,255,0.30)'; ctx.lineWidth=2;
  rr(b.x,b.y,b.w,b.h,3); ctx.stroke();
  // 窗棂（十字，半透明）
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,b.y+4); ctx.lineTo(cx,b.y+b.h-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x+4,cy); ctx.lineTo(b.x+b.w-4,cy); ctx.stroke();
  // 室内暖光
  ctx.fillStyle='rgba(255,214,130,0.10)'; rr(b.x+5,b.y+5,b.w-10,b.h-10,2); ctx.fill();
  // 被困人员（挥手呼救，站满窗户）
  var px=cx, py=b.y+b.h*0.52;
  var wave=Math.sin(T*4+b.seed)*0.55;
  // 手臂
  ctx.strokeStyle='#ffb74d'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(px-6,py-7); ctx.lineTo(px-11+Math.sin(wave)*3,py-15+Math.cos(wave)*3);
  ctx.moveTo(px+6,py-7); ctx.lineTo(px+11+Math.sin(wave+Math.PI)*3,py-15+Math.cos(wave+Math.PI)*3);
  ctx.stroke();
  // 身体
  ctx.fillStyle='#4dd0e1'; rr(px-7,py-5,14,16,4); ctx.fill();
  ctx.fillStyle='#29434e'; rr(px-7,py+7,14,5,2); ctx.fill();
  // 头
  ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(px,py-10,5.2,0,7); ctx.fill();
  ctx.fillStyle='#e64a19'; ctx.beginPath(); ctx.arc(px,py-12,5.2,Math.PI,0); ctx.fill();
  // 头顶感叹号脉冲
  ctx.fillStyle='rgba(255,235,120,'+(0.45+0.3*Math.sin(T*5+b.seed)).toFixed(3)+')';
  ctx.font='bold 12px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('!',px,py-20);
}

// ===== 迷你消防员（弹球/弹簧床共用） =====
// 参数：c=ctx, cx,cy=中心, sc=缩放, dir=朝向(1右/-1左), tilt=身体倾斜弧度, suit,helm
function drawMiniFireman(c,cx,cy,sc,dir,tilt,suit,helm){
  c.save();
  c.translate(cx,cy); c.scale(sc,sc); c.rotate(tilt);
  // 腿（张开站姿）
  c.strokeStyle='#39414f'; c.lineWidth=2.4; c.lineCap='round';
  c.beginPath(); c.moveTo(-2,-6); c.lineTo(-4,2); c.moveTo(2,-6); c.lineTo(4,2); c.stroke();
  // 身体（消防服）
  c.fillStyle=suit; rr(c,-5,-12,10,10,3); c.fill();
  c.fillStyle='rgba(0,0,0,0.2)'; rr(c,-5,-3,10,2.6,1); c.fill();
  // 反光条
  c.fillStyle='rgba(255,255,255,0.55)'; rr(c,-4,-9,8,2,1); c.fill();
  // 手臂（向前伸，拉床/飞行）
  c.strokeStyle=suit; c.lineWidth=2.4; c.lineCap='round';
  c.beginPath(); c.moveTo(dir*3,-10); c.lineTo(dir*8,-4); c.stroke();
  // 头
  c.fillStyle='#ffd9b3'; rr(c,-3.5,-16,7,5,2.5); c.fill();
  // 头盔
  c.fillStyle=helm;
  c.beginPath(); c.arc(0,-16,6,Math.PI,0); c.fill();
  rr(c,-7,-16,14,3,1.5); c.fill();
  // 头盔黄条（灭火等级：0黄 1绿 2红）
  c.fillStyle=S&&S.powerLevel>=2?'#ff3b30':(S&&S.powerLevel===1?'#4cd964':'#ffd24a');
  rr(c,-6,-19,12,2.5,1); c.fill();
  c.restore();
}

// ===== 球拍：两个消防员拉着弹簧床 =====
function drawPaddle(T){
  var x=paddle.x,y=paddle.y,w=paddle.w;
  var sk=SKINS[S.skin]||SKINS[0];
  // 弹簧床框架（下方金属杆）
  ctx.fillStyle='rgba(255,255,255,0.10)'; rr(x-6,y+10,w+12,10,5); ctx.fill();
  var frame=ctx.createLinearGradient(0,y+10,0,y+20);
  frame.addColorStop(0,'#4a5568'); frame.addColorStop(1,'#2a3442');
  ctx.fillStyle=frame; rr(x-6,y+10,w+12,10,5); ctx.fill();
  // 弹簧（连接框架与床面的小波浪）
  ctx.strokeStyle='#8d99a6'; ctx.lineWidth=1.5;
  for(var sp=0;sp<8;sp++){
    var spx=x+4+sp*((w-8)/7);
    ctx.beginPath();
    ctx.moveTo(spx,y+9); ctx.quadraticCurveTo(spx-3,y+5,spx,y+1);
    ctx.quadraticCurveTo(spx+3,y-3,spx,y-6);
    ctx.stroke();
  }
  // 床面（红蓝布面，弧形下凹）
  var bed=ctx.createLinearGradient(0,y-2,0,y+10);
  bed.addColorStop(0,'#e23a2e'); bed.addColorStop(0.6,'#c22a20'); bed.addColorStop(1,'#8e1d12');
  ctx.fillStyle=bed;
  ctx.beginPath();
  ctx.moveTo(x-4,y-2);
  ctx.quadraticCurveTo(x+w/2,y+14,x+w+4,y-2);
  ctx.quadraticCurveTo(x+w/2,y+4,x-4,y-2);
  ctx.closePath(); ctx.fill();
  // 床面边线
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x-4,y-2);
  ctx.quadraticCurveTo(x+w/2,y+14,x+w+4,y-2);
  ctx.stroke();
  // 蹦床着火（火球道具）
  if(paddle.onFire){
    for(var fi=0;fi<5;fi++){
      var fxx=x+6+fi*((w-12)/4);
      var fhh=10+5*Math.sin(T*9+fi*2.1)+3*Math.sin(T*23+fi);
      ctx.fillStyle='rgba(255,122,28,0.9)';
      ctx.beginPath(); ctx.moveTo(fxx-4,y-2); ctx.quadraticCurveTo(fxx,y-2-fhh,fxx+4,y-2); ctx.fill();
    }
  }
  // 左右两个消防员拉着弹簧床（皮肤色）
  drawMiniFireman(ctx,x+10,y+6,1.0,1,-0.25,sk.suit,sk.helm);
  drawMiniFireman(ctx,x+w-10,y+6,1.0,-1,0.25,sk.suit,sk.helm);
}

// ===== 弹球：消防员本人 =====
function drawBall(T){
  if(!ball)return;
  var gx0=FACADE_X0, gx1=W-FACADE_X0, gy0=GRID_TOP-8;
  // 拖尾只画在大楼立面范围内（严格对齐窗户网格），背景区域的点跳过，不印残影
  var tr=ball.trail||[],i2,a;
  for(i2=0;i2<tr.length;i2++){
    if(tr[i2].x<gx0||tr[i2].x>gx1||tr[i2].y<gy0) continue;
    a=i2/tr.length;
    ctx.fillStyle='rgba(127,212,255,'+(a*0.22).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(tr[i2].x,tr[i2].y,ball.r*a,0,7); ctx.fill();
  }
  var b=ball;
  // 穿透无敌光环（boost 增益）
  if(pierceTimer>0){
    var pg=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r+8);
    pg.addColorStop(0,'rgba(201,166,255,0.5)'); pg.addColorStop(1,'rgba(201,166,255,0)');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+8,0,7); ctx.fill();
  }
  // 消防员本体（始终头朝上，不随飞行方向旋转；皮肤色）
  var sk=SKINS[S.skin]||SKINS[0];
  drawMiniFireman(ctx,b.x,b.y,1.25,1,0,sk.suit,sk.helm);
  // 球带着人时，在消防员上方画被救的人（小号）
  if(b.carrying){
    ctx.fillStyle='#ff7043'; rr(b.x-3,b.y-22,6,7,2); ctx.fill();
    ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(b.x,b.y-24,2.8,0,7); ctx.fill();
  }
}

// ===== 跳伞人员 =====
function drawPerson(p,T){
  var sway=Math.sin(T*3+p.seed)*2.6;
  var px=p.x+sway, py=p.y;
  // 伞面
  ctx.fillStyle='#ff8a3c';
  ctx.beginPath(); ctx.arc(px,py-14,11,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(px,py-14,11,Math.PI,0); ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.fillRect(px-4,py-25,3,11); ctx.fillRect(px+2,py-25,3,11);
  ctx.restore();
  // 伞绳
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(px-7,py-14); ctx.lineTo(px-4,py-3);
  ctx.moveTo(px+7,py-14); ctx.lineTo(px+4,py-3); ctx.stroke();
  // 身体
  ctx.fillStyle='#ff7043'; rr(px-5,py-2,10,11,4); ctx.fill();
  ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(px,py-5,4,0,7); ctx.fill();
  ctx.fillStyle='#e64a19'; ctx.beginPath(); ctx.arc(px,py-6.5,4,Math.PI,0); ctx.fill();
}

// ===== 道具 =====
function drawItems(T){
  for(var i2=0;i2<items.length;i2++){
    var it=items[i2], def=ITEM_DEF[it.key];

// ===== 飞行敌人（鸟/UFO，可借力反弹） =====
function drawEnemy(en,T){
  var bx=en.x, by=en.y, flap=Math.sin(T*8+en.seed)*3;
  if(en.type==='bird'){
    // 鸟：身体 + 扇动翅膀
    ctx.fillStyle='#8d99a6';
    ctx.beginPath(); ctx.ellipse(bx,by,10,7,0,0,7); ctx.fill();
    ctx.fillStyle='#5a6b7a';
    ctx.beginPath(); ctx.moveTo(bx-8,by-2+flap); ctx.quadraticCurveTo(bx-16,by-8+flap*2,bx-12,by-2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx+8,by-2-flap); ctx.quadraticCurveTo(bx+16,by-8-flap*2,bx+12,by-2); ctx.fill();
    // 嘴/眼
    ctx.fillStyle='#ffd24a';
    ctx.beginPath(); ctx.moveTo(bx-10,by-1); ctx.lineTo(bx-14,by); ctx.lineTo(bx-10,by+1); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx-3,by-3,2,0,7); ctx.fill();
  }else{
    // UFO：碟身 + 顶灯 + 底光
    ctx.fillStyle='#5ec8a8';
    ctx.beginPath(); ctx.ellipse(bx,by,12,5,0,0,7); ctx.fill();
    ctx.fillStyle='#3d8f76';
    ctx.beginPath(); ctx.arc(bx,by-5,6,Math.PI,0); ctx.fill();
    ctx.fillStyle='#ffe27a';
    ctx.beginPath(); ctx.arc(bx,by-7,2,0,7); ctx.fill();
    ctx.fillStyle='rgba(120,255,200,'+(0.2+0.15*Math.sin(T*6+en.seed)).toFixed(3)+')';
    ctx.beginPath(); ctx.ellipse(bx,by+5,14,4,0,0,7); ctx.fill();
  }
}

// ===== 直升机（BONUS TIME 触发） =====
function drawHeli(T){
  if(!heli)return;
  var hx=heli.x, hy=heli.y;
  // 旋翼（旋转）
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2;
  var rot=T*18;
  ctx.beginPath();
  ctx.moveTo(hx-18*Math.cos(rot),hy-10-18*Math.sin(rot));
  ctx.lineTo(hx+18*Math.cos(rot),hy-10+18*Math.sin(rot));
  ctx.stroke();
  // 机身
  ctx.fillStyle='#2f7bff'; rr(hx-18,hy-8,36,14,5); ctx.fill();
  ctx.fillStyle='#1e5fc9'; rr(hx-18,hy+2,36,5,3); ctx.fill();
  // 尾桨
  ctx.strokeStyle='#8fd8ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx-18,hy-2); ctx.lineTo(hx-28,hy-6+Math.sin(T*16)*3); ctx.stroke();
  // 起落架（可弹进球）
  ctx.strokeStyle='#ffd24a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx-10,hy+6); ctx.lineTo(hx-6,hy+16); ctx.moveTo(hx+10,hy+6); ctx.lineTo(hx+6,hy+16); ctx.stroke();
  ctx.fillStyle='#ffd24a'; rr(hx-18,hy+14,36,3,1); ctx.fill();
  // 舱灯
  ctx.fillStyle='rgba(126,200,255,'+(0.6+0.4*Math.sin(T*6)).toFixed(3)+')';
  ctx.beginPath(); ctx.arc(hx+12,hy-4,2.5,0,7); ctx.fill();
}

// ===== BONUS TIME 天空金币 =====
function drawBonusCoins(T){

  }

  ctx.fillStyle='rgba(255,255,255,0.6)';

// ===== 粒子/文字 =====
function drawFX(T){
  var i2,p,t;
  for(i2=0;i2<particles.length;i2++){
    p=particles[i2];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    if(p.type==='smoke'){ ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(i2=0;i2<texts.length;i2++){
    t=texts[i2];
    ctx.globalAlpha=Math.max(0,t.life);
    ctx.font='bold 15px system-ui,sans-serif';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.55)';
    ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.color; ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
}
function draw(T){
  // P2 室内关：独立场景
  if(S.state==='indoor'){ drawIndoor(T); drawFX(T); return; }
  drawBg(T);
  for(var i2=0;i2<bricks.length;i2++){ if(bricks[i2].type==='rescue')drawRescueBrick(bricks[i2],T); else drawFireBrick(bricks[i2],T); }
  for(i2=0;i2<enemies.length;i2++)drawEnemy(enemies[i2],T);
  for(i2=0;i2<people.length;i2++)drawPerson(people[i2],T);
  drawItems(T);
  if(heli) drawHeli(T);
  if(bonusActive) drawBonusCoins(T);
  drawPaddle(T);
  if(S.state!=='menu') drawBall(T);
  drawFX(T);
}

// ===== 输入 =====
function toCanvasX(clientX){ var r=canvas.getBoundingClientRect(); return (clientX-r.left)*(W/r.width); }
var dragging=false, dragStartX=0, dragStartTx=0;
canvas.addEventListener('pointerdown',function(e){
  ensureAudio(); dragging=true;
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  // P2 室内关：点击翻门
  if(S.state==='indoor'){
    var tx=toCanvasX(e.clientX), ty=(e.clientY-canvas.getBoundingClientRect().top)*(H/canvas.getBoundingClientRect().height);
    for(var di=0;di<indoorDoors.length;di++){
      var dd=indoorDoors[di];
      if(tx>=dd.x&&tx<=dd.x+dd.w&&ty>=dd.y&&ty<=dd.y+dd.h){ openIndoorDoor(dd); break; }
    }
    return;
  }
  dragStartX=toCanvasX(e.clientX);
  dragStartTx=paddle.tx;
  if(S.state==='playing'&&ball&&ball.stuck) launch();
});
canvas.addEventListener('pointermove',function(e){
  if(!dragging)return;
  // 相对拖拽：按住任意位置（含底部地面）滑动，挡板跟随位移
  var dx=toCanvasX(e.clientX)-dragStartX;
  paddle.tx=Math.max(8,Math.min(W-PW-8,dragStartTx+dx));
});
canvas.addEventListener('pointerup',function(){ dragging=false; });
canvas.addEventListener('pointercancel',function(){ dragging=false; });
window.addEventListener('keydown',function(e){
  ensureAudio();
  if(e.key==='ArrowLeft'){paddle.tx=Math.max(8,paddle.tx-26);}
  else if(e.key==='ArrowRight'){paddle.tx=Math.min(W-PW-8,paddle.tx+26);}
  else if(e.key===' '||e.key==='Enter'){ if(S.state==='playing'&&ball&&ball.stuck) launch(); }
});

// ===== 主循环 =====
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/16.667,2.5); last=now;
  var T=now/1000;
  if(S.state==='playing'&&!document.hidden) update(dt);
  else if(S.state!=='menu'&&!document.hidden) fxStep(dt,T);
  draw(T);
  requestAnimationFrame(loop);
}

// 局部圆角矩形（素材模块用，避免依赖游戏内的 rr）
function rr2(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
// 局部迷你消防员（素材模块用；cx,cy 中心, sc 缩放, dir 朝向, tilt 倾角）
function miniFM(c,cx,cy,sc,dir,tilt,suit,helm){
  c.save();
  c.translate(cx,cy); c.scale(sc,sc); c.rotate(tilt);
  c.strokeStyle='#39414f'; c.lineWidth=2.4; c.lineCap='round';
  c.beginPath(); c.moveTo(-2,-6); c.lineTo(-4,2); c.moveTo(2,-6); c.lineTo(4,2); c.stroke();
  c.fillStyle=suit; rr2(c,-5,-12,10,10,3); c.fill();
  c.fillStyle='rgba(0,0,0,0.2)'; rr2(c,-5,-3,10,2.6,1); c.fill();
  c.fillStyle='rgba(255,255,255,0.55)'; rr2(c,-4,-9,8,2,1); c.fill();
  c.strokeStyle=suit; c.lineWidth=2.4; c.lineCap='round';
  c.beginPath(); c.moveTo(dir*3,-10); c.lineTo(dir*8,-4); c.stroke();
  c.fillStyle='#ffd9b3'; rr2(c,-3.5,-16,7,5,2.5); c.fill();
  c.fillStyle=helm;
  c.beginPath(); c.arc(0,-16,6,Math.PI,0); c.fill();
  rr2(c,-7,-16,14,3,1.5); c.fill();
  c.fillStyle='#ffd24a'; rr2(c,-6,-19,12,2.5,1); c.fill();
  c.restore();
}
// 局部火焰舌（素材模块用）
function flame2(c,x,baseY,w,h,seed,T,color){
  var sway=Math.sin(T*8+seed)*w*0.18;
  c.fillStyle=color;
  c.beginPath();c.moveTo(x-w*0.5,baseY);
  c.quadraticCurveTo(x-w*0.3,baseY-h*0.55,x+sway,baseY-h);
  c.quadraticCurveTo(x+w*0.3,baseY-h*0.55,x+w*0.5,baseY);
  c.closePath();c.fill();
}
// 导出：渲染精灵图 + JSON 清单（2x 放大）
function exportAssets(){
  ensureAudio(); sfx('click');
  var SCALE=2, pad=4;
  var cols=6, cellW=0, cellH=0;
  // 计算每行单元格尺寸（取最大）
  var i,rowH=0;
  var rows=[];
  for(i=0;i<ASSETS.length;i++){
    var a=ASSETS[i];
    cellW=Math.max(cellW,a.w); rowH=Math.max(rowH,a.h);
    if((i%cols)===cols-1){ rows.push(rowH); rowH=0; }
  }
  if(ASSETS.length%cols!==0)rows.push(rowH);
  cellW+=pad*2; 
  var rowsCnt=Math.ceil(ASSETS.length/cols);
  var totalW=cols*cellW*SCALE, totalH=rowsCnt*(Math.max.apply(null,rows)+pad*2)*SCALE;
  var oc=document.createElement('canvas');
  oc.width=Math.max(1,totalW); oc.height=Math.max(1,totalH);
  var octx=oc.getContext('2d');
  octx.fillStyle='#10151f'; octx.fillRect(0,0,oc.width,oc.height);
  var manifest={name:'救火英雄元件素材',scale:SCALE,assets:[]};
  for(i=0;i<ASSETS.length;i++){
    var a=ASSETS[i], col=i%cols, rw=Math.floor(i/cols);
    // 元件独立离屏渲染
    var ec=document.createElement('canvas');
    ec.width=a.w*SCALE; ec.height=a.h*SCALE;
    var ecx=ec.getContext('2d');
    ecx.scale(SCALE,SCALE);
    a.draw(ecx,0);
    // 贴入精灵图
    var rowTop=0,j;
    for(j=0;j<rw;j++) rowTop+=rows[j]+pad*2;
    var dx=(col*cellW+pad)*SCALE, dy=(rowTop+pad)*SCALE;
    octx.drawImage(ec,dx,dy);
    manifest.assets.push({key:a.key,name:a.name,w:a.w,h:a.h,x:dx,y:dy,scale:SCALE});
  }
  // 下载精灵图
  var link=document.createElement('a');
  link.download='fire-hero-sprites.png';
  link.href=oc.toDataURL('image/png');
  link.click();
  // 下载 JSON 清单
  var blob=new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var l2=document.createElement('a');
  l2.download='fire-hero-assets.json';
  l2.href=url; l2.click();
  setTimeout(function(){ URL.revokeObjectURL(url); },2000);
  addText(W/2,H*0.35,'素材已导出! (精灵图+JSON)','#7ef0a0');
}
