<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开场黑幕</title>
</head>
<body style="margin:0; padding:0; background:#1a1a1a; display:flex; justify-content:center; align-items:center; min-height:100vh;">

<!-- 1280x720 画布 -->
<div style="width:1280px; height:720px; background:#000000; position:relative; overflow:hidden; flex-shrink:0;">

  <!-- 文字列：840px 宽，垂直居中 -->
  <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:840px; display:flex; flex-direction:column; gap:28px;">

    <p style="margin:0; font-size:20px; line-height:28px; color:#ffffff; text-align:left; opacity:1;">
      上古时代，仙界与凡间有仙门相连，仙人往来，灵气互通。
    </p>
    <p style="margin:0; font-size:20px; line-height:28px; color:#ffffff; text-align:left; opacity:1;">
      仙门一夜崩塌，仙人陨落消散。至强法宝护住最后根基，耗尽灵力，化为凡间荒山，陷入沉睡。
    </p>
    <p style="margin:0; font-size:20px; line-height:28px; color:#ffffff; text-align:left; opacity:1;">
      万年后，器灵苏醒，发出跨越轮回的呼唤。
    </p>
    <p style="margin:0; font-size:20px; line-height:28px; color:#ffffff; text-align:left; opacity:1;">
      你听到呼唤，承担修复神器、重开仙门的使命。
    </p>

  </div>

  <!-- 底部提示 -->
  <p style="margin:0; position:absolute; left:0; right:0; bottom:88px; text-align:center; font-size:12px; color:#4d4d61; opacity:1;">
    点击任意处继续
  </p>

  <!-- 右上角状态标注 -->
  <p style="margin:0; position:absolute; top:16px; right:20px; text-align:right; font-size:11px; color:#4d4d61;">
    状态：全部显示
  </p>

</div>

</body>
</html>
