<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>山峰菜单</title>
<style> * { margin: 0; padding: 0; box-sizing: border-box; } </style>
</head>
<body style="margin:0; padding:0; background:#1a1a1a; display:flex; justify-content:center; align-items:center; min-height:100vh;">

<!-- @pixso PeakMenuUi -->
<section style="width:520px; position:relative; flex-shrink:0;">

  <!-- @pixso Root (DOM first → Pixso 图层树底部 = 视觉顶层) -->
  <main style="position:relative; z-index:3; padding:28px 28px 24px 28px; display:flex; flex-direction:column;">

    <!-- @pixso TitleText -->
    <p style="margin:0 0 4px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:24px; font-weight:700; color:#f0c040; letter-spacing:3px;">金刚峰</p>

    <!-- @pixso StatusText -->
    <p style="margin:0 0 20px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:13px; color:#c03030;">未修复</p>

    <!-- @pixso RepairBtn -->
    <div style="width:100%; height:44px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg, #4ecca3 0%, #2a8a6a 100%); border-radius:6px; box-shadow:0 4px 12px rgba(78,204,163,0.3); margin-bottom:20px;">
      <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:16px; font-weight:700; color:#0a0a14;">修复山峰（20 灵气）</p>
    </div>

    <!-- @pixso Separator -->
    <div style="width:100%; height:1px; background:linear-gradient(90deg, transparent 0%, rgba(240,192,64,0.3) 20%, rgba(240,192,64,0.3) 80%, transparent 100%); margin-bottom:16px;"></div>

    <!-- @pixso FormList -->
    <nav style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">

      <!-- @pixso Bg -->
      <div style="display:none;"></div>

      <!-- @pixso FormItem1 — 御剑诀 -->
      <div style="display:flex; flex-direction:column; padding:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:6px; position:relative;">
        <!-- @pixso Root -->
        <div style="display:flex; flex-direction:column;">
          <!-- @pixso Bg -->
          <div style="position:absolute; inset:0; display:none;"></div>
          <!-- @pixso NameText -->
          <p style="margin:0 0 2px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:15px; font-weight:600; color:#c8c8d8;">御剑诀</p>
          <!-- @pixso HintText -->
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#8888aa; line-height:1.4;">弹道·伤害6·1.0s / combo连击（6发弹道）</p>
        </div>
      </div>

      <!-- @pixso FormItem2 — 金刚咒 -->
      <div style="display:flex; flex-direction:column; padding:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:6px; position:relative;">
        <!-- @pixso Root -->
        <div style="display:flex; flex-direction:column;">
          <!-- @pixso Bg -->
          <div style="position:absolute; inset:0; display:none;"></div>
          <!-- @pixso NameText -->
          <p style="margin:0 0 2px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:15px; font-weight:600; color:#c8c8d8;">金刚咒</p>
          <!-- @pixso HintText -->
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#8888aa; line-height:1.4;">扇形·伤害18·1.2s / 眩晕（12%概率·0.5s）</p>
        </div>
      </div>

      <!-- @pixso FormItem3 — 炼魂诀 -->
      <div style="display:flex; flex-direction:column; padding:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:6px; position:relative;">
        <!-- @pixso Root -->
        <div style="display:flex; flex-direction:column;">
          <!-- @pixso Bg -->
          <div style="position:absolute; inset:0; display:none;"></div>
          <!-- @pixso NameText -->
          <p style="margin:0 0 2px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:15px; font-weight:600; color:#c8c8d8;">炼魂诀</p>
          <!-- @pixso HintText -->
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#8888aa; line-height:1.4;">弹道·伤害8·1.0s / 魂印标记（削弱+引爆）</p>
        </div>
      </div>

      <!-- @pixso FormItem4 — 灵狐契 -->
      <div style="display:flex; flex-direction:column; padding:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:6px; position:relative;">
        <!-- @pixso Root -->
        <div style="display:flex; flex-direction:column;">
          <!-- @pixso Bg -->
          <div style="position:absolute; inset:0; display:none;"></div>
          <!-- @pixso NameText -->
          <p style="margin:0 0 2px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:15px; font-weight:600; color:#c8c8d8;">灵狐契</p>
          <!-- @pixso HintText -->
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#8888aa; line-height:1.4;">召唤·伤害8·0.9s / 灵狐自动攻击</p>
        </div>
      </div>

      <!-- @pixso FormItem5 — 御器诀 -->
      <div style="display:flex; flex-direction:column; padding:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:6px; position:relative;">
        <!-- @pixso Root -->
        <div style="display:flex; flex-direction:column;">
          <!-- @pixso Bg -->
          <div style="position:absolute; inset:0; display:none;"></div>
          <!-- @pixso NameText -->
          <p style="margin:0 0 2px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:15px; font-weight:600; color:#c8c8d8;">御器诀</p>
          <!-- @pixso HintText -->
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#8888aa; line-height:1.4;">召唤·伤害10·0.9s / 法器环绕（反弹+拦截）</p>
        </div>
      </div>

      <!-- @pixso FormItem6 — 雷霆诀 -->
      <div style="display:flex; flex-direction:column; padding:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:6px; position:relative;">
        <!-- @pixso Root -->
        <div style="display:flex; flex-direction:column;">
          <!-- @pixso Bg -->
          <div style="position:absolute; inset:0; display:none;"></div>
          <!-- @pixso NameText -->
          <p style="margin:0 0 2px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:15px; font-weight:600; color:#c8c8d8;">雷霆诀</p>
          <!-- @pixso HintText -->
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#8888aa; line-height:1.4;">弹道·伤害20·1.1s / 闪电链（3弹射·25%衰减）</p>
        </div>
      </div>

    </nav>

    <!-- @pixso CloseBtn -->
    <div style="width:100%; height:40px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:6px;">
      <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:14px; color:#8888aa;">关 闭</p>
    </div>

  </main>

  <!-- @pixso Bg (DOM 最后 → Pixso 图层树顶部 = 视觉底层) -->
  <div style="position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(22,22,42,0.98) 0%, rgba(16,16,32,0.98) 100%); border:1px solid rgba(240,192,64,0.25); border-radius:10px; box-shadow:0 8px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(240,192,64,0.08) inset;"></div>

</section>

</body>
</html>
