<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开场黑幕 — 造化坊 · 开仙门</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #222; }
  body {
    display: flex; justify-content: center; align-items: center;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #stage {
    width: 1280px; height: 720px; overflow: hidden;
    background: #000; position: relative;
    display: flex; justify-content: center; align-items: center;
    user-select: none; -webkit-user-select: none;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
  }
  #narrative {
    width: 840px; text-align: center;
    color: #fff; font-size: 20px; line-height: 2.0;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
  #narrative.visible { opacity: 1; }
  .indicator {
    position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.2); font-size: 12px; letter-spacing: 2px;
    opacity: 0; transition: opacity 0.5s;
  }
  .indicator.show { opacity: 1; }
  .exit-hint {
    position: absolute; top: 16px; right: 24px;
    color: rgba(255,255,255,.12); font-size: 11px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="narrative"></div>
  <div class="indicator" id="indicator">点击或按任意键继续</div>
  <div class="exit-hint">开场黑幕 · 功能原型</div>
</div>

<script>
const texts = [
  "上古时代，仙界与凡间有仙门相连。<br>仙人行走人间，凡人亦可登仙。",
  "仙门一夜崩塌，仙人陨落消散。<br>至强法宝在崩碎之际护住最后根基，耗尽灵力，化为凡间荒山，陷入沉睡。",
  "六座阵眼山峰环绕，各自代表不同神通法则。<br>器灵残破半隐于云海之中，等待转世者的呼唤。",
  "无数年后，器灵苏醒。<br>你听到了那跨越轮回的呼唤。"
];

let idx = 0;
let cooldown = false;
let autoTimer = null;
const AUTO_INTERVAL = 4000;
const COOLDOWN = 300;

const el = document.getElementById('narrative');
const indicator = document.getElementById('indicator');
const stage = document.getElementById('stage');

function showText(i) {
  if (i >= texts.length) { finish(); return; }
  el.innerHTML = texts[i];
  el.classList.add('visible');
  indicator.classList.remove('show');
  scheduleAuto();
}

function scheduleAuto() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(advance, AUTO_INTERVAL);
}

function advance() {
  if (cooldown) return;
  cooldown = true;
  clearTimeout(autoTimer);
  el.classList.remove('visible');
  setTimeout(() => {
    idx++;
    cooldown = false;
    if (idx < texts.length) showText(idx);
    else finish();
  }, 300);
}

function finish() {
  el.classList.remove('visible');
  clearTimeout(autoTimer);
  setTimeout(() => {
    el.innerHTML = "— 进入器灵选择 —";
    el.style.color = "rgba(255,255,255,.4)";
    el.style.fontSize = "16px";
    el.classList.add('visible');
    indicator.textContent = "原型演示结束";
    indicator.classList.add('show');
    stage.style.cursor = "default";
    stage.onclick = null;
    stage.onkeydown = null;
  }, 500);
}

stage.addEventListener('click', advance);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && idx >= texts.length - 1) { finish(); return; }
  advance();
});

showText(0);
setTimeout(() => indicator.classList.add('show'), 1000);
</script>
</body>
</html>
