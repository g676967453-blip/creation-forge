<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>器灵选择</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 品质色 */
  .q-common   { border-color: #777777; }
  .q-rare     { border-color: #6699bb; }
  .q-epic     { border-color: #9977bb; }
  .q-legendary{ border-color: #bb9966; }
</style>
</head>
<body style="margin:0; padding:0; background:#1a1a1a; display:flex; justify-content:center; align-items:center; min-height:100vh;">

<!-- @pixso SpiritSelectUi -->
<section style="width:1280px; height:720px; position:relative; overflow:hidden; flex-shrink:0;">

  <!-- @pixso Bg -->
  <div style="position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, #1a1a1c 0%, #141416 50%, #1a1a1c 100%);"></div>

  <!-- @pixso Root -->
  <main style="position:absolute; inset:0; z-index:3; display:flex;">

    <!-- ============ 左侧：器灵插图区 ============ -->
    <!-- @pixso LeftPanel -->
    <aside style="width:480px; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 40px;">

      <!-- @pixso IllustrationPlaceholder — 器灵插图占位 -->
      <div style="width:320px; height:400px; border:1px dashed #3a3a3a; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:24px; position:relative;">
        <!-- @pixso PlaceholderIcon -->
        <div style="width:48px; height:48px; border:1px solid #444444; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#555555" stroke-width="1.5">
            <circle cx="10" cy="7" r="4"/>
            <path d="M2 18c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
          </svg>
        </div>
        <!-- @pixso PlaceholderText -->
        <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:13px; color:#555555; text-align:center; letter-spacing:2px;">器灵插图</p>
        <p style="margin:4px 0 0 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:11px; color:#3a3a3a; text-align:center;">128×160 像素艺术</p>
      </div>

      <!-- @pixso SpiritNameUnderIllustration -->
      <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:28px; font-weight:700; color:#e0e0e0; text-align:center; letter-spacing:4px;">百 世 书</p>
      <p style="margin:6px 0 0 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:12px; color:#666666; text-align:center; letter-spacing:2px;">ANCIENT TOME SPIRIT</p>

    </aside>

    <!-- ============ 右侧：信息与交互区 ============ -->
    <!-- @pixso RightPanel -->
    <section style="flex:1; height:100%; display:flex; flex-direction:column; justify-content:center; padding:60px 60px 60px 0;">

      <!-- @pixso TitleText -->
      <p style="margin:0 0 4px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:28px; font-weight:700; color:#e0e0e0; letter-spacing:6px;">选择器灵</p>
      <!-- @pixso Divider -->
      <div style="width:48px; height:2px; background:#555555; margin-bottom:20px;"></div>

      <!-- @pixso HintText -->
      <p style="margin:0 0 36px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:13px; color:#777777; line-height:1.8; max-width:440px;">蕴藏万界知识的古书器灵。<br>修复神器，重开仙门。</p>

      <!-- ========== 携带道具 ========== -->
      <!-- @pixso ItemSection -->
      <!-- @pixso SectionLabel — 名称在道具框外面 -->
      <p style="margin:0 0 12px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:12px; color:#888888; letter-spacing:2px;">携带道具</p>

      <!-- @pixso ItemSlotRow -->
      <div style="display:flex; gap:12px; margin-bottom:8px;">
        <!-- @pixso ItemSlot1 — 传说品质 -->
        <div style="width:72px; height:72px; background:#222222; border:2px solid #bb9966; border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative;">
          <!-- @pixso SlotIcon -->
          <svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="#999999" stroke-width="1.5">
            <rect x="3" y="5" width="12" height="10" rx="1"/>
            <path d="M6 5V3h6v2"/>
          </svg>
          <!-- @pixso QualityDot -->
          <div style="position:absolute; top:4px; right:4px; width:6px; height:6px; background:#bb9966; border-radius:50%;"></div>
        </div>
        <!-- @pixso ItemSlot2 — 稀有品质 -->
        <div style="width:72px; height:72px; background:#222222; border:2px solid #6699bb; border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative;">
          <svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="#999999" stroke-width="1.5">
            <circle cx="9" cy="9" r="5"/>
            <path d="M9 6v3l2 2"/>
          </svg>
          <div style="position:absolute; top:4px; right:4px; width:6px; height:6px; background:#6699bb; border-radius:50%;"></div>
        </div>
        <!-- @pixso ItemSlot3 — 空槽位 -->
        <div style="width:72px; height:72px; background:#1a1a1a; border:1px dashed #2a2a2a; border-radius:3px; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="#333333" stroke-width="1.5">
            <line x1="9" y1="3" x2="9" y2="15"/>
            <line x1="3" y1="9" x2="15" y2="9"/>
          </svg>
        </div>
      </div>
      <!-- @pixso ItemNames — 名称在道具框外面 -->
      <div style="display:flex; gap:12px; margin-bottom:28px;">
        <p style="width:72px; margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#999999; text-align:center;">古卷残页</p>
        <p style="width:72px; margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#888888; text-align:center;">时之沙漏</p>
        <p style="width:72px; margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:10px; color:#444444; text-align:center;">空槽位</p>
      </div>

      <!-- ========== 器灵特性 ========== -->
      <!-- @pixso SkillSection -->
      <!-- @pixso SectionLabel — 名称在技能框外面 -->
      <p style="margin:0 0 12px 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:12px; color:#888888; letter-spacing:2px;">器灵特性</p>

      <!-- @pixso SkillSlotRow -->
      <div style="display:flex; gap:12px; margin-bottom:8px;">
        <!-- @pixso SkillSlot1 -->
        <div style="width:200px; height:56px; background:#1e1e1e; border:1px solid #3a3a3a; border-radius:3px; display:flex; align-items:center; padding:0 14px; gap:10px;">
          <!-- @pixso SkillIcon -->
          <div style="width:30px; height:30px; background:#252525; border:1px solid #444444; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#888888" stroke-width="1.5">
              <polygon points="7,1 13,13 1,13"/>
              <circle cx="7" cy="9" r="2"/>
            </svg>
          </div>
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:11px; color:#666666; line-height:1.5;">战斗失败免死<br>回经营，V0.1无惩罚</p>
        </div>
        <!-- @pixso SkillSlot2 -->
        <div style="width:200px; height:56px; background:#1e1e1e; border:1px solid #3a3a3a; border-radius:3px; display:flex; align-items:center; padding:0 14px; gap:10px;">
          <!-- @pixso SkillIcon -->
          <div style="width:30px; height:30px; background:#252525; border:1px solid #444444; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#888888" stroke-width="1.5">
              <rect x="2" y="2" width="10" height="10" rx="2"/>
              <path d="M5 7l2 2 3-4"/>
            </svg>
          </div>
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:11px; color:#666666; line-height:1.5;">经验加成 +20%<br>灵气加成 +20%</p>
        </div>
      </div>
      <!-- @pixso SkillNames — 名称在技能框外面 -->
      <div style="display:flex; gap:12px; margin-bottom:36px;">
        <p style="width:200px; margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:11px; color:#aaaaaa; text-align:center;">轮回庇护</p>
        <p style="width:200px; margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:11px; color:#aaaaaa; text-align:center;">万界知识</p>
      </div>

      <!-- ========== 底部：器灵切换 + 开始按钮 ========== -->
      <!-- @pixso BottomSection -->
      <div style="display:flex; align-items:center; gap:24px;">

        <!-- @pixso SpiritCarousel — 器灵卡片切换 -->
        <div style="display:flex; align-items:center; gap:8px;">
          <!-- @pixso ArrowLeft -->
          <div style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#555555" stroke-width="1.5">
              <polyline points="8,2 3,6 8,10"/>
            </svg>
          </div>

          <!-- @pixso CardItem1 — 百世书（选中态） -->
          <figure style="width:120px; height:72px; display:flex; align-items:center; justify-content:center; margin:0; border:2px solid #cccccc; border-radius:3px; background:#1e1e1e; cursor:pointer;">
            <div style="text-align:center;">
              <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:13px; font-weight:600; color:#e0e0e0;">百世书</p>
              <p style="margin:1px 0 0 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:9px; color:#777777;">已觉醒</p>
            </div>
          </figure>

          <!-- @pixso CardItem2 — 诛仙剑（锁定） -->
          <figure style="width:120px; height:72px; display:flex; align-items:center; justify-content:center; margin:0; border:1px dashed #2a2a2a; border-radius:3px; background:#121212; opacity:0.5; cursor:not-allowed;">
            <div style="text-align:center;">
              <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:13px; font-weight:600; color:#555555;">???</p>
              <p style="margin:1px 0 0 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:9px; color:#333333;">未解锁</p>
            </div>
          </figure>

          <!-- @pixso CardItem3 — 神农鼎（锁定） -->
          <figure style="width:120px; height:72px; display:flex; align-items:center; justify-content:center; margin:0; border:1px dashed #2a2a2a; border-radius:3px; background:#121212; opacity:0.5; cursor:not-allowed;">
            <div style="text-align:center;">
              <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:13px; font-weight:600; color:#555555;">???</p>
              <p style="margin:1px 0 0 0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:9px; color:#333333;">未解锁</p>
            </div>
          </figure>

          <!-- @pixso ArrowRight -->
          <div style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#555555" stroke-width="1.5">
              <polyline points="4,2 9,6 4,10"/>
            </svg>
          </div>
        </div>

        <!-- @pixso StartBtn — 亮色可点击 -->
        <div style="width:200px; height:48px; display:flex; align-items:center; justify-content:center; background:#cccccc; border-radius:3px; cursor:pointer;">
          <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:16px; font-weight:700; color:#1a1a1a; letter-spacing:6px;">开 始 游 戏</p>
        </div>

      </div>

      <!-- @pixso StartBtnDisabled — 灰色不可点击（参考） -->
      <!--
      <div style="width:200px; height:48px; display:flex; align-items:center; justify-content:center; background:#333333; border-radius:3px; cursor:not-allowed; opacity:0.5;">
        <p style="margin:0; font-family:'Noto Sans SC','Alibaba PuHuiTi 55R',sans-serif; font-size:16px; font-weight:700; color:#666666; letter-spacing:6px;">开 始 游 戏</p>
      </div>
      -->

    </section>

  </main>

  <!-- @pixso TopOverlay -->
  <div style="position:absolute; top:0; left:0; right:0; height:60px; z-index:4; background:linear-gradient(180deg, rgba(20,20,22,0.9) 0%, transparent 100%); pointer-events:none;"></div>

</section>

</body>
</html>
