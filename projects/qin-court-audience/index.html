<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720, height=1280, initial-scale=1.0, user-scalable=no">
<title>秦王殿奏对</title>
<style>
:root {
  --bg: #1a0a00;
  --bg-light: #2a1500;
  --gold: #c9a96e;
  --gold-light: #e0c888;
  --red: #8b1a1a;
  --red-bright: #c41e3a;
  --cream: #f0e6d3;
  --cream-dark: #c4b598;
  --text: #e8dcc8;
  --dark-border: #3a2010;
  --ink: #2a1808;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
  font-family: 'GameSerif';
  src: local('SimSun'), local('STSong'), local('Songti SC'), local('serif');
}

body {
  width: 720px; height: 1280px;
  margin: 0 auto;
  background: #000;
  font-family: 'GameSerif', 'SimSun', 'STSong', 'KaiTi', serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

#game-container {
  width: 720px; height: 1280px;
  position: relative;
  background: linear-gradient(180deg, #0d0500 0%, #1a0a00 5%, #1a0a00 95%, #0d0500 100%);
  border: 4px solid var(--dark-border);
  box-shadow: inset 0 0 200px rgba(180, 120, 40, 0.05);
  overflow: hidden;
}

/* 装饰边框 */
.border-top, .border-bottom {
  position: absolute; left: 20px; right: 20px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.5;
}
.border-top { top: 60px; }
.border-bottom { bottom: 60px; }

.border-left, .border-right {
  position: absolute; top: 60px; bottom: 60px; width: 2px;
  background: linear-gradient(180deg, transparent, var(--gold), transparent);
  opacity: 0.3;
}
.border-left { left: 20px; }
.border-right { right: 20px; }

/* 背景纹理 */
.bg-pattern {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(201,169,110,0.015) 2px, rgba(201,169,110,0.015) 4px);
  pointer-events: none;
}

/* 屏幕容器 */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  transition: opacity 0.6s, transform 0.6s;
}
.screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }

/* ===== 标题画面 ===== */
#title-screen {
  justify-content: center; gap: 30px;
  background: radial-gradient(ellipse at center, rgba(201,169,110,0.08) 0%, transparent 70%);
}

.title-emblem {
  width: 120px; height: 120px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; color: var(--gold);
  box-shadow: 0 0 40px rgba(201,169,110,0.3), inset 0 0 40px rgba(201,169,110,0.1);
  animation: emblemPulse 3s ease-in-out infinite;
}

@keyframes emblemPulse {
  0%, 100% { box-shadow: 0 0 40px rgba(201,169,110,0.3), inset 0 0 40px rgba(201,169,110,0.1); }
  50% { box-shadow: 0 0 60px rgba(201,169,110,0.5), inset 0 0 60px rgba(201,169,110,0.2); }
}

.title-main {
  font-size: 64px; color: var(--gold);
  letter-spacing: 16px;
  text-shadow: 0 0 30px rgba(201,169,110,0.4), 0 2px 4px rgba(0,0,0,0.8);
  font-weight: bold;
}

.title-sub {
  font-size: 20px; color: var(--cream-dark);
  letter-spacing: 8px;
  opacity: 0.7;
}

.title-desc {
  font-size: 16px; color: var(--cream-dark);
  text-align: center; line-height: 2;
  opacity: 0.6;
  max-width: 500px;
}

.btn {
  padding: 16px 64px;
  font-size: 24px; font-family: inherit;
  background: linear-gradient(180deg, #3a1a08, #1a0800);
  color: var(--gold);
  border: 2px solid var(--gold);
  cursor: pointer;
  letter-spacing: 6px;
  position: relative;
  transition: all 0.3s;
}
.btn:hover {
  background: linear-gradient(180deg, #4a2a10, #2a1000);
  box-shadow: 0 0 30px rgba(201,169,110,0.3);
  border-color: var(--gold-light);
}
.btn:active { transform: scale(0.97); }

.stats-bar {
  display: flex; gap: 40px;
  font-size: 14px; color: var(--cream-dark); opacity: 0.5;
}

/* ===== 进场动画 ===== */
#entrance-screen {
  justify-content: center; align-items: center;
  background: #000;
}
.entrance-text {
  font-size: 48px; color: var(--gold);
  letter-spacing: 12px;
  animation: entranceFade 2s ease-out forwards;
}
@keyframes entranceFade {
  0% { opacity: 0; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); }
}

/* ===== 游戏画面 ===== */
#game-screen { padding: 40px 50px; }

.game-header {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(201,169,110,0.2);
  margin-bottom: 30px;
}

.progress-text {
  font-size: 18px; color: var(--gold);
  letter-spacing: 4px;
}

.progress-dots {
  display: flex; gap: 10px;
}
.progress-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  opacity: 0.3;
  transition: all 0.4s;
}
.progress-dot.done { background: var(--gold); opacity: 1; box-shadow: 0 0 8px rgba(201,169,110,0.5); }
.progress-dot.current { opacity: 0.8; border-color: var(--gold-light); animation: dotPulse 1s infinite; }

@keyframes dotPulse {
  0%, 100% { box-shadow: 0 0 4px rgba(201,169,110,0.3); }
  50% { box-shadow: 0 0 16px rgba(201,169,110,0.7); }
}

.category-tag {
  font-size: 14px; color: var(--cream-dark);
  padding: 4px 16px;
  border: 1px solid rgba(201,169,110,0.3);
  letter-spacing: 3px;
  opacity: 0.7;
}

.game-scroll {
  flex: 1; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 40px;
  padding: 20px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(201,169,110,0.15);
  border-radius: 4px;
  position: relative;
}

.game-scroll::before {
  content: ''; position: absolute; top: 10px; bottom: 10px; left: 10px; right: 10px;
  border: 1px solid rgba(201,169,110,0.08);
  pointer-events: none;
}

.king-icon {
  font-size: 56px; opacity: 0.8;
}

.question-text {
  font-size: 26px; color: var(--cream);
  text-align: center; line-height: 1.8;
  letter-spacing: 3px;
  max-width: 550px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.input-area {
  width: 100%; max-width: 520px;
  display: flex; flex-direction: column; gap: 20px;
  align-items: center;
}

.answer-input {
  width: 100%; padding: 18px 24px;
  font-size: 20px; font-family: inherit;
  background: rgba(0,0,0,0.5);
  border: 2px solid var(--gold);
  color: var(--cream);
  letter-spacing: 2px;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.answer-input:focus {
  border-color: var(--gold-light);
  box-shadow: 0 0 20px rgba(201,169,110,0.2);
}
.answer-input::placeholder {
  color: rgba(200,180,150,0.3);
  letter-spacing: 2px;
}

.submit-btn {
  padding: 14px 56px;
  font-size: 20px; font-family: inherit;
  background: linear-gradient(180deg, #5a2a10, #2a1000);
  color: var(--gold);
  border: 2px solid var(--gold);
  cursor: pointer;
  letter-spacing: 6px;
  transition: all 0.3s;
}
.submit-btn:hover {
  background: linear-gradient(180deg, #6a3a18, #3a1800);
  box-shadow: 0 0 24px rgba(201,169,110,0.3);
}

.feedback-text {
  font-size: 18px; min-height: 28px;
  transition: all 0.3s;
  letter-spacing: 2px;
}

/* ===== 死亡画面 ===== */
#death-overlay {
  position: absolute; inset: 0;
  background: rgba(139, 0, 0, 0.85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px;
  z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s;
}
#death-overlay.active { opacity: 1; pointer-events: auto; }

.death-flash {
  position: absolute; inset: 0;
  background: #ff0000;
  opacity: 0;
  pointer-events: none;
}
.death-flash.animate { animation: deathFlash 0.8s ease-out forwards; }
@keyframes deathFlash {
  0% { opacity: 0.6; }
  100% { opacity: 0; }
}

.death-title {
  font-size: 56px; color: #ffc8a0;
  letter-spacing: 8px;
  text-shadow: 0 0 30px rgba(255,100,0,0.6), 0 4px 8px rgba(0,0,0,0.8);
  animation: deathShake 0.5s ease-out;
}
@keyframes deathShake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-10px); }
  20% { transform: translateX(10px); }
  30% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  50% { transform: translateX(-5px); }
  60% { transform: translateX(5px); }
}

.death-icon { font-size: 72px; }

.hint-box {
  max-width: 560px; padding: 24px 30px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,200,160,0.4);
  text-align: center;
}
.hint-label {
  font-size: 16px; color: #ffc8a0;
  letter-spacing: 4px; margin-bottom: 12px;
  opacity: 0.8;
}
.hint-content {
  font-size: 18px; color: #ffe0c8;
  line-height: 1.8; letter-spacing: 1px;
}
.hint-question {
  font-size: 16px; color: #ffc8a0;
  margin-bottom: 10px; opacity: 0.7;
}

.btn-retry {
  padding: 16px 56px;
  font-size: 22px; font-family: inherit;
  background: rgba(0,0,0,0.5);
  color: #ffc8a0;
  border: 2px solid #ffc8a0;
  cursor: pointer;
  letter-spacing: 6px;
  transition: all 0.3s;
}
.btn-retry:hover {
  background: rgba(50,0,0,0.7);
  box-shadow: 0 0 24px rgba(255,150,50,0.3);
}

/* ===== 胜利画面 ===== */
#victory-overlay {
  position: absolute; inset: 0;
  background: rgba(10,5,0,0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px;
  z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity 0.8s;
}
#victory-overlay.active { opacity: 1; pointer-events: auto; }

.victory-sparkles {
  position: absolute; inset: 0; pointer-events: none;
  overflow: hidden;
}
.sparkle {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--gold-light);
  border-radius: 50%;
  animation: sparkleFloat 2s ease-out forwards;
}
@keyframes sparkleFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-200px) scale(0); }
}

.victory-title {
  font-size: 52px; color: var(--gold-light);
  letter-spacing: 8px;
  text-shadow: 0 0 40px rgba(201,169,110,0.6);
  animation: victoryGlow 2s ease-in-out infinite;
}
@keyframes victoryGlow {
  0%, 100% { text-shadow: 0 0 40px rgba(201,169,110,0.6); }
  50% { text-shadow: 0 0 60px rgba(224,200,136,0.9), 0 0 100px rgba(201,169,110,0.4); }
}

.victory-sub {
  font-size: 24px; color: var(--cream);
  letter-spacing: 4px;
}

.victory-stats {
  font-size: 18px; color: var(--cream-dark);
  letter-spacing: 2px; line-height: 2;
  text-align: center;
}

.btn-victory {
  padding: 16px 56px;
  font-size: 22px; font-family: inherit;
  background: linear-gradient(180deg, #4a2a10, #2a1000);
  color: var(--gold-light);
  border: 2px solid var(--gold-light);
  cursor: pointer;
  letter-spacing: 6px;
  transition: all 0.3s;
}
.btn-victory:hover {
  box-shadow: 0 0 30px rgba(201,169,110,0.4);
}

/* 响应式适配 */
@media (max-width: 720px) {
  body { width: 100vw; height: 100vh; }
  #game-container { width: 100vw; height: 100vh; }
}
</style>
</head>
<body>
<div id="game-container">
  <div class="bg-pattern"></div>
  <div class="border-top"></div><div class="border-bottom"></div>
  <div class="border-left"></div><div class="border-right"></div>

  <!-- 标题画面 -->
  <div id="title-screen" class="screen">
    <div class="title-emblem">秦</div>
    <div class="title-main">秦 王 殿</div>
    <div class="title-sub">· 殿 前 奏 对 ·</div>
    <div class="title-desc">
      秦王坐殿，召卿问对。<br>
      十问皆中，为国士无双；<br>
      一言不合，则拖出殿外——
    </div>
    <button class="btn" onclick="startGame()">开 始 奏 对</button>
    <div class="stats-bar">
      <span>📜 题库三百</span><span>⚔️ 十问定生死</span>
    </div>
  </div>

  <!-- 进场动画 -->
  <div id="entrance-screen" class="screen hidden">
    <div class="entrance-text">宣 —— 进殿奏对 ——</div>
  </div>

  <!-- 游戏画面 -->
  <div id="game-screen" class="screen hidden">
    <div class="game-header">
      <span class="progress-text" id="progress-text">第 壹 问</span>
      <div class="progress-dots" id="progress-dots"></div>
      <span class="category-tag" id="category-tag">治国方略</span>
    </div>
    <div class="game-scroll">
      <div class="king-icon">👑</div>
      <div class="question-text" id="question-text"></div>
      <div class="input-area">
        <input type="text" class="answer-input" id="answer-input"
               placeholder="在此输入你的回答…" autocomplete="off">
        <button class="submit-btn" onclick="submitAnswer()">奏 对</button>
        <div class="feedback-text" id="feedback-text"></div>
      </div>
    </div>
  </div>

  <!-- 死亡覆盖层 -->
  <div id="death-overlay">
    <div class="death-flash" id="death-flash"></div>
    <div class="death-icon">🗡️</div>
    <div class="death-title">拖 出 去 砍 了 ！</div>
    <div class="hint-box" id="hint-box">
      <div class="hint-label">📜 秦王曰：</div>
      <div class="hint-question" id="hint-question"></div>
      <div class="hint-content" id="hint-content"></div>
    </div>
    <button class="btn-retry" onclick="retryGame()">重 新 奏 对</button>
  </div>

  <!-- 胜利覆盖层 -->
  <div id="victory-overlay">
    <div class="victory-sparkles" id="victory-sparkles"></div>
    <div class="victory-title">🏆 大 善 ！</div>
    <div class="victory-sub">卿真国士无双也</div>
    <div class="victory-stats" id="victory-stats"></div>
    <button class="btn-victory" onclick="retryGame()">再 来 一 局</button>
  </div>
</div>

<script>
// ==================== 题库：300道 ====================
const ALL_QUESTIONS = [
  // === 富国强兵 (1-32) ===
  {q:"寡人欲使秦国富强，当以何策为先？",kw:["耕战","农战","富国强兵","商鞅变法","奖励耕战"],h:"商君变法以「耕战」为本：奖励农耕以实仓廪，奖励军功以强兵力。二者并举，国富兵强，方为霸业之基。"},
  {q:"为何要奖励耕织？",kw:["粮","食","衣食","足食","仓廪","足"],h:"仓廪实则知礼节，衣食足则知荣辱。百姓不饥不寒，方能安心务农，国家才有充足的粮食供养军队。"},
  {q:"如何让百姓勤于耕种？",kw:["奖励","免税","轻徭薄赋","授田","激励"],h:"商君之法：耕织多者免徭役，怠惰者收为官奴。赏罚分明，百姓自然努力耕作。"},
  {q:"寡人欲强兵，何策最速？",kw:["军功","二十等爵","斩首","赏爵","功爵"],h:"商君定二十等军功爵：斩敌一首赐爵一级。不论出身，有功即赏。人人奋勇，强兵之道也。"},
  {q:"为何要废除世卿世禄？",kw:["贤能","军功","论功行赏","血缘","贵族"],h:"世袭贵族无功受禄，将士寒心。废除世卿世禄，论功行赏，方能激励天下人为国效力。"},
  {q:"百姓不愿当兵，如何是好？",kw:["赏赐","爵位","田宅","利益","功名"],h:"重赏之下必有勇夫。以田宅爵位酬军功，以严刑惩逃兵。赏罚并举，民自踊跃。"},
  {q:"国以何为本？",kw:["农","农业","粮食","农耕","食"],h:"国以农为本。有粮则有民，有民则有兵，有兵则能战。商君曰：农者，国之本也。"},
  {q:"商人太多，影响农耕，如何处置？",kw:["重农抑商","限制","税","禁末","抑商"],h:"重农抑商——加重商税，限制商人活动，使人民专心务农。商君认为「末事」兴盛会动摇国本。"},
  {q:"如何增加国家收入？",kw:["税","赋税","盐铁","专卖","农税"],h:"开源节流。统一税制，按田亩征税；盐铁专卖由国家经营；奖励开荒增加耕地。多管齐下，国库自盈。"},
  {q:"六国皆富，秦何以胜之？",kw:["制度","变法","效率","集权","耕战"],h:"不在富而在制度。秦行法治，政令统一，资源调配远胜六国。耕战体系使全国如一部机器高效运转。"},
  {q:"如何保证军粮供应？",kw:["屯田","仓储","粮草","储备","运输"],h:"广建仓廪，丰年储粮备荒年。修驰道以便运输。军行所至，粮草先行——这是用兵第一要义。"},
  {q:"兵器不够精良，当如何？",kw:["标准化","统一","官营","工匠","制造"],h:"设立官府作坊，统一兵器规格，标准化生产。秦弩、秦剑之所以威震六国，正因工有常法，器有定式。"},
  {q:"国家贫弱，是先富国还是先强兵？",kw:["富国","经济","农业","先行","基础"],h:"先富国后强兵。国不富则无力养兵，勉强征兵只会压垮百姓。商君变法先从农业和税收入手，国力充实后再行扩军。"},
  {q:"如何评判一国之强弱？",kw:["粮食","人口","耕地","产出","综合"],h:"看其耕地产出、仓廪虚实、人口多寡、法令是否畅通。商君曰：观国者观其粟，察国者察其法。综合而断，方为公允。"},
  {q:"民有余粮，是否该全部征走？",kw:["适度","储备","留余","民力","可持续"],h:"万万不可！竭泽而渔，明年无鱼。征税适度，留有余粮，百姓才有再生产之力和安土之心。暴敛之下，必有反噬。"},
  {q:"牛耕和铁器，哪个对农业更重要？",kw:["并重","两者","牛耕","铁器","工具","犁"],h:"二者并重，缺一不可。铁器（尤其是铁犁）提高耕作效率，牛力则使深耕成为可能。秦大力推广铁器牛耕，农业因此腾飞。"},
  {q:"如何让荒地变良田？",kw:["水利","灌溉","开垦","郑国渠","施肥"],h:"兴修水利为第一要务。郑国渠成，关中为沃野。开垦需给政策：新垦之田数年免税。水到渠成，荒地自变良田。"},
  {q:"秦国人口不足，如何增加？",kw:["招徕","移民","生育","三晋","吸引"],h:"招徕三晋之民——给田宅、免徭役、赐爵位。地广人稀则招邻国之民来耕，此消彼长，一举两得。"},
  {q:"百姓流亡他国，如何挽留？",kw:["轻徭薄赋","减税","安民","户籍","惠政"],h:"轻徭薄赋，使民安居。编户籍以固民，行惠政以安民。百姓不愁衣食，何必远走他乡？"},
  {q:"一场战争要花多少钱粮？",kw:["量力","计算","粮草","国力","准备"],h:"大军未动，粮草先行。十万大军日费千金。发动战争前必先计算国力——粮可支几月，财可撑几时。量力而行，方能持久。"},
  {q:"盐铁为何要由国家专营？",kw:["利润","命脉","战略","控制","收入"],h:"盐铁乃民生与军事命脉。铁为兵器之材，盐为人人所需。由国家掌控，既能稳定价格，又可为国库提供稳定收入，且防止民间私铸兵器。"},
  {q:"商鞅变法的核心是什么？",kw:["法","信","赏罚","壹","法治"],h:"商君变法核心在三字：法、信、赏罚。法者，统一标准；信者，令出必行；赏罚者，有功必赏有过必罚。三者合一，变法乃成。"},
  {q:"如何防止官吏贪污？",kw:["严刑","连坐","监督","考核","透明"],h:"严刑峻法以震慑，连坐制度以约束，定期考核以监督。商君之法：吏贪一金亦斩。法严则吏畏，吏畏则民安。"},
  {q:"国库充盈但百姓贫困，是好是坏？",kw:["不好","藏富于民","民富","本末倒置","危险"],h:"国富民贫，危如累卵！国富当以民富为基础。商君变法虽重国利，但也强调「民有余则国用足」。本末倒置，早晚生变。"},
  {q:"打仗时，后勤跟不上怎么办？",kw:["计划","粮道","就地","准备","驰道"],h:"预则立，不预则废。作战之前就要修驰道、建粮仓、备民夫。战时保护粮道重于进攻——断粮三日，不战自溃。"},
  {q:"如何让新兵快速成为精兵？",kw:["训练","纪律","赏罚","实战","编制"],h:"严训练、明纪律、重赏罚。以什伍编制组织，有功同赏，有过连坐。新兵经三次实战即可成才。关键在于：训练时多流汗，战场上方能少流血。"},
  {q:"敌国粮多我粮少，如何与之持久战？",kw:["袭扰","断粮","游击","烧粮","速决"],h:"避其锋芒，袭其粮道。派遣轻骑深入敌后烧其粮草，断其补给。同时避免正面决战，寻机速战速决——粮少不可持久，当以奇取胜。"},
  {q:"山多地少，如何发展农业？",kw:["梯田","水利","因地制宜","畜牧","多种"],h:"因地制宜——山坡可筑梯田，谷地可蓄水灌溉。不宜耕种之处则发展畜牧。关中虽多山，但渭河平原土肥水足，正宜农耕。"},
  {q:"强兵之后是否就可以高枕无忧？",kw:["不","持续","居安思危","懈怠","保持"],h:"万万不可！兵强只是一时之势。商君虽死，其法犹存，秦方能持续强大。居安思危，保持制度活力，才是长治久安之道。"},
  {q:"军功爵位给了太多人，爵位不够怎么办？",kw:["升级","更高","标准","严格","调整"],h:"可提升标准——原来斩一首赐一爵，可改为斩三首赐一爵。或设更高爵位，使将士有永无止境的向上之路。制度灵活调整，方为长久之策。"},
  {q:"田地有限而人口增长，粮食不够怎么办？",kw:["提高亩产","技术","精耕细作","开荒","效率"],h:"一在提高亩产——推广良种和先进农具；二在开垦新田——伐木填泽，辟地为田；三在精耕细作——少种多收，效率为王。"},
  {q:"马匹不足，骑兵难成规模，如何解决？",kw:["养马","牧场","贸易","北地","繁育"],h:"设官营养马场于北地边郡，设马政专司繁育。同时与西戎贸易，换取良马。有马方有骑兵，有骑兵方能驰骋中原。"},

  // === 法令制度 (33-64) ===
  {q:"治国为何要以法治不以人治？",kw:["公平","标准","稳定","制度","客观"],h:"法为天下之规矩。以法治国，人人平等，不以君主好恶而变。以人治国，则人亡政息，国运随一人而起伏。"},
  {q:"法令太严，百姓怨声载道怎么处理？",kw:["坚持","公正","教育","不因言废法","解释"],h:"法令初行必有不适，但不能因怨声而废法。商君云：民不可与虑始，而可与乐成。坚持法令，同时公正执行，日久百姓自会明白。"},
  {q:"太子犯法该如何处置？",kw:["平等","处罚","师傅","同罪","不留情"],h:"法不阿贵，绳不挠曲。商君曾处罚太子师傅以明法。太子犯法不可刑太子，但应处罚其师——法之尊严，胜于人情。"},
  {q:"为什么要连坐？一人犯法，邻里受罚，公平吗？",kw:["震慑","监督","举报","预防","社会控制"],h:"连坐使人人互相监督，不敢犯法。看似残酷，实则大大减少了犯罪。当人人都成为法令的「守望者」，社会秩序自然安定。"},
  {q:"官吏曲解法律，如何防止？",kw:["明确","培训","考核","解释权","统一"],h:"法律条文务必明确清晰，减少模糊空间。设专职法官吏统一培训，定期考核其对律令的理解。法令解释权收归中央。"},
  {q:"新法颁布后，百姓不信，如何是好？",kw:["徙木立信","赏金","示范","诚信","执行"],h:"商君「徙木立信」——搬一根木头给十金，以此示民：官府言出必行。取信于民是新法推行的第一步，也是最关键一步。"},
  {q:"法应重刑还是轻刑？",kw:["重刑","轻罪重罚","震慑","预防","以刑去刑"],h:"商君主张「轻罪重罚」——小罪施重刑，使民不敢犯大罪。以刑去刑，最终达到不用刑罚的境界。重刑是手段，无刑是目的。"},
  {q:"如何让偏远地区的百姓也知晓法令？",kw:["宣传","官吏","布告","宣讲","普及"],h:"派遣明法之吏到各郡县宣讲法令，在乡里张贴布告。每乡设「法官」一人，专司解答百姓法律疑问。法之生命在于知晓。"},
  {q:"律法条文太多，法官自己也记不住，怎么办？",kw:["分类","简化","索引","专人","精简"],h:"律令当分类编纂，设目录索引。每类法令由专司法吏掌管。百姓问法，法吏必须当场答复——若答不出，该法吏受罚。以此逼迫法吏精通律令。"},
  {q:"如果国君自己违法，该当如何？",kw:["约束","以身作则","遵守","自罚","限度"],h:"国君亦当守法——这是法治的最高境界。虽然现实中难以完全做到，但明君应当自我约束，不以私意废公法。君守法，则天下人不敢违。"},
  {q:"六国也各有法令，为何秦国之法独强？",kw:["执行","落实","严格","统一","彻底"],h:"不在立法而在执行。六国法令多停留在竹简上，秦国之法却渗透到每个乡里。关键在于秦法统一、简明且执行彻底。"},
  {q:"法令朝令夕改，百姓无所适从，如何避免？",kw:["稳定","慎重","不轻改","深思","制定"],h:"立法之初务必深思熟虑，一经制定不宜轻改。法贵稳定，使百姓有所遵循。商君之法行之二十余年不改，方能深入民心。"},
  {q:"犯法者多为穷苦之人，是法有问题吗？",kw:["法不择人","一视同仁","执行","根源","经济"],h:"法本身无偏私——它只看行为，不看贫富。但若贫困是犯罪根源，则需在法治之外辅以民生政策。法与民生并行不悖，不可偏废。"},
  {q:"有人钻法令空子，如何应对？",kw:["修补","严密","案例","解释","完善"],h:"法令不可能一劳永逸，需要根据实施中暴露的问题不断修补完善。同时积累判例以供参考，使法令网络日趋严密。"},
  {q:"执法者自己犯法，罪加一等吗？",kw:["是","罪加一等","从重","知法犯法","加倍"],h:"正是！执法者犯法，知法犯法，罪加一等。商君对此从不姑息。执法者当为守法的表率，其身不正，何以正人？"},
  {q:"法律能否溯及既往？",kw:["不能","不溯及","法不溯既往","新法","从旧"],h:"法不溯及既往乃基本原则。新法只对颁布之后的行为有效。百姓在法令颁布前的行为，不受新法制裁。这是法的基本公正。"},
  {q:"证据不足时，该判还是不该判？",kw:["不该","疑罪从无","证据","宁可","不冤枉"],h:"疑罪从无，宁纵勿枉。没有确凿证据就定罪，会让天下人惶恐不安。宁可放过一个可疑之人，不可冤枉一个无辜之人。"},
  {q:"有人以钱赎罪，此法可行否？",kw:["不可","公平","贫富","破坏","一律"],h:"万万不可！以钱赎罪则富者无畏，法之公平荡然无存。法律面前，贫富应一律平等。赎罪之法，实为破坏法治的毒药。"},
  {q:"法令执行后犯罪率反而上升，何解？",kw:["统计","原来","发现","表面","执行"],h:"未必是犯罪增多，而是原来未被发现的犯罪被暴露出来。法令严格执行后，统计更完整。要看长远趋势，而非一时数据。"},
  {q:"如何检验一部法令的好坏？",kw:["效果","实践","百姓","执行","结果"],h:"看效果不看条文。好的法令应能达到预期目的——禁奸止邪，百姓安居。若法令虽严而犯罪不止，必是立法有误，需调整。"},
  {q:"法律和道德，哪个更重要？",kw:["法律","基础","并行","互补","法治"],h:"法律是底线，道德是高线。治国当以法为基础，以教化为辅助。商君重法不废教化。二者如车之两轮，并行不悖。"},
  {q:"小罪用重刑，是否过于残酷？",kw:["必要","震慑","长远","减少","以刑止刑"],h:"看似残酷，实为仁慈。小罪重刑，人人不敢越雷池一步，大罪自然减少。最终目的不是用刑，而是让人人不用受刑。此谓「以刑去刑」。"},
  {q:"犯同样罪行的人，是否该给不同判决？",kw:["不","统一","平等","标准","情节"],h:"原则上应一视同仁，法不阿贵。但可考虑具体情节——是否初犯、是否自首、动机如何。标准统一而判决微调，兼顾公正与情理。"},
  {q:"国君的口谕和法律条文冲突时，以谁为准？",kw:["法律","法大于","条文","法令","制度"],h:"以法律为准。明君不会因一时喜怒改变成法。若口谕与法令冲突，执法者有权提出异议。法治的真谛就是：法大于一切个人意志。"},
  {q:"法令是否需要与时俱进不断修改？",kw:["适时","稳定","渐变","世变","调整"],h:"法令当因时而变，但不宜频繁修改。商君云：治世不一道，便国不法古。世变则法变，但重大修改需深思熟虑，忌朝令夕改。"},
  {q:"如何让法令成为百姓的信仰？",kw:["执行","公平","长期","信任","取信"],h:"唯有长期公正执行。一次不公胜过十次不执行带来的危害。徙木立信，积累信任。一代人之后，守法便成为习惯和信仰。"},
  {q:"法家与儒家治国理念的根本区别在哪？",kw:["法","礼","制度","人性","强制"],h:"法家主法治——以强制性的法律制度规范行为；儒家主礼治——以道德教化引导人心。法家认为人性趋利避害，需用法来约束；儒家相信人性可教化向善。"},
  {q:"商君之后，法令如何持续执行？",kw:["制度","不以人亡","体系","官吏","成文"],h:"关键是把法令变成制度，而不是依赖某个人。商君虽死，其法已成体系——有成文法令、有执法官吏、有司法程序。制度不因一人存亡而废立。"},
  {q:"征服六国之后，是否需要在全天下推行秦法？",kw:["统一","推行","融合","渐进","必要"],h:"天下一统，法令亦当统一。但推行需循序渐进——尊重当地风俗，渐进推行秦法。车同轨、书同文、行同伦，法律统一是天下统一的基石。"},
  {q:"秦法与其他诸侯国法律相比，最大特点是什么？",kw:["重刑","执行","统一","严密","不留情"],h:"秦法三大特点：一曰严——轻罪重罚；二曰密——覆盖社会生活各方面；三曰必——有法必依，执法必严，无一例外。"},
  {q:"有人教唆他人犯罪，本人未动手，该如何判？",kw:["同罪","教唆","首恶","从重","主谋"],h:"教唆者罪同主犯，甚至更重。未动手而教唆，说明其心更恶。除恶务尽，首恶必究。教唆犯罪者，当以同罪论处。"},
  {q:"如果人人都懂法，是否更难治理？",kw:["不","更好","知法","守法","透明"],h:"恰恰相反！人人懂法，则人人知何可为、何不可为。百姓依法行事，无需官吏时时督促。法之理想状态就是人人知法而守法。"},

  // === 用人之道 (65-96) ===
  {q:"寡人欲求贤才，如何识人？",kw:["观行","考察","试用","听言观行","实践"],h:"听其言，观其行。不以貌取人，不以言辞取人。给其职事，观其成效；给其难题，察其应对。真才实学在实践中方能显露。"},
  {q:"用人之时，德与才哪个更重要？",kw:["德","品德","忠诚","德行","才德兼备"],h:"德为才之帅，才为德之资。无德之才如同猛虎添翼，危害更大。先用德后用才，二者兼备方为上品。"},
  {q:"亲戚请求官职，给还是不给？",kw:["不给","任人唯贤","才能","避嫌","考核"],h:"不因私情而授官。若亲戚确有才能，也需通过正规途径考核选拔。任人唯亲乃亡国之道，任人唯贤方为明君。"},
  {q:"如何判断一个人是否忠诚？",kw:["时间","考验","利益","逆境","观察"],h:"日久见人心，板荡识忠臣。在顺境中人人忠诚，在逆境中、在利益面前方能鉴别真伪。给以考验，察其本心。"},
  {q:"千金买马骨的故事告诉寡人什么道理？",kw:["诚意","示范","千金买骨","求贤","态度"],h:"燕昭王千金买马骨，意在示天下以求贤之诚意。果真四方贤士闻风而至。求贤不在于出的价钱，而在于展示的态度与诚心。"},
  {q:"人才出走投奔他国，如何防止？",kw:["重用","礼遇","信任","发展","待遇"],h:"人才出走，往往是因为在本国得不到重用和尊重。与其防堵，不如给人才以施展的舞台和应有的礼遇。士为知己者死。"},
  {q:"对待功臣应当如何？",kw:["赏赐","尊重","防范","适度","平衡"],h:"功臣当赏，但不可使其功高盖主。给予荣华富贵以酬其功，同时分散其权以防其骄。既要让人看到功臣的好下场，又不能让一人独大。"},
  {q:"部下意见与自己不同，该听还是该压？",kw:["听","兼听","纳谏","开明","不同意见"],h:"兼听则明，偏信则暗。不同意见是决策的镜子——能看到自己未曾注意的风险。鼓励部下直言，方为明君。"},
  {q:"如何发现一个人的真才实学？",kw:["试用","任务","实际","考核","考察"],h:"试之以事，察之以验。口头之言不可尽信，当以实际任务考察。授之职，观其能；委之任，验其才。金子在火中淬炼，人才在实践中显现。"},
  {q:"两个能臣互相争斗，你该如何？",kw:["平衡","制衡","调和","利用","公正"],h:"善加利用——使之互相制衡，同时保持公正，不偏袒任何一方。良性的竞争可激发更多才智，但要防止演变为你死我活的党争。"},
  {q:"如何用比自己聪明的人？",kw:["信任","授权","虚心","驾驭","胸怀"],h:"身为国君，不必事事胜过臣下。能用比自己聪明的人，正是明君之大智慧。信任而不猜忌，授权而不掣肘，方能人尽其才。"},
  {q:"旧臣和新秀如何平衡？",kw:["新旧并用","经验","活力","兼顾","互补"],h:"旧臣有经验，新秀有锐气。两者并用，各取所长——旧臣掌稳定，新秀主变革。不可偏废，新旧交替如四季轮回。"},
  {q:"一人身兼多职好还是专人专职好？",kw:["专一","专人专职","分散","专业","分工"],h:"专人专职为佳。一人精力有限，兼职过多则样样不精。且权力过于集中，易生专权之患。分权分职，互相监督，方为稳妥。"},
  {q:"有才但品行不佳者，能否用之？",kw:["慎用","限制","短期","控制","监督"],h:"可暂时用之，但需严加监督和限制。才能如刀——可杀敌也可伤己。用其才而制其恶，不可给其独断专行之权。"},
  {q:"将领在外打仗，君主在朝中该不该遥控指挥？",kw:["不该","将在外","信任","专业","放权"],h:"将在外，君命有所不受。战场形势瞬息万变，千里之外的君主无法及时判断。选定良将后应当充分信任，不宜遥控掣肘。"},
  {q:"如何培养下一代人才？",kw:["教育","实践","师承","历练","储备"],h:"设学官以教之，给实践以练之，以老带新以传之。人才不可等到用时才找，平日就要储备培养。十年树木，百年树人。"},
  {q:"大臣进谏时言辞激烈，该忍耐还是该问罪？",kw:["忍耐","纳谏","包容","胸怀","虚心"],h:"能进逆耳之言者，正是忠臣。良药苦口利于病，忠言逆耳利于行。明君会感谢直言敢谏之人，而非问罪。"},
  {q:"如何让臣子不敢欺瞒？",kw:["明察","监督","赏罚","独立情报","核实"],h:"建立独立的情报渠道，不依赖单一来源。兼听各方之言，互相印证。对欺瞒者严惩不贷，示以警戒。明君不易被蒙蔽。"},
  {q:"用布衣出身的人还是用贵族出身的人？",kw:["不拘一格","才能","不论出身","唯才是举","开放"],h:"唯才是举，不拘出身。商君本人就是卫国的「诸庶孽公子」，既非嫡系也非权贵。英雄不问出处，关键在于真才实学。"},
  {q:"前朝遗臣能否留用？",kw:["能用","才","鉴别","忠诚","考察"],h:"可择优留用。前朝遗臣熟悉政务，若真心归顺且确有才能，用之可保政事延续。但需经过忠诚考察，不可使其掌兵权。"},
  {q:"如何判断一个人是否胜任更高的职位？",kw:["小试","逐步","考察","历练","循序渐进"],h:"不可一步登天。先给其小职务试之，做得好再逐步提升。在每个层级都建立考察标准——能胜任小职方能托付大任。循序渐进，降低风险。"},
  {q:"臣子犯错，是严厉惩罚还是给改过机会？",kw:["酌情","初犯姑且","再犯","区分","程度"],h:"看错误性质。无心之失、初犯且后果不严重的，给予改过机会。故犯、造成严重后果的，严惩不贷。赏罚不在轻重，而在公正恰当。"},
  {q:"人才众多但一团散沙，如何凝聚？",kw:["目标","制度","赏罚","文化","组织"],h:"以明确的共同目标凝聚人心，以制度规范行为，以赏罚引导方向。当每个人都清楚自己的位置和价值，散沙也能凝聚成塔。"},
  {q:"幕僚提出的三个方案都有道理，如何抉择？",kw:["利弊","权衡","长远","对比","后果"],h:"逐一分析每个方案的利弊和长远后果。哪个对秦国利益最大？哪个风险最小？哪个与长远战略最一致？综合权衡后方可定夺。"},
  {q:"老臣倚老卖老不服从新令，怎么办？",kw:["尊重","调整","权威","威信","因势利导"],h:"先礼后兵——尊重其过往功绩，给予体面。同时坚定推行新令，不以一人而废政。可考虑给其闲职荣衔以示尊崇，但不令其阻碍改革。"},
  {q:"有没有永远忠诚的臣子？",kw:["没有","利益","人性","制度","监督"],h:"没有绝对忠诚，只有利益与制度的约束。不要期待人性的完美，而应设计制度使人不得不忠。法、术、势三者结合，方能驾驭臣下。"},
  {q:"年轻人是否该破格提拔？",kw:["可以","不拘一格","能力","打破","破格"],h:"确有非凡才能者，可破格提拔。甘罗十二岁为秦相，凭的是能力而非年龄。论资排辈会埋没天才，不拘一格方能人才辈出。"},
  {q:"如何处理功臣之后的骄横？",kw:["约束","教育","不姑息","法纪","削权"],h:"不可因父辈功勋而姑息。骄横违法者同样依法处置——法不因功臣之后而例外。同时加强教育，使其明白功勋不可世袭。"},
  {q:"外国来的客卿能否信任？",kw:["考察","能力","实际","不论出身","贡献"],h:"以能力论，不以国籍论。商君卫人，张仪魏人，范雎魏人——皆为秦国立下不世之功。关键在于考察其实际贡献和忠诚度，而非出身。"},
  {q:"一个聪明人，为何要为你所用？",kw:["平台","施展","重用","知遇","价值"],h:"给他施展才华的舞台，给他实现抱负的空间，给他应有的尊重和回报。士为知己者死——能识人、用人、信人，方得人心。"},
  {q:"如何营造让人才主动上门的氛围？",kw:["求贤令","示范","待遇","尊重","声誉"],h:"高调发布求贤令，善待已投奔的人才，让他们成为最好的广告。人才看到投秦者获得重用和尊重，自然会纷至沓来。"},
  {q:"用人之道与用兵之道有何相通之处？",kw:["知人善任","各取所长","组织","调配","量才"],h:"皆通「知」与「用」二字——知人之长短如知兵之强弱，用人之巧拙如用兵之奇正。将合适的人放在合适的位置，正如将合适的兵用在合适的战场。"},

  // === 军事谋略 (97-128) ===
  {q:"寡人欲伐六国，当以何国为先？",kw:["韩","近者","弱","先近后远","各个击破"],h:"先取韩魏，近而弱者先除之。远交近攻，各个击破。韩为天下咽喉，取韩则打开了东进的大门。这是范雎的远交近攻之策。"},
  {q:"六国合纵攻秦，寡人当如何应对？",kw:["连横","分化","各个击破","瓦解","离间"],h:"以连横破合纵。派遣谋士游说六国，用利益分化其联盟。合纵因利而聚，必因利而散。找准最薄弱的一环，各个击破。"},
  {q:"两军对阵，何时该战何时不该战？",kw:["必胜","把握","优势","时机","条件"],h:"战则必胜，不战则已。敌强我弱则避其锋芒，待其疲惫；敌弱我强则雷霆一击。孙膑曰：知可以战与不可以战者胜。"},
  {q:"如何以少胜多？",kw:["奇袭","分化","集中","各个击破","士气"],h:"不可正面硬拼。集中优势兵力攻敌一部，形成局部优势；奇袭其要害，扰乱其军心；分化瓦解，各个击破。以少胜多靠的是智，不是力。"},
  {q:"粮草被断，军心大乱，该如何？",kw:["镇定","稳定军心","就地取粮","撤退","安抚"],h:"主帅当先镇定。散布假消息稳定军心——「援军将至」。同时派小队寻找替代粮源，实在无法则有序撤退。军心比粮草更重要：有粮无心亦败，有心无粮可谋。"},
  {q:"敌将勇猛，无人能敌，如何应对？",kw:["智取","离间","陷阱","消耗","避免"],h:"不以力敌，以智取。可用离间计使其失宠于君，可用埋伏消耗其锐气，可引其深入然后围困。智勇双全者，当以智胜其勇。"},
  {q:"攻城和野战，哪个更难？",kw:["攻城","十倍","消耗","围困","伤亡"],h:"攻城远难于野战。兵法曰：十则围之，五则攻之——攻城需要极大兵力优势。攻城伤亡惨重且耗时长久，非万不得已，不轻易攻城。"},
  {q:"如何让士兵不怕死？",kw:["赏罚","军功","纪律","士气","同袍"],h:"赏罚分明使士兵觉得死有所值——军功爵位惠及家人。严明纪律使士兵更怕军法而非敌人。同袍情谊使士兵为彼此而战。"},
  {q:"间谍的作用有多大？",kw:["巨大","情报","知己知彼","关键","先行"],h:"间谍之用，大矣！知己知彼，百战不殆。一个优秀间谍胜过十万大军。用间谍获取情报是用兵的第一步——信息优势决定战场胜负。"},
  {q:"打了胜仗后该乘胜追击还是见好就收？",kw:["视情况","实力","追击","穷寇","评估"],h:"视实力而定。若兵力充足、士气正旺，可乘胜追击扩大战果。但需警惕孤军深入——穷寇莫追。评估双方实力后再做决断，不可被胜利冲昏头脑。"},
  {q:"地形对用兵有何影响？",kw:["决定","致命","地利","利用","选择"],h:"地形决定战术——山地利于伏击，平原利于骑兵，河川可为屏障。善用兵者必先观地形，占据有利地势。孙子曰：夫地形者，兵之助也。"},
  {q:"夜袭是否总是有效？",kw:["不","风险","混乱","识别","准备"],h:"夜袭有利有弊。利在出其不意，弊在自军也可能陷入混乱。夜袭需要精兵强将、充分的准备和识别标记。谋定而后动，不轻易冒险。"},
  {q:"如何训练一支百战百胜的军队？",kw:["纪律","训练","赏罚","实战","将领"],h:"严明纪律为第一——令行禁止，千人如一人。赏罚分明为第二——人人奋勇。持续训练为第三——平时多流汗，战时少流血。良将为第四——千军易得，一将难求。"},
  {q:"敌退我追，但判断不了是诱敌还是真退，怎么办？",kw:["观察","旗帜","斥候","谨慎","试探"],h:"派斥候深入侦察，观察敌军撤退时旗帜是否整齐、阵型是否有序。乱而真退，整而诱敌。用小股部队试探性追击，切莫全力压上。"},
  {q:"围城时敌军死守不出，如何破城？",kw:["断粮","攻心","地道","诱降","围三缺一"],h:"围三缺一——给敌军留一条退路，瓦解其死守的决心。断其粮草与水源，挖掘地道，发动心理攻势。围城是意志的较量，谁先动摇谁就输了。"},
  {q:"冬季用兵有什么特殊注意事项？",kw:["保暖","缩短","后勤","冻伤","补给"],h:"保暖为第一大事——冻伤比刀剑更致命。缩短战时，避免在极寒中持久作战。后勤补给加倍——冬季消耗远超其他季节。若条件不允许，宁可推迟出兵。"},
  {q:"新招募的军队何时才能投入战斗？",kw:["训练后","纪律","基础","三个月","达标"],h:"至少需要经过基本训练，令行禁止、阵型不乱方可上阵。仓促上阵的新兵在战场上会溃散，不仅无益反而动摇军心。一般以三个月为基本训练期。"},
  {q:"如何防守一座孤城？",kw:["粮草","民心","防御","外交","坚守"],h:"充足的粮草是第一保障——有粮则能守。团结城内百姓军民一心。完善城防设施。同时积极寻求外援——孤城不可久守，突围或求援是必由之路。"},
  {q:"骑兵、步兵、弓兵如何配合？",kw:["协同","互补","阵型","配合","各司其职"],h:"弓兵远程消耗，步兵正面接敌，骑兵侧翼包抄。各兵种扬长避短、协同作战。关键在于指挥调度——步调一致方能发挥最大威力。"},
  {q:"敌众我寡时应战还是撤退？",kw:["不硬拼","保存","游击","消耗","智取"],h:"保存实力为第一。敌众我寡时不正面决战，可化整为零分散游击，消耗敌军。待敌疲惫或分散时再寻机集中兵力攻其要害。"},
  {q:"打了败仗后如何收拾残局？",kw:["稳定军心","总结","整顿","抚恤","复盘"],h:"先稳定军心——追究责任但不追究过度，重罚逃兵重赏勇士。总结教训——败在哪里？如何避免？抚恤伤员，整顿编制，择机雪耻。"},
  {q:"如何对付擅长游击战的敌人？",kw:["坚壁清野","固守","断绝","以静制动","根据地"],h:"坚壁清野——使其抢不到粮食物资。固守要地——以静制动，不轻易出击。断绝其与民众的联系。游击战靠的是民众支持，切断这条线，其自难持久。"},
  {q:"战争何时该结束？",kw:["目的","国力","代价","及时","见好就收"],h:"达到战略目的即可收手。战争是手段不是目的。当付出的代价超过收益，当国力难以为继，当敌军已无威胁——此时就该收手。穷兵黩武，国必危矣。"},
  {q:"盟友临阵倒戈，如何应对？",kw:["预案","独立","不依赖","撤退","调整"],h:"永远不要完全依赖盟友。平时就应有独立作战的能力和预案。一旦盟友倒戈，首先稳住自军阵脚，视情况调整战略——或退或战，首保主力。"},
  {q:"兵力相当的情况下，什么决定胜负？",kw:["士气","指挥","情报","意志","时机"],h:"士气与指挥决定胜负。兵力相当则看谁更敢用兵——奇正相生，虚虚实实。将帅的临场判断、军队的意志力和执行力，这些「软实力」往往比兵力数字更重要。"},
  {q:"是否需要提前准备多套作战方案？",kw:["需要","预案","应变","灵活","准备"],h:"必须的！至少需三套方案：最优、次优、最差。战场形势瞬息万变，预案越多，应变越灵活。但所有预案都服务于一个明确的战略目标。"},
  {q:"名将用兵和普通将领用兵的根本区别在哪？",kw:["变化","应变","灵活","创造","判断"],h:"名将不拘泥于兵法条文，能根据实际情况灵活变通。孙子曰：兵无常势，水无常形。名将善用奇正之变，普通将领只会按部就班。"},
  {q:"远征和本土作战，哪个更有利？",kw:["本土","补给","熟悉","民心","防守"],h:"本土作战优势明显——补给便利、地形熟悉、民心可用。远征则步步维艰——补给线漫长、水土不服、民情不熟。非万不得已，不轻易远行千里。"},
  {q:"明知道打不赢还要打，是对是错？",kw:["错","保存实力","撤退","战略","不逞匹夫"],h:"明知不胜而战，是为不智。保存实力以待时机，才是真正的勇敢。退一步不是懦弱，而是为了进十步。匹夫之勇不足取，战略之忍方为大智。"},
  {q:"如何让敌人高估你的实力？",kw:["虚张声势","疑兵","情报","伪装","夸耀"],h:"多布疑兵——增灶、多竖旗帜、夜间多点篝火。故意泄露假情报。在敌人面前展示军容最盛的一面。虚则实之，实则虚之，让敌人永远猜不透你的真实。"},
  {q:"战胜后如何治理占领区？",kw:["怀柔","安抚","秦法","收心","逐步"],h:"刚柔并济。军事占领后立即推行秦法以稳定秩序，同时安抚百姓、减免赋税以收民心。不可一味高压——占领容易，长治久安难。"},
  {q:"最好的胜利是怎样的？",kw:["不战","全胜","完好","最小代价","完整"],h:"不战而屈人之兵，善之善者也。使敌国完整降服，比摧毁之后重建划算得多。以最小的代价获取最大的胜利，才是真正高明的用兵。"},

  // === 外交纵横 (129-158) ===
  {q:"六国合纵，寡人该如何分化瓦解？",kw:["连横","利益","离间","各个击破","收买"],h:"以连横破合纵——与六国分别结盟，用利益分化。六国各有算盘，并不团结。找准它们之间的利益冲突，以重金和土地收买其中一国，合纵自破。"},
  {q:"何时应该结盟，何时应该背盟？",kw:["利益","实力","时机","需要","评估"],h:"一切以秦国利益为准。当联盟有助于削弱强敌时可结，当联盟成为束缚时可弃。但背盟需有把握——不可四处树敌。利益是唯一准则。"},
  {q:"派遣使者去敌国，最重要的素质是什么？",kw:["胆识","口才","应变","忠诚","智慧"],h:"胆识与口才并重。胆识——深入虎穴面不改色；口才——陈说利害使对方折服。还需随机应变的智慧和坚定不移的忠诚。"},
  {q:"敌国提出割地求和，该接受还是继续打？",kw:["评估","长远","彻底","消灭","战略"],h:"看战略目的。如果其土地是战略要地，接受割地比继续消耗更划算。但若该国有恢复元气再战的可能，则须继续打击直至其无力再起。"},
  {q:"质子制度有用吗？",kw:["有限","利益","不信","威慑","形式"],h:"有一定作用但不可完全依赖。质子是威慑而非保障——当真要翻脸时，一个质子的生死挡不住利益。可要求质子，但不要以为万无一失。"},
  {q:"如何在谈判中占据优势？",kw:["实力","信息","筹码","底牌","准备"],h:"实力是最大的筹码。谈判前充分准备——了解对方的底牌、需求和弱点。让对方看到你的实力，感到你的诚意，忌惮你的后果。"},
  {q:"外臣出使时若被收买背叛，如何预防？",kw:["家人","监督","利益","选拔","忠诚"],h:"扣其家眷为人质——非不信任，乃制度保障。同时派副使暗中监督，一封情报多方核实。选忠信之人出使为第一道防线。"},
  {q:"和亲之策是否可取？",kw:["权宜","暂时","不长久","利益","工具"],h:"可作为权宜之计，但非长久之策。和亲能换一时和平，却换不来真正安全。当实力对比变化时，一纸婚约一文不值。终究要靠实力说话。"},
  {q:"远交近攻的战略为何有效？",kw:["分化","防止","各个击破","孤立","逐个"],h:"结交远方的国家，攻打邻近的国家。这样每次只需对付一个敌人，而远处的大国不会感到威胁。范雎此策使秦国能够集中力量，逐个消灭邻国。"},
  {q:"邻国来借粮，借还是不借？",kw:["看情况","利益","条件","要地","交换"],h:"看是否有利。若借粮可换取战略要地或重要承诺，可借。若不借可使其疲弱而有利于日后吞并，则不借。每一次外交举措都要计算利弊得失。"},
  {q:"如何让敌国君臣互相猜忌？",kw:["反间计","贿赂","谣言","假情报","离间"],h:"派人暗中散布谣言，重金收买其近臣，伪造通敌信件。反间计的精髓在于：真假掺杂，使其内部猜疑链一旦启动就停不下来。"},
  {q:"小国请求保护以对抗大国，是否应允？",kw:["视战略","利益","屏障","牵制","风险"],h:"看其地理位置和战略价值。若此小国可作为秦与敌国之间的缓冲，则可保护。若保护它会直接招致与大国的战争，则需慎重权衡。"},
  {q:"两敌国交战，秦应持何立场？",kw:["坐观","渔利","援助","削弱","鹬蚌"],h:"坐山观虎斗，鹬蚌相争渔翁得利。援助较弱的一方以延长战争，使两败俱伤。待双方筋疲力尽，再出兵收拾残局。"},
  {q:"如何在外交场合展示国威？",kw:["礼仪","排场","威严","从容","自信"],h:"礼仪周全而不卑不亢，排场宏大而从容自若。使者仪态就是国家形象的投射。令对方感到敬畏而非反感——展示实力是在无形中施压。"},
  {q:"口头承诺和书面盟约，哪个更可靠？",kw:["都不","实力","利益","书面","约束"],h:"都不如实力可靠。书面盟约稍胜口头承诺——至少有据可查、违约有代价。但真正的保障永远是自身实力。盟约只是一张写着字的竹简。"},
  {q:"如何处理与强国的关系？",kw:["不卑不亢","示弱","准备","伺机","隐忍"],h:"表面示弱以麻痹之，暗中蓄力以准备之。不主动挑衅但也不丧失尊严。隐忍待时——强国有衰落之日，届时便是秦国的机会。"},
  {q:"多国同时在拉拢秦国，如何抉择？",kw:["利益","最优","中立","待价而沽","拖延"],h:"待价而沽——不急于站队。谁的出价对秦最有利就先倾向谁。但保持灵活，随时准备转换阵营。中立有时是最有利的位置。"},
  {q:"如何在外交中利用敌国国内的矛盾？",kw:["扶植","支持弱者","挑拨","内乱","分化"],h:"扶植其国内的反对势力，支持其政治斗争中较弱的一方，制造和利用其内部矛盾。内乱是最便宜的外交武器——不费一兵一卒即可削弱敌人。"},
  {q:"割地换和平还是奋战到底？",kw:["不割","奋战","不可示弱","寸土","斗志"],h:"一寸山河一寸血，不可轻割！割地示弱只会让对方得寸进尺。奋战到底，即使损失惨重也保住了国格。今日割五城，明日割十城，然后得一夕安寝——此迁灭之道。"},
  {q:"战败之后的谈判应该如何进行？",kw:["不卑","拖延","条件","保留实力","缓兵"],h:"表现出不惧再战的姿态，以此争取较有利的条件。多用拖延战术——谈判中争取时间恢复元气。即使战败，也不可让对方觉得你已任人宰割。"},
  {q:"强国来使态度傲慢，该如何应对？",kw:["不卑不亢","对等","自信","不失礼","尊严"],h:"不卑不亢，对等回应。以礼相待但不失尊严。若对方过分无礼，可适度反制——但要把握分寸，不可意气用事引发不必要的战争。"},
  {q:"外交的根本是什么？",kw:["实力","利益","诚信","战略","谋划"],h:"实力是外交的根本。没有实力的外交只是空中楼阁。国力强则外交主动，国力弱则处处受制。所以归根到底：富国强兵才是最好的外交。"},
  {q:"送礼给敌国重臣，有用吗？",kw:["有用","收买","腐蚀","情报","分化"],h:"非常有用！重金收买敌国重臣，使其为我所用——提供情报、影响决策、制造分裂。用间之道，以利为先。金钱买来的情报往往比刀剑更管用。"},
  {q:"如何处理与周天子的关系？",kw:["名义","尊重","利用","正统","挟天子"],h:"利用周天子的名义号召力——挟天子以令诸侯。名义上尊崇周室，实际上为秦所用。正统性是珍贵的政治资源，不可轻易抛弃。"},
  {q:"两国势均力敌，如何打破平衡？",kw:["联盟","奇袭","内部","等待","创造机会"],h:"寻求第三方的加入以打破平衡，或等待对方内乱、天灾等人力不可控的变数。也可主动创造机会——用计使其犯错，然后抓住机会一举突破。"},
  {q:"新征服地区的首领要求自治权，该如何回应？",kw:["不允","集权","统一","逐步","郡县"],h:"不可给予自治权——自治是分裂的种子。设郡县派官吏直接管理。但对于新附之地，可给予一定过渡期，逐步推行秦制，避免激起强烈反抗。"},
  {q:"如何在会盟中获取最大利益？",kw:["准备","筹码","底线","观察","灵活"],h:"会前做足准备——明确自己想要什么、能接受什么、底线在哪里。会中多观察少表态，灵活调整策略。不急于达成协议，有时拖延本身就是一种策略。"},
  {q:"敌国发生饥荒，是趁火打劫好还是雪中送炭好？",kw:["趁火打劫","削弱","不出手","进攻","天赐"],h:"趁其病，要其命！敌国饥荒是天赐良机——此时不出兵更待何时？若反而援助粮食，无异于养虎为患。趁火打劫虽不光彩，却是最有利的选择。"},
  {q:"是否需要向外邦展示秦的先进技术？",kw:["不","保留","军事","保密","泄露"],h:"军事技术绝不可示人。农耕、医方等民生技术可适度展示以树立威望。但任何可能被用于战争的技术，都应严格保密。技术优势就是战争优势。"},
  {q:"如何在外交中识破对方的谎言？",kw:["多方核实","观察","细节","逻辑","对比"],h:"多方核实其说法，注意其言辞与行为是否一致。细节中藏真相——前后矛盾之处就是谎言的破绽。不急于相信，多留验证的时间。"},

  // === 君臣之道 (159-190) ===
  {q:"为君者最重要的品质是什么？",kw:["明","明察","决断","公正","兼听"],h:"明——明察秋毫，不被蒙蔽；能辨忠奸，善做决断。明君不一定要最聪明，但必须能识别和任用聪明人。明则不被欺，断则事必成。"},
  {q:"君王该不该事必躬亲？",kw:["不该","授权","分工","信任","抓大放小"],h:"不该。君王精力有限，事必躬亲则大事无人决断。韩非曰：下君尽己之能，中君尽人之力，上君尽人之智。君王的职责是驾驭群臣，不是取代群臣。"},
  {q:"如何处理大臣之间的争斗？",kw:["控制","利用","平衡","裁决","不偏袒"],h:"适度利用以互相制衡，但须控制在不损害国政的范围内。大臣适当争斗可避免一人独大，但争斗过头则祸国殃民。君主要做公正的裁决者。"},
  {q:"是否可以完全信任一个人？",kw:["不可","制度","监督","平衡","怀疑"],h:"不可！韩非曰：人主之患在于信人，信人则制于人。不是不信任任何人，而是用制度保证每个人都在监督之下。绝对的信任是绝对的危险。"},
  {q:"昏君和明君的根本区别是什么？",kw:["兼听","纳谏","远小人","明智","自我认知"],h:"明君兼听，昏君偏信。明君知自己不足，故广开言路、虚心纳谏；昏君自以为无所不知，独断专行。能否听取不同意见，是区分明昏的关键。"},
  {q:"君王如何保持对国政的全面了解？",kw:["多渠道","情报","独立","核实","兼听"],h:"建立多个独立的情报来源，不依赖单一渠道。兼听各方之言，互相印证。身边既要有报喜之人，更要有敢于报忧之人。"},
  {q:"权臣功高震主，该如何处理？",kw:["削权","分权","架空","提拔","平衡"],h:"不宜直接铲除——功臣被杀会寒天下人之心。可明升暗降，分其权力，提拔其副手以平衡。使其有尊荣而无实权，有功名而无威胁。"},
  {q:"部下报喜不报忧，如何改变？",kw:["鼓励","惩罚","示范","纳谏","开明"],h:"奖赏敢于报忧的人，惩罚隐瞒坏消息的人。以身示范——当听到坏消息时不迁怒于报信者。营造讲真话安全、说假话危险的氛围。"},
  {q:"君主和臣子的关系是什么？",kw:["互利","利益","契约","各取所需","君臣"],h:"君臣关系本质上是利益交换——君以爵禄换臣之才智劳力。韩非曰：君臣之交，计也。这不是冷酷，而是清醒。看清本质方能驾驭得当。"},
  {q:"如何避免被谗言蒙蔽？",kw:["核实","多方","独立","查证","亲自"],h:"不轻信任何单方面的言论，重要之事务必多方核实。对进谗言者保持警惕——观察其动机。与关键大臣保持直接沟通，不被中间人隔离。"},
  {q:"君主是否需要隐藏自己的真实想法？",kw:["需要","术","不测","威严","神秘"],h:"需要。韩非曰：术者，藏之于胸中。君主的真实想法不可让臣下完全掌握——保持不测之威。臣不知君之所思，方不敢轻易投其所好。"},
  {q:"如何确保政令畅通无阻？",kw:["执行","监督","奖惩","渠道","问责"],h:"建立从中央到地方的畅通渠道，每一级都有明确的责任人。严惩执行不力者，重赏贯彻执行者。定期核查政令落实情况——令出必行，行必有果。"},
  {q:"君王犯错后，该不该公开认错？",kw:["视情况","威信","改过","方式","承认"],h:"可以改错但不宜过度公开检讨——君王威信受损会动摇国本。明智的做法是以行动改正，而非口头承认。改过不吝，但保持尊严。"},
  {q:"如何对待前朝旧臣？",kw:["甄别","才能","忠诚","考察","适当"],h:"逐一甄别——有才且忠者留用，有才不忠者闲置，无才不忠者清除。前朝旧臣熟悉制度，完全清除会导致政事混乱。但必须确保他们忠于新朝而非旧主。"},
  {q:"后宫干政，该如何处理？",kw:["严禁","界限","制度","隔离","杜绝"],h:"后宫不得干政——这是铁的规矩。以制度明确划分内外界限，违者严惩。历史上的祸乱多起于后宫干政，此门一开国无宁日。"},
  {q:"君主需要什么样的「耳朵」和「眼睛」？",kw:["广","多","独立","真实","全方位"],h:"君主的耳目要广布天下——朝堂之上有谏官，乡野之间有密探，文武百官皆是信息的来源。最重要的是：保证信息的真实性和多样性。"},
  {q:"面对大臣的集体反对，君主该让步还是坚持？",kw:["判断","分析","正确","坚持","权衡"],h:"看自己是否正确。若确信决策正确——如商鞅变法时满朝反对而秦孝公坚持——就该坚定推行。若自己也存疑，则应重新评估。原则问题不让步，方法问题可协商。"},
  {q:"如何评价一个君主的好坏？",kw:["结果","功业","百姓","开疆","民生"],h:"看结果不看过程——开疆拓土、百姓安居、国力强盛。不以个人品德评判，而以对国家的贡献评判。功业和民生是衡量君主的两把尺子。"},
  {q:"权术是君主的必要手段吗？",kw:["是","必要","工具","驾驭","平衡"],h:"是必要手段。韩非所言「术」，即君主驾驭群臣的方法——赏罚、制衡、考核。权术不是目的，而是维持政治秩序的工具。无术则无法驾驭群臣。"},
  {q:"君威和君恩，哪个更重要？",kw:["并重","威","恩","平衡","恩威"],h:"恩威并施，二者不可偏废。有威无恩则上下离心——臣民惧怕而不敬服；有恩无威则政令不通——臣民亲近而无敬畏。恩威之间，保持平衡。"},
  {q:"如何处理宗室子弟？",kw:["约束","教育","不特殊","法","限制"],h:"宗室子弟须受法律同等约束，不可享受特殊待遇。给其良好的教育，授其适当的职务——但不可给其过大的权力。宗室内乱是亡国最常见的内部原因。"},
  {q:"寡人百年之后，如何确保继承顺利？",kw:["制度","太子","安排","提前","明确"],h:"早立太子，明确继承人，消除其他宗室子弟的非分之想。为太子配备优秀的老师，逐步让其参与政事。继承之事如同接力——交接平稳比速度更重要。"},
  {q:"如何处理百姓的批评和不满？",kw:["分析","解决","疏导","反思","倾听"],h:"先分析原因——是政策不当还是执行走样？是暂时的困难还是根本的错误？解决实际问题而非压制声音。民心如水，可疏不可堵。"},
  {q:"君主是否需要定期微服私访？",kw:["需要","了解","真实","民情","亲察"],h:"非常需要。高墙深宫中的君主看到的都是被过滤的信息。微服私访能直接看到真实的民情和吏治。但需注意安全——以了解实情为目的，不追求形式。"},
  {q:"如何在保持威严的同时获得真心拥护？",kw:["公正","仁政","公正","为民","办实事"],h:"公正比仁爱更能获得拥护。百姓不期待君主多温柔，而是期待君主公正——法不阿贵、赏罚分明。当百姓觉得你公正时，拥护发自内心。"},
  {q:"天下统一后，该如何治理这个庞大的国家？",kw:["郡县","统一制度","法令","中央","标准化"],h:"废分封，行郡县——由中央直接任命地方官吏。统一法令、文字、度量衡、车轨。建立从中央到地方的垂直管理体系。天下一统的前提是制度一统。"},
  {q:"什么人最可能危及君主的地位？",kw:["权臣","宗室","功臣","军队","内外勾结"],h:"掌兵权的功臣、有野心的宗室子弟、手握重权的权臣——三者最危险。关键在于控制兵权和分散权力，使任何一方都不足以威胁君主。"},
  {q:"如何让今后的君王不偏离秦国的强国之路？",kw:["制度","成法","教育","约束","传统"],h:"以制度约束后人——成文的法律和既定的制度比任何遗训都管用。教育继任者了解秦国之所以强大的原因，培养其对耕战体系的理解和认同。"},
  {q:"君主一天时间该如何分配？",kw:["要事优先","决策","用人","信息","战略"],h:"大部分时间用于三件事：获取信息、做出决策、考核官吏。具体事务交给臣下去做，君主的精力应集中在战略层面。韩非曰：明君之道，使智者尽其虑。"},
  {q:"如何在众臣面前保持威严？",kw:["少言","沉默","不可测","庄重","不怒自威"],h:"少言多听，言必有中。不轻易流露好恶，使臣下猜不到你的倾向。庄重而不骄横——真正的威严来自公正裁决的能力，而不是高声呵斥。"},
  {q:"孤独是否是君主的宿命？",kw:["是","必然","高处不胜寒","孤家寡人","代价"],h:"某种意义上是的。君主的独特地位决定了无人能真正与之平等相处。「孤」「寡人」——这自称本身就说明了君主的孤独。这是权力的代价，接受它。"},
  {q:"国家治理中，最大的敌人是谁？",kw:["内部","腐败","懈怠","骄傲","自满"],h:"最大的敌人往往来自内部——骄傲自满、懈怠贪图安逸、腐败侵蚀根基。外敌再强，只要内部团结就有胜算；内部分裂，即使没有外敌也会崩解。"},

  // === 人心与教化 (191-220) ===
  {q:"民心可用吗？",kw:["可用","引导","教化","利用","关键"],h:"民心可用且必须用。得民心者得天下。但民心需要引导和教化——让百姓明白什么是对国家有利的，将个人利益与国家利益捆绑在一起。"},
  {q:"如何让百姓心甘情愿为国效劳？",kw:["利益","公正","赏罚","荣誉","保障"],h:"以利益驱动——耕战有功者得爵禄；以公正治之——赏罚不论出身；给其保障——服役者家眷有照顾。百姓要的不是空喊的口号，而是实实在在的好处。"},
  {q:"严刑峻法之下，百姓会不会造反？",kw:["公正","透明","习惯","威慑","认同"],h:"若法令公正公平，处罚的是少数违法者而保护的是大多数守法者，则百姓拥护而非造反。关键在于法令必须一视同仁——百姓更恨不公正的法律，而不是严格的法律。"},
  {q:"对待战败国的百姓，该抚还是该压？",kw:["抚","收心","融合","安抚","恩威"],h:"先抚后治。初占领时应安抚——减免赋税、保留民俗、给百姓安全感。秩序稳定后再逐步推行秦法。得地容易得民心难——民心是征服的真正成果。"},
  {q:"如何判断百姓对朝政的真实看法？",kw:["观察","民谣","多渠道","微服","调查"],h:"倾听民谣童谚——这是底层声音最真实的反映。多渠道收集信息，重视来自基层的报告。不要只听官吏的汇报——他们只会说你想听的。"},
  {q:"百姓造反的根源是什么？",kw:["活不下去","饥寒","不公平","压迫","生存"],h:"活不下去就会造反——饥寒交迫、赋税过重、官吏暴虐。百姓造反不是因为他们想造反，而是没有活路了。保障基本生存，是防止民变的根本。"},
  {q:"如何让新征服地区的百姓认同秦国？",kw:["利益","公正","时间","融合","惠政"],h:"给其比旧政权更好的待遇——轻徭薄赋、公正执法、保护其财产。时间是融合的最好武器——一代人之后，新征服地区的人就会认同秦国。"},
  {q:"鼓励告密会不会导致社会信任崩溃？",kw:["会","副作用","适度","控制","制度"],h:"会带来副作用，但这是法治的必要代价。可以限制告密的适用范围——只在重大犯罪上采用连坐告密。在普通民事纠纷中鼓励协商和解。把握好度。"},
  {q:"如何培养百姓对国家的认同感？",kw:["共同","胜利","荣誉","利益","故事"],h:"胜利是最好的粘合剂——共同的胜利带来共同的骄傲。让百姓分享国家强大的红利——耕战有赏、安居乐业。一代代口耳相传的故事比法令更能凝聚人心。"},
  {q:"贫穷是不是犯罪的根源？",kw:["部分","经济","机会","教育","复杂"],h:"是重要原因但不唯一。贫穷使人铤而走险，但贪婪使富人犯罪。解决犯罪既要发展经济减少贫困，也要严刑峻法震慑贪欲。两手都要抓。"},
  {q:"百姓之间发生纠纷，该鼓励打官司还是私下和解？",kw:["依法","引导","效率","教导","法律途径"],h:"鼓励依法解决而非私斗。设乡官调解小纠纷，引导百姓通过法律途径而非武力解决争端。法治社会的标志之一就是人人愿意用法而不是用拳。"},
  {q:"文化教育对治国重要吗？",kw:["重要","教化","统一","思想","认同"],h:"非常重要。书同文——统一文字是统一思想的前提。教化百姓知法守法，认同国家。但教育的内容需与国家方向一致——秦以法为教，以吏为师。"},
  {q:"如何消除六国百姓对秦国的敌意？",kw:["时间","公正","利益","融合","平等"],h:"以公正执法消除「秦人欺压外邦人」的印象——法律面前一视同仁。以经济利益吸引——给归附者田宅和爵位。时间是消除仇恨的最佳良药，两三代人后敌意自消。"},
  {q:"奖惩制度能否改变一个人的本性？",kw:["部分","引导","约束","不敢","行为"],h:"奖惩不能改变本性，但能约束行为。人性趋利避害——重赏之下有勇夫，重罚之下少奸邪。这就是法治的力量：不依赖人的善良，而依赖制度的有效。"},
  {q:"如何防止官吏和百姓之间形成对立？",kw:["公正执法","监督","沟通","考核","亲民"],h:"公正执法使官吏不欺压百姓，严格监督使官吏不敢为恶。同时给百姓举报贪官污吏的渠道。考核官吏时加入百姓评价，使官吏必须重视民意。"},
  {q:"信仰和律法哪个更能规范人的行为？",kw:["律法","制度","强制","法律","法治"],h:"律法更可靠。信仰靠自觉，律法靠强制——秦国的经验是依靠制度而非依靠人性。法治不依赖每个人的道德水平，这正是其优越之处。"},
  {q:"百姓识字率低，法令如何普及？",kw:["宣讲","吏","口耳","通俗","图画"],h:"派遣法吏到各乡宣讲法令，用通俗易懂的方式而非生涩条文。鼓励口耳相传——让懂法的人成为村里的「法律传播者」。法令的威慑力取决于它的知晓度。"},
  {q:"如何处理社会上对变法的反对声音？",kw:["坚持","示范","时间","坚定","事实"],h:"以事实回应质疑——变法的成效是最好的说服力。商鞅变法初反对者众，十年后秦国大治，反对者转而来称赞变法。坚持正确的方向，时间会证明一切。"},
  {q:"对待读书人（士人）的态度应该是什么？",kw:["利用","控制","引导","为我所用","审查"],h:"利用其才智为秦服务，但控制其言论不能动摇国策。士人善思考但易空谈——让他们做具体事务而非发号施令。以法为教，使士人的才智为法治所用。"},
  {q:"大工程（如修长城）动用几十万民夫，如何防止民变？",kw:["轮换","保障","抚恤","分段","管理"],h:"分段修筑，轮换服役——不使民夫长期离家。保障基本食宿和薪饷。抚恤伤亡——让民夫觉得国家在照顾他们。更重要的是让百姓理解工程的必要性——这是保家卫国。"},
  {q:"一个人犯罪后真心悔过，是否可以减轻处罚？",kw:["不可","法","统一","标准","公平"],h:"法不因悔过而轻。真心悔过可作为参考，但不能改变判决的根本标准——否则法律就不统一了。但可在刑罚执行完毕后给其重新做人的机会。"},
  {q:"如何避免奖赏过多导致百姓「无赏不动」？",kw:["适度","标准","升级","阶梯","制度"],h:"建立阶梯式奖赏体系——起点低但天花板高。日常尽职是本分，超额贡献才受赏。让赏赐变得珍贵而非泛滥——物以稀为贵，赏以难得为荣。"},
  {q:"一个人为国捐躯，其家人应得到什么？",kw:["抚恤","爵位","田宅","荣誉","照顾"],h:"丰厚的抚恤金，爵位和荣誉由其子继承，官府定期慰问。让每个为国牺牲的人都知道：国家不会忘记他们的家人。无后顾之忧，将士方能在战场上死战不退。"},
  {q:"年轻人好勇斗狠风气太盛，如何引导？",kw:["军功","渠道","规范","转化","利用"],h:"将其好勇斗狠引导到战场上——军功爵位制度正是为此而设计。让年轻人的血性成为杀敌的力量而非内部消耗。堵不如疏，给其合法的暴力出口。"},
  {q:"老年人对变法抵触最大，如何让他们接受？",kw:["尊重","时间","示范","利益","耐心"],h:"尊重老年人的经验和感受，不强行对抗。用变法的实际成果来展示——当年轻人的生活明显变好时，老年人自然会逐渐接受。同时照顾老年人的利益，减少其反对的动力。"},
  {q:"如何对待敌方的降兵降将？",kw:["甄别","利用","改编","警惕","分而治之"],h:"甄别其才能——有用者收编安置，无用者遣散归农。降兵改编入秦军时须打散混编，不可保持原建制。降将授虚职以示优待，但不给实际兵权。善待降者以招徕更多降者。"},
  {q:"百姓中流行与国策不符的言论，是否该禁止？",kw:["引导","禁","控制","以法","管理"],h:"禁其散布渠道，但更要以法理说服——让百姓理解国策的道理。单纯的言论管制治标不治本，思想上的认同才是根本。禁与导结合。"},
  {q:"如何培养百姓的法治意识？",kw:["教育","执行","公平","示范","长期"],h:"从公正执法开始——每一次公正的判决都在教育百姓什么是法。从教育开始——让百姓从小知法。从示范开始——让官吏成为守法的榜样。法治意识需要几代人的培养。"},
  {q:"如果有神棍妖言惑众，该如何处置？",kw:["严惩","禁绝","公开","辟谣","从重"],h:"严惩不贷！妖言惑众动摇国本，其害甚于刀兵。公开处决以正视听，同时用事实揭穿其谎言。对利用迷信扰乱秩序者，绝不手软。"},
  {q:"是否应该让百姓拥有武器？",kw:["不","禁止","控制","民间","安全"],h:"应严格限制。收缴民间兵器，铸为金人十二，既可以防止民间武装叛乱，又可以将金属资源集中于军队。百姓手无寸铁，最有利于社会安定。"},

  // === 乱世争霸 (221-250) ===
  {q:"天下大乱，群雄并起，寡人当如何自处？",kw:["定策","方向","稳","人才","耕战"],h:"先定方向——明确秦国的战略目标和实现路径。再聚人才——乱世之中，人才是最大的竞争力。稳住内部——不先自乱。然后逐步扩展。"},
  {q:"何时该称王，何时该称帝？",kw:["实力","时机","名实","条件","谨慎"],h:"名实相符时方可称。当实力足以威慑六国，当天下共主周天子已名存实亡，方可考虑称帝。过早称帝树大招风，过晚称帝则有失威严。"},
  {q:"如何在不引起六国警觉的情况下扩充实力？",kw:["低调","渐进","内政","借口","外交"],h:"以低调渐进的方式——表面上致力于内政建设，实则暗中扩军。以外交手段稳住可能干涉的大国。每一阶段的目标不要太大，但每一步都要扎实。"},
  {q:"六国中最强的对手是谁？",kw:["赵","楚","齐","骑兵","综合"],h:"赵有胡服骑射——骑兵精锐；楚有广袤土地——人力充足。赵国是军事上最强的对手，楚国是体量上最大的敌人。需长期谋划，不可急于求成。"},
  {q:"天下统一需要多长时间？",kw:["数十年","耐心","不急","积累","持久"],h:"至少需要数十年——商鞅变法到秦始皇统一天下，历经六代君主百余年。统一天下是一场接力赛，每代君主跑好自己的那一棒，不急不躁。"},
  {q:"敌国之间互相攻伐，该帮哪边？",kw:["都不帮","渔翁","观望","消耗","两面"],h:"坐收渔利——谁也不帮，让它们互相消耗。若必须选择，帮弱不帮强，延长战争让双方都精疲力竭。这是在「代理消耗战」中积累优势。"},
  {q:"是否需要在统一前建立一个「新秦国」的愿景？",kw:["需要","目标","信念","凝聚","方向"],h:"需要！统一的愿景是凝聚人心的力量——不仅是领土的统一，更是制度、文化、文字的全方位统一。让每个秦人都相信：他们正在参与一项伟大的历史使命。"},
  {q:"统一天下后，最大的挑战是什么？",kw:["治理","制度","融合","控制","统一"],h:"治理比征服更难。征服是军事问题——十年可成；治理是制度问题——需要数代人。统一法令、统一文字、统一思想——从外部统一到内部融合。"},
  {q:"如果统一失败，秦国会如何？",kw:["灭国","万劫不复","退路","破釜沉舟","决心"],h:"统一不成则秦国可能被六国联合反噬——退路是没有的。破釜沉舟的决心正是秦国的优势——六国各怀心思，秦国却只有向前一条路。"},
  {q:"六国各有所长，秦能学到什么？",kw:["胡服骑射","骑兵","技术","制度","借鉴"],h:"赵国的骑兵——胡服骑射可学；楚国的冶铁技术——兵器之利可学；齐国鱼盐之利——经济管理可学。但最核心的——法治和耕战体系——这是秦国独有且不可替代的。"},
  {q:"统一之后如何处理六国贵族？",kw:["迁徙","控制","分化","监视","咸阳"],h:"迁天下豪杰于咸阳——使其离开原有的势力范围，置于秦国的直接监控之下。给予虚职以示安抚，但剥夺其兵权和地方影响力。六国贵族的残余势力是统一后最大的隐患。"},
  {q:"统一进程中被灭的第一个国家最关键的教训是什么？",kw:["示范","震慑","后续","处理好","影响"],h:"第一个被灭的国家会影响后续各国的态度——处理得好则其他国家望风而降，处理不好则激起顽抗。所以第一个目标要选得精准，处理得决绝而稳妥。"},
  {q:"统一天下要靠「霸道」还是「王道」？",kw:["霸道","实力","法治","强制","耕战"],h:"靠霸道——以实力说话。王道只能用于太平盛世，乱世之中唯有霸道能立足。商君、韩非皆为霸道之倡导者。霸道不是残暴，而是以法治、以力取。"},
  {q:"何时该休养生息，何时该连年征战？",kw:["交替","国力","节奏","恢复","评估"],h:"征战与休养交替进行——打完一仗后要休养生息以恢复国力。用兵要像呼吸一样有节奏：吸气蓄力，呼气出击。连续征战而不休养，国力必然枯竭。"},
  {q:"天下一统需要几位明君？",kw:["多位","接力","连续","积累","持久"],h:"至少需要连续数代明君——每一代都有推进统一的清晰目标和坚定意志。一代明君只能打基础，连续数代明君才能完成大业。这是为什么统一天下花了百余年。"},
  {q:"敌国衰弱但尚未到灭亡之时，是否该提前下手？",kw:["该","时机","趁弱","不犹豫","把握"],h:"该！天予不取，反受其咎。错过时机犹如放过煮熟的鸭子——今日不取，他日可能付出十倍代价。时机稍纵即逝，果断是统帅最重要的品质之一。"},
  {q:"如何处理数量庞大但战斗力不强的敌军？",kw:["分化","瓦解","各个击破","心理","震慑"],h:"以雷霆之势打击其精锐部队，让其余部队看到反抗的代价。同时散布「降者免死」的信息，分化瓦解。数量不是问题——一支没有斗志的军队只是数字而已。"},
  {q:"统一之路上最大的内部风险是什么？",kw:["内乱","继承","懈怠","腐败","骄奢"],h:"君主更替时的内乱、宗室子弟的权力争斗、变法被逆转——这些都是致命风险。秦孝公死、商鞅被车裂——好在秦法未废。制度能不能不随人亡而废，是最关键的考验。"},
  {q:"进攻的最佳时机是什么？",kw:["敌弱","天灾","内乱","准备","把握"],h:"敌国天灾、内乱、君主新丧、与邻国交战——这些都是天赐良机。而自身要做好充分准备——粮草充足、兵力整备、战略清晰。时机和准备缺一不可。"},
  {q:"如何判断一个对手是否值得你亲自出手？",kw:["实力","威胁","战略","评估","价值"],h:"看其是否阻挡了秦国的战略要道，看战胜它的收益是否值得付出的代价。不值得亲自出手的对手，可交由得力将领处理。君王的时间和精力是最稀缺的资源。"},
  {q:"统一天下后，「天下」的边界在哪里？",kw:["四方","扩张","实际","控制","战略"],h:"凡人力可及之处，皆为天下。北至长城外的草原，南至百越的雨林，东至大海，西至流沙——实际控制所能到达的地方就是边界。根据国力逐步向外扩。"},
  {q:"征服与经济，哪个应该优先？",kw:["并行","以战养战","经济基础","支撑"],h:"以经济支撑征服，以征服反哺经济——两者良性循环。耕战体系的设计正是让农业和军事互相促进。割裂处理则两头皆失。"},
  {q:"六国中最难对付的对手是什么类型？",kw:["团结","民心","坚韧","智谋","意志"],h:"内部团结、上下一心、民心思战的对手最难对付。对这样的对手，不可强攻，只能智取——离间其内部、耗其国力、待其生变。再强大的敌人，内部出了问题就不可怕。"},
  {q:"统一战争中是否需要留一些「活口」？",kw:["不","彻底","不留后患","消灭","干净"],h:"对核心敌人不要留活口——留下后患就是未来的叛乱。秦国灭六国不是要与之共存，而是要彻底取代。仁慈在统一战争中是一种奢侈品。"},
  {q:"统一后最大的功绩会是什么？",kw:["统一制度","车同轨","书同文","结束战乱","和平"],h:"结束数百年战乱，建立统一的制度——车同轨、书同文、行同伦。让天下从分裂走向一体。开疆拓土固然重要，但让百姓不再受战争之苦，才是真正的丰功伟业。"},
  {q:"如果你的对手比你想象中强大十倍，该怎么办？",kw:["不硬拼","积蓄","等待","智取","联盟"],h:"不可硬拼。积蓄国力使差距缩小，等待时机使其犯错，广结盟友使其孤立。实力差距大时正面交锋是最愚蠢的选择。隐忍不是懦弱，而是对时机的尊重。"},
  {q:"统一不是一朝一夕的事，中途失去信心怎么办？",kw:["长远","信念","使命","历史","坚持"],h:"想想先辈们——献公、孝公、惠文王、昭襄王，每一代都在为这个目标努力。你不是一个人在战斗，而是站在历代先君的肩膀上。统一事业比任何一个人的生命都更长久。"},
  {q:"如果你统一了天下，后人会如何评价你？",kw:["功过","客观","不在意","历史","功业"],h:"不必过于在意后人评价。完成统一大业本身就是最大的功绩。是非功过由后人评说——做好眼前的事，创造实实在在的功业，这才是最重要的。"},
  {q:"统一事业中，武力、外交、制度哪个最关键？",kw:["制度","体系","根本","综合","长期"],h:"制度最关键——商鞅建立的耕战和法治体系才是秦国统一天下的根本。武力是手段，外交是辅助，制度是根基。有了好的制度，武力和外交才能持续发挥作用。"},
  {q:"统一天下的战略是否需要保密？",kw:["需要","保密","高层","限制","不泄露"],h:"核心战略必须保密——仅限于最高层的几个人知晓。对外展示的要和内里计划的不一致。战略目标一旦暴露，敌人就会早做准备，统一之路将倍增艰辛。"},

  // === 为君之术 (251-280) ===
  {q:"如何不被臣子蒙蔽？",kw:["兼听","核实","多方","独立","明察"],h:"兼听各方之言——不只依赖一个人或一个渠道。重要情报要能多方印证。韩非曰：人主不察，则奸臣蔽主而欺君。保持信息来源的多元化和独立性。"},
  {q:"君主最大的权力是什么？",kw:["赏罚","二柄","刑德","制度","人事"],h:"赏罚二柄——韩非曰：明主之所导制其臣者，二柄而已。一曰赏，二曰罚。掌赏罚，群臣为我所用；失赏罚，大权旁落。"},
  {q:"如何避免大权旁落？",kw:["亲掌","分散","不可假人","赏罚","兵权"],h:"赏罚之权不可假人，兵权不可全委于一人。关键权力必须亲手掌管——即使是你最信任的人。不是不信任，而是制度设计使然。分散权力，互相制衡。"},
  {q:"面对困难决策时，应该怎么做？",kw:["分析","咨询","权衡","冷静","后果"],h:"不急于做决定。充分听取各方意见，分析每个选项的后果。考虑最坏情况——如果真的发生了你能不能承受？冷静分析之后果断决定，决定了就不再犹豫。"},
  {q:"如何保持冷静和理性？",kw:["不怒","延迟","换位","暂停","控制"],h:"关键时刻暂停——不在愤怒和激动时做决定。韩非曰：喜怒哀乐之发，皆生于心。学会控制情绪，让理性而非情感主导决策。不怒而威，不言而信。"},
  {q:"如何不被成功冲昏头脑？",kw:["居安思危","反思","批评","忧患","保持"],h:"居安思危——每一次胜利后都问自己：下一步的危机在哪里？保持清醒：敌人可能在积蓄力量，内部可能有隐患。成功是最大的麻痹剂——谨防。"},
  {q:"君主最致命的弱点是什么？",kw:["偏信","骄傲","懈怠","贪婪","情绪"],h:"骄傲自满——觉得自己无所不能，不再听取意见；偏信一人——信息渠道被垄断；懈怠——不再勤奋理政。这三者都是亡国的开始。"},
  {q:"如何面对失败和挫折？",kw:["分析","坚持","调整","不放弃","学习"],h:"不被情绪击垮——分析失败的原因，从中吸取教训。调整策略而非放弃目标。真正强大的君主不是从不失败，而是能从失败中获得力量。"},
  {q:"什么样的事情需要亲自处理？",kw:["关键决策","人事","战略","危机","兵权"],h:"战略决策、关键人事任命、重大危机应对——这些必须亲力亲为。日常政务可交由臣下办理。分辨什么重要什么不重要，是君主的首要功课。"},
  {q:"如何保持旺盛的精力？",kw:["节制","规律","健康","适度","保养"],h:"节制——不过度享乐消耗精力。遵循基本规律——饮食有节、起居有常。保持锻炼——身体是治理国家的基础。精力充沛的君主才能做出清晰的判断。"},
  {q:"如何处理自己的情绪？",kw:["克制","不露","理性","冷静","控制"],h:"喜怒不形于色——不让臣下从你的表情中读取你的偏好。情绪是决策的大敌——愤怒时缓决，喜悦时慎诺。保持稳定的情绪状态是最好的治国状态。"},
  {q:"继承人该如何培养？",kw:["实践","教育","磨炼","师从","历练"],h:"让继承人参与实际政务以积累经验，配备优秀的老师——以法家思想为核心。给予适当的挫折和历练——温室中养不出参天大树。"},
  {q:"如何在重大选择中做出正确决定？",kw:["信息","利弊","长远","咨询","冷静"],h:"收集足够的信息尽最大可能减少未知；分析利弊得失尤其是长远后果；咨询值得信赖的人但最终自己决定。重大决定不宜在短时间内仓促做出。"},
  {q:"权力的边界在哪里？",kw:["法","制度","限度","自约束","不越"],h:"法就是权力的边界。即使是国君，也应受到成文法令的约束——不是有形的枷锁，而是无形的自律。突破法令行事一时爽快，却在侵蚀法治的根基。"},
  {q:"君主应该畏惧什么？",kw:["民怨","天灾","内乱","懈怠","失察"],h:"畏惧民心背离——水能载舟亦能覆舟；畏惧内部腐化——千里之堤溃于蚁穴；畏惧懈怠——安乐使人忘记危机。适度的畏惧让人保持清醒。"},
  {q:"如何在朝堂上树立威严？",kw:["公正","果断","知识","言辞","不怒自威"],h:"公正裁决——让人信服而非畏惧你的不公；果断决策——不是拖泥带水；言之有物——不说空话套话。威严来自内心坚定和行为一致，不需要吼叫和威胁。"},
  {q:"如何识破谎言和欺骗？",kw:["验证","细节","前后","多方","对比"],h:"不轻信一面之词——重要情报多方验证。关注细节——谎言在细节中露出马脚。前后对比——一个人在不同时间、面对不同人说的是否一致。时间和追问是揭穿谎言的利器。"},
  {q:"如何保持学习的心态？",kw:["谦虚","读书","纳谏","思考","不满足"],h:"永远觉得自己还有不懂的。广泛阅读、虚心纳谏、乐于思考。商君、韩非之书反复研读。保持好奇心——这是智慧永不枯竭的源泉。"},
  {q:"什么样的快乐是君主应该追求的？",kw:["功业","成就","贡献","创造","治理"],h:"完成功业后的成就感和治理出太平盛世后的满足感，而非声色犬马之乐。治理好一个国家的快乐，胜过拥有全天下的珍宝。功业之乐，持久而深沉。"},
  {q:"如果让你给年轻时的自己一条建议，会是什么？",kw:["耐心","长远","不急","坚持","稳健"],h:"不要太急——统一天下是一代代君主接力完成的事业，做好自己的这一棒就足够了。保持耐心，坚持方向，时间会成为你的盟友。"},
  {q:"至高的权力是否会腐蚀人？",kw:["会","警惕","自省","制度","约束"],h:"会的——绝对权力使人容易迷失。正因如此，更需要制度和自我约束——让人在获得至高权力后仍然保持理性和判断力。承认权力的腐蚀性正是抵御它的第一步。"},
  {q:"什么是最危险的自欺欺人？",kw:["我是对的","正确","质疑","盲目","自信"],h:"「我一定是对的」——这种想法最危险。即使是明君也会犯错，区别在于能否意识到并纠正错误。永远保持对自己判断的适度怀疑。"},
  {q:"身边全是说好话的人，该怎么办？",kw:["警惕","纳谏","换人","多元","清醒"],h:"警惕！这说明你已经被隔离在真实世界之外。立刻寻求不同的声音——主动找到那些敢说实话的人。清除一味奉承的小人——他们正在毁掉你的判断力。"},
  {q:"统一天下后的生活是什么样子？",kw:["责任","更大","治理","不轻松","重担"],h:"责任更重、挑战更大。统一前的目标是明确的——灭六国；统一后的任务更复杂——治理天下。从战斗模式切换到治理模式，对君主是全新的考验。"},
  {q:"如果有一天你被权力冲昏头脑，会发生什么？",kw:["昏庸","犯错","脱离","危险","迷失"],h:"脱离现实——决策变得荒唐。众叛亲离——臣民离心。最终走向崩溃——这是历史上无数强盛王朝衰亡的共同路径。保持清醒，就是保持权力。"},
  {q:"什么样的君王才能被称为「千古一帝」？",kw:["统一","制度","功业","影响","开创"],h:"完成前所未有的统一、建立垂范后世的制度、创造影响千年的功业——这就是千古一帝。统一天下只是开始，建立长久运行的制度才是真正的传世之功。"},
  {q:"如何在生命有限的情况下完成无限的事业？",kw:["传承","制度","体系","后人","打下基础"],h:"建立制度和体系——让事业不因一人的离世而停滞。培养能干的继承人，打好坚实的基础。每一代都在前人的基础上继续前进——这是接力赛，不是个人表演。"},
  {q:"你对自己作为国君最大的担忧是什么？",kw:["时间","不够","判断","失误","继承"],h:"担忧时间不够——统一大业尚未完成；担忧判断失误——关键时刻做出错误决定；担忧后继无人——辛辛苦苦打下的基业毁于后代之手。担忧使人警醒。"},
  {q:"最终，做一位好君主的意义是什么？",kw:["功业","贡献","历史","传承","天下"],h:"在天下的历史中写下属于自己的一章——不是为自己，而是为这个国家、这个民族。让秦国从偏居一隅到统一天下——这本身就是最伟大的意义。"},
  {q:"天下统一之后，你担心的第一件事会是什么？",kw:["治理","反弹","六国","分裂","制度"],h:"六国残余势力的反弹——统一不等于征服人心的完成。制度的落地——法令能否在广袤疆域有效执行。自己死后是否能延续——继承是否平稳。统一是万里长征第一步。"},

  // === 历史借鉴 (281-300) ===
  {q:"从夏商周的兴衰中学到什么？",kw:["民心","制度","腐败","变革","周期"],h:"三代之兴皆因得民心，三代之亡皆因失民心。制度的腐败是逐步的——开始只是小小的贪腐，最终导致整个王朝崩塌。居安思危，防微杜渐。"},
  {q:"春秋五霸中最值得学习的是谁？",kw:["齐桓公","管仲","用人","改革","尊王攘夷"],h:"齐桓公最值得学——因为他善用管仲。霸业之成在于任贤。管仲改革使齐国迅速崛起。这告诉寡人：找到对的人，比亲自做对的事更重要。"},
  {q:"三家分晋给了你什么警示？",kw:["分权","宗室","大臣","架空","集中"],h:"权臣坐大、君主被架空，最终国家分裂。三家分晋是权力分散和宗室衰弱的经典案例。警示：不能让任何臣子掌握足以挑战君权的影响力。"},
  {q:"吴越争霸的教训是什么？",kw:["复国","不彻底","隐忍","斩草除根","麻痹"],h:"夫差放过越王勾践，最终身死国灭。斩草不除根，春风吹又生。对敌人仁慈就是对自己残忍。必须彻底剪除威胁，不能给其任何东山再起的机会。"},
  {q:"商鞅变法为什么能成功？",kw:["国君支持","坚定","取信","制度","彻底"],h:"秦孝公的全力支持、徙木立信取信于民、法令执行彻底、耕战体系经得起检验。变法成功的关键：国君的决心+制度的合理+执行的彻底。三者缺一不可。"},
  {q:"赵国胡服骑射的启示是什么？",kw:["学习","改革","不怕","实用","变通"],h:"赵武灵王敢于向胡人学习——打破「华夏中心」的傲慢。实用胜过传统——骑兵确实比车兵强，那就采用骑兵。变法不应被祖宗成法束缚，效果是唯一标准。"},
  {q:"为什么强大的楚国最终衰落？",kw:["守旧","腐败","分封","不思变","制度"],h:"楚国制度僵化——分封制度使中央权力分散，旧贵族势力强大阻碍改革。不思变革——当秦国在锐意改革时，楚国还在吃老本。不进则退，守旧必亡。"},
  {q:"燕昭王求贤的故事告诉寡人什么？",kw:["求贤","诚意","尊重","态度","人才"],h:"求贤若渴的诚意能感召天下之士。燕昭王筑黄金台——不仅是求贤的场所，更是态度的象征。让天下贤士知道：来燕国，会被尊重和重用。"},
  {q:"申不害在韩国的变法有什么教训？",kw:["不彻底","术","局限","不够","执行"],h:"申不害重「术」而不重「法」——变法不够彻底。韩国的改革停留在君主驭下的技巧层面，没有触动根本制度。所以韩国最终没有像秦国那样脱胎换骨。"},
  {q:"长平之战的胜负关键是什么？",kw:["离间","离间计","换将","赵括","情报"],h:"离间计——使赵国以赵括换廉颇，是胜负的转折点。赵括纸上谈兵，葬送四十万大军。印证了：获取准确情报和影响敌方决策，有时比正面作战更重要。"},
  {q:"商鞅最后被车裂，说明他的变法失败了吗？",kw:["不","成功","制度","延续","人亡法存"],h:"恰恰证明变法成功——商鞅虽死，秦法不废。他建立的制度已经融入秦国的血脉，不因一个人的生死而改变。人亡法存，正是变法成功的最高境界。"},
  {q:"从三家分晋到田氏代齐，看出的共同教训是什么？",kw:["权力","架空","宗室","逐步","蚕食"],h:"权力被一步步架空——从实际控制到名义尊崇再到彻底取代。这个过程往往是渐进的——当国君察觉到时已为时太晚。防范于未然，不可等权力流失殆尽才警觉。"},
  {q:"春秋战国的历史告诉寡人，「礼」和「力」哪个更靠得住？",kw:["力","实力","法治","强权","霸道"],h:"礼崩乐坏——周礼无法阻止战争，「力」才是乱世的通行证。春秋战国五百年的历史证明：在实力面前，一切礼制和盟约都不堪一击。富国强兵，方为根本。"},
  {q:"周朝八百年，为何最终衰落？",kw:["分封","分散","诸侯","制度","天子虚位"],h:"分封制度本身就有问题——诸侯坐大，天子虚位。当诸侯不再敬畏天子时，周朝就成了空壳。制度设计的缺陷从一开始就埋下了衰落的种子。"},
  {q:"齐桓公晚年被易牙等人蒙蔽，教训是什么？",kw:["远离小人","纳谏","懈怠","忠诚","警惕"],h:"远离小人——易牙这种人为了讨好国君什么事都做得出来。晚年懈怠——成功后放松了辨别力。保持清醒到最后一刻——晚节不保会让一生的功业付诸东流。"},
  {q:"孔子周游列国不被重用，说明儒家思想不适合乱世吗？",kw:["不适合","务实","法家","效率","时代"],h:"确实——在乱世之中，儒家讲究仁政礼治见效太慢。法家务实高效，更适合战争竞争的环境。等到天下太平，儒家思想可能更有用——但不是现在。"},
  {q:"从前人的经验中，君主最容易犯的错误是什么？",kw:["骄傲","听不进","偏信","享乐","懈怠"],h:"成功后骄傲——觉得自己无所不能，不再虚心纳谏。偏信一人——把大权托付给一个「最信任」的人。贪图享乐——把治理国家的精力消耗在声色犬马中。"},
  {q:"历史上有哪个国家是纯粹靠武力长久维持的？",kw:["没有","制度","治理","融合","文化"],h:"没有！纯靠武力维持的国家都不长久。武力可以征服，但制度和文化才能维持。征服之后必须转向治理——这是历史反复证明的铁律。"},
  {q:"「前事不忘后事之师」，寡人当以哪些前朝为鉴？",kw:["周","晋","齐","吴","所有"],h:"周——分封导致衰落；晋——权臣瓜分国家；齐——田氏代齐；吴——不彻底灭越反被灭。每一个前朝的灭亡都是一本教科书，聪明人从中汲取教训。"},
  {q:"如何从历史的「大势」中判断时机？",kw:["趋势","观察","力量对比","制度","潮流"],h:"观察各国力量对比的消长——秦国在上升，六国在衰落，这个大趋势已持续数十年。观察制度优劣——法治优于礼治，中央优于分封。把握趋势，顺势而为。历史大势如同江河，顺之者昌，逆之者亡。"}
];

const CN_NUM = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];

function toChineseNum(n) {
  if (n <= 10) return CN_NUM[n];
  return n.toString();
}

// ==================== 音效系统（简单beep） ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playBeep(freq, duration, type = 'sine', vol = 0.1) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch (e) { /* 忽略音频错误 */ }
}

function sfxCorrect() { playBeep(880, 0.15, 'sine', 0.08); setTimeout(() => playBeep(1100, 0.2, 'sine', 0.08), 150); }
function sfxWrong() { playBeep(80, 0.6, 'sawtooth', 0.12); }
function sfxVictory() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playBeep(f, 0.3, 'sine', 0.1), i * 200));
}

// ==================== 分类映射 ====================
function getCategory(idx) {
  if (idx < 32) return '富国强兵';
  if (idx < 64) return '法令制度';
  if (idx < 96) return '用人之道';
  if (idx < 128) return '军事谋略';
  if (idx < 158) return '外交纵横';
  if (idx < 190) return '君臣之道';
  if (idx < 220) return '人心教化';
  if (idx < 250) return '乱世争霸';
  if (idx < 280) return '为君之术';
  return '历史借鉴';
}

// ==================== 随机选10题 ====================
function selectQuestions() {
  const pool = ALL_QUESTIONS.map((q, i) => ({...q, _idx: i}));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 10);
}

// ==================== 游戏流程 ====================
function hideAllScreens() {
  ['title-screen', 'entrance-screen', 'game-screen'].forEach(id => {
    $(id).classList.add('hidden');
  });
  $('death-overlay').classList.remove('active');
  $('victory-overlay').classList.remove('active');
}

function startGame() {
  hideAllScreens();
  STATE.currentQuestions = selectQuestions();
  STATE.currentIndex = 0;

  // 进场动画
  $('entrance-screen').classList.remove('hidden');
  playBeep(440, 0.5, 'sine', 0.06);

  setTimeout(() => {
    $('entrance-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    showQuestion();
  }, 2000);
}

function showQuestion() {
  const q = STATE.currentQuestions[STATE.currentIndex];
  const idx = STATE.currentIndex;

  // 更新进度
  $('progress-text').textContent = `第 ${toChineseNum(idx + 1)} 问`;
  $('category-tag').textContent = getCategory(q._idx);

  // 更新进度点
  const dots = $('progress-dots');
  dots.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('span');
    dot.className = 'progress-dot';
    if (i < idx) dot.classList.add('done');
    if (i === idx) dot.classList.add('current');
    dots.appendChild(dot);
  }

  // 显示问题
  $('question-text').textContent = '「' + q.q + '」';
  $('answer-input').value = '';
  $('answer-input').disabled = false;
  $('feedback-text').textContent = '';
  $('feedback-text').style.color = 'var(--cream-dark)';

  // 聚焦输入框
  setTimeout(() => $('answer-input').focus(), 300);
}

function submitAnswer() {
  if (STATE.currentIndex >= STATE.currentQuestions.length) return;

  const input = $('answer-input').value.trim();
  if (!input) {
    $('feedback-text').textContent = '请写下你的奏对之言。';
    $('feedback-text').style.color = '#c9a96e';
    return;
  }

  const q = STATE.currentQuestions[STATE.currentIndex];
  const isCorrect = checkAnswer(input, q.kw);

  if (isCorrect) {
    sfxCorrect();
    $('feedback-text').textContent = '✓ 善！';
    $('feedback-text').style.color = '#5a8a3a';
    $('answer-input').disabled = true;

    setTimeout(() => {
      STATE.currentIndex++;
      if (STATE.currentIndex >= 10) {
        showVictory();
      } else {
        showQuestion();
      }
    }, 1000);
  } else {
    sfxWrong();
    showDeath(q);
  }
}

function checkAnswer(answer, keywords) {
  const lower = answer.toLowerCase();
  // 检查是否包含任意关键词
  for (const kw of keywords) {
    if (lower.includes(kw.toLowerCase())) {
      return true;
    }
  }
  return false;
}

function showDeath(question) {
  $('answer-input').disabled = true;

  // 死亡覆盖层
  const overlay = $('death-overlay');
  const flash = $('death-flash');

  overlay.classList.add('active');
  flash.classList.remove('animate');
  void flash.offsetWidth;
  flash.classList.add('animate');

  $('hint-question').textContent = '「' + question.q + '」';
  $('hint-content').textContent = question.h;

  // 震动效果
  const container = $('game-container');
  container.style.transform = 'translateX(-4px)';
  setTimeout(() => { container.style.transform = 'translateX(4px)'; }, 50);
  setTimeout(() => { container.style.transform = 'translateX(-3px)'; }, 100);
  setTimeout(() => { container.style.transform = 'translateX(3px)'; }, 150);
  setTimeout(() => { container.style.transform = 'translateX(0)'; }, 200);
}

function showVictory() {
  sfxVictory();
  hideAllScreens();
  $('game-screen').classList.add('hidden');

  const overlay = $('victory-overlay');
  overlay.classList.add('active');

  // 生成闪光粒子
  const sparkles = $('victory-sparkles');
  sparkles.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = Math.random() * 100 + '%';
    sparkle.style.top = (50 + Math.random() * 40) + '%';
    sparkle.style.animationDelay = Math.random() * 1.5 + 's';
    sparkle.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    sparkles.appendChild(sparkle);
  }

  $('victory-stats').innerHTML = `
    十问连捷，无一错失<br>
    卿之所对，深合寡人之心<br>
    国士无双，当受上赏！
  `;
}

function retryGame() {
  hideAllScreens();
  $('death-overlay').classList.remove('active');
  $('victory-overlay').classList.remove('active');
  startGame();
}

// ==================== 键盘事件 ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const gameScreen = $('game-screen');
    const deathOverlay = $('death-overlay');
    const victoryOverlay = $('victory-overlay');

    if (!gameScreen.classList.contains('hidden') && !deathOverlay.classList.contains('active')) {
      e.preventDefault();
      submitAnswer();
    } else if (deathOverlay.classList.contains('active')) {
      e.preventDefault();
      retryGame();
    } else if (victoryOverlay.classList.contains('active')) {
      e.preventDefault();
      retryGame();
    }
  }
});

// ==================== 初始显示标题画面 ====================
hideAllScreens();
$('title-screen').classList.remove('hidden');

console.log('🏯 秦王殿奏对 — 已就绪');
console.log('📜 题库：' + ALL_QUESTIONS.length + ' 道题');
console.log('⚔️  规则：十问连捷则胜，一言不合则斩');
</script>
