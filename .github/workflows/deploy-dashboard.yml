name: 仪表盘自动部署

on:
  schedule:
    # 每小时一次（UTC 整点 = 北京时间整点，改动最多 1 小时生效）
    - cron: '0 * * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths:
      - 'tools/collect-data.ts'
      - 'tools/generate-dashboard.ts'
      - 'docs/个人待办.md'
      - 'docs/目标规划.md'
      - '.github/workflows/deploy-dashboard.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install

      - name: 生成仪表盘
        run: npx tsx tools/generate-dashboard.ts

      - name: 复制到 docs/ 并修复路径
        run: |
          cp reports/造化坊仪表盘.html docs/index.html
          sed -i 's|../docs/workflows/变更日志.md|workflows/变更日志.md|g' docs/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
