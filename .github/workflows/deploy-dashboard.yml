name: 仪表盘自动部署

on:
  schedule:
    # 每小时一次（UTC 整点 = 北京时间整点，改动最多 1 小时生效）
    - cron: '0 * * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths:
      - '造化仪表盘/tools/*.ts'
      - '造化仪表盘/data/*.json'
      - '造化仪表盘/目标规划.md'
      - '造化仪表盘/个人待办.md'
      - '.github/workflows/deploy-dashboard.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 板块 git 统计需要全历史

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 注意：仓库根无 package.json，CI 不自带 node_modules —— 用 npx --yes 在线取 tsx，禁止 npm install
      - name: 生成仪表盘（板块1 工具链，输出 造化仪表盘/reports/）
        run: npx --yes tsx 造化仪表盘/tools/generate-dashboard.ts

      - name: 组装 Pages 站点（_site 仅含 index.html）
        run: |
          mkdir -p _site
          cp 造化仪表盘/reports/造化坊仪表盘.html _site/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
