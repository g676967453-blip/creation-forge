    <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">13</text>
    <text x="32" y="9" font-size="11" font-weight="bold" fill="#000">难度模式</text>
    <text x="32" y="24" font-size="9" fill="#000">普通 / 无尽 / 其他模式</text>
